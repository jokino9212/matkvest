name: MatKvest stage17D - quality batch3 gated patch
on:
  push:
    branches: [audit/g3g4-stage17-20261104]
    paths:
      - audits/g3g4_stage17_phaseD_quality_batch3_patch.py
      - audits/g3g4_stage17_phaseD_quality_batch3_test.mjs
      - .github/workflows/g3g4_stage17_phaseD_quality_batch3_patch.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-stage17D-quality-batch3-patch
  cancel-in-progress: false
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g3g4-stage17-20261104
          persist-credentials: true
      - name: Verify immutable v45 candidate and PWA
        run: |
          echo 'fa3810ac65800b14dfaf5b041598c1a3c21a93e92c71fccc9b00899b3dabf741  index.html' | sha256sum --check
          python3 audits/g7_stage12_sync_pwa.py --check
      - name: Patch three G3 geometric topics and synchronize PWA v46
        run: |
          python3 audits/g3g4_stage17_phaseD_quality_batch3_patch.py
          python3 audits/g7_stage12_sync_pwa.py --check
          grep -F 'matkvest-iphone-v46' sw.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify 4500 independent G3 math and drawing models
        run: node audits/g3g4_stage17_phaseD_quality_batch3_test.mjs
      - name: Prepare independent previous-batches and full regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          h=hashlib.sha256(Path('index.html').read_bytes()).hexdigest()
          old='fa4db04c3a53351ed672b12daa577a2ea3bb1376932f13b821e50db95436cd9a'
          for stem in ('g3g4_stage17_phaseD_semantics','g3g4_stage17_phaseD_recovery_theory'):
              s=Path('audits/'+stem+'.mjs').read_text(encoding='utf8')
              if s.count(old)!=1:raise SystemExit('Unexpected baseline pin '+stem)
              Path('audits/_batch3_'+stem+'.mjs').write_text(s.replace(old,h),encoding='utf8')
          for stage,cache in [(1,44),(2,45)]:
              source=Path('audits/g3g4_stage17_phaseD_quality_batch'+str(stage)+'_test.mjs').read_text(encoding='utf8')
              name='matkvest-iphone-v'+str(cache)
              if source.count(name)!=1:raise SystemExit('Unexpected prior batch cache '+str(stage))
              source=source.replace(name,'matkvest-iphone-v46')
              original='g3g4_stage17_phaseD_quality_batch'+str(stage)+'_test_report.json'
              target='g3g4_stage17_phaseD_quality_batch3_previous_batch'+str(stage)+'_report.json'
              if source.count(original)!=1:raise SystemExit('Unexpected prior batch report name '+original)
              Path('audits/_batch3_previous_batch'+str(stage)+'.mjs').write_text(source.replace(original,target),encoding='utf8')
          source=Path('audits/g1g2_stage16_phaseD_regression.mjs').read_text(encoding='utf8')
          source=source.replace('g1g2_stage16_phaseD_regression_report.json','g3g4_stage17_phaseD_quality_batch3_crossgrade_report.json')
          Path('audits/_batch3_crossgrade.mjs').write_text(source,encoding='utf8')
          PY
      - name: Confirm previous quality batch 1 still passes
        run: node audits/_batch3_previous_batch1.mjs
      - name: Confirm previous quality batch 2 still passes
        run: node audits/_batch3_previous_batch2.mjs
      - name: Full 3-4 grade semantic audit
        run: |
          node audits/_batch3_g3g4_stage17_phaseD_semantics.mjs
          cp audits/g3g4_stage17_phaseD_semantics_report.json audits/g3g4_stage17_phaseD_quality_batch3_semantics_report.json
      - name: Real recovery, mobile UI and theory regression
        run: |
          node audits/_batch3_g3g4_stage17_phaseD_recovery_theory.mjs
          cp audits/g3g4_stage17_phaseD_recovery_theory_report.json audits/g3g4_stage17_phaseD_quality_batch3_recovery_report.json
      - name: Crossgrade 1-2 and 3-5-7-8 regression
        run: node audits/_batch3_crossgrade.mjs
      - name: Upload all evidence regardless of test outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-stage17D-quality-batch3-evidence
          path: |
            audits/g3g4_stage17_phaseD_quality_batch3_patch_report.json
            audits/g3g4_stage17_phaseD_quality_batch3_test_report.json
            audits/g3g4_stage17_phaseD_quality_batch3_previous_batch1_report.json
            audits/g3g4_stage17_phaseD_quality_batch3_previous_batch2_report.json
            audits/g3g4_stage17_phaseD_quality_batch3_semantics_report.json
            audits/g3g4_stage17_phaseD_quality_batch3_recovery_report.json
            audits/g3g4_stage17_phaseD_quality_batch3_crossgrade_report.json
          if-no-files-found: warn
      - name: Commit only fully validated v46 to working branch
        if: success()
        run: |
          set -eu
          python3 audits/g7_stage12_sync_pwa.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js audits/g7_stage12_sync_pwa.py
          git add audits/g3g4_stage17_phaseD_quality_batch3_patch_report.json
          git add audits/g3g4_stage17_phaseD_quality_batch3_test_report.json
          git add audits/g3g4_stage17_phaseD_quality_batch3_previous_batch1_report.json
          git add audits/g3g4_stage17_phaseD_quality_batch3_previous_batch2_report.json
          git add audits/g3g4_stage17_phaseD_quality_batch3_semantics_report.json
          git add audits/g3g4_stage17_phaseD_quality_batch3_recovery_report.json
          git add audits/g3g4_stage17_phaseD_quality_batch3_crossgrade_report.json
          git commit -m "fix(stage17D): geometry construction, figure classification and areas with v46"
          git restore -- audits/g3g4_stage17_phaseD_semantics_report.json audits/g3g4_stage17_phaseD_recovery_theory_report.json
          git pull --rebase origin audit/g3g4-stage17-20261104
          git push origin HEAD:audit/g3g4-stage17-20261104
