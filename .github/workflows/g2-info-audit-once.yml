          cat > .grade-two-check.cjs <<'MATKVEST_CHECK'
          'use strict';
          
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const http = require('node:http');
          const path = require('node:path');
          const {chromium} = require('playwright');
          
          const topic = 'g2:math_information';
          const repository = process.env.MATKVEST_CHECK_REPO || path.join(__dirname, 'matkvest-g2-info');
          const baseline = fs.readFileSync(process.env.MATKVEST_CHECK_BASELINE || path.join(__dirname, 'matkvest-g2-info-before.html'));
          let oldBuild = true;
          const types = {
            '.html': 'text/html; charset=utf-8', '.svg': 'image/svg+xml', '.js': 'text/javascript',
            '.png': 'image/png', '.webp': 'image/webp', '.webmanifest': 'application/manifest+json'
          };
          const server = http.createServer((request, response) => {
            const url = new URL(request.url, 'http://localhost');
            const asset = path.join(repository, url.pathname === '/' ? 'index.html' : decodeURIComponent(url.pathname));
            const html = url.pathname === '/';
            response.setHeader('Cache-Control', 'no-store');
            response.setHeader('Content-Type', types[path.extname(asset)] || 'application/octet-stream');
            try {
              response.end(html && oldBuild ? baseline : fs.readFileSync(asset));
            } catch {
              response.writeHead(404).end();
            }
          });
          
          function inspectBuild({topic, mode}) {
            function requireThat(condition, message) {
              if (!condition) throw new Error(message);
            }
            const plain = value => value.replace(/\s+/g, ' ').trim();
            const expectedFamilies=[['table_read','pattern_next'],['table_calculate','pattern_rule'],['table_reasoning','algorithm']];
            const sum=values=>values.reduce((a,b)=>a+b,0);
            const bounded=value=>Number.isInteger(value)&&value>=0&&value<=100;
            function solve(prompt,visual,labels){
              requireThat(!labels.length||labels.length>=3&&new Set(labels).size===labels.length,'Invalid answer options');
              const sequence=visual.querySelector('.g2-info-sequence'),algorithm=visual.querySelector('.g2-info-algorithm');
              if(sequence){
                const raw=[...sequence.querySelectorAll('.g2-info-seq-item')].map(node=>node.textContent);
                const gap=raw.indexOf('?'),values=raw.map(value=>value==='?'?null:Number(value));
                const known=values.map((value,index)=>[index,value]).filter(([,value])=>value!==null);
                const [[i,a],[j,b]]=known, step=(b-a)/(j-i),start=a-i*step, answer=start+gap*step;
                requireThat(raw.length===5&&raw.filter(s=>s==='?').length<2&&[2,5,10].includes(Math.abs(step))&&
                  known.every(([index,value])=>bounded(value)&&value===start+index*step),'Invalid constant-step sequence');
                requireThat(sequence.getAttribute('aria-label')==='Числовой ряд: '+raw.map(value=>value==='?'?'пропуск':value).join(', '),'Missing accessible sequence');
                const key=prompt+'|'+raw.join(',');
                if(prompt.startsWith('Какое число будет следующим')){
                  requireThat(gap===4&&bounded(answer)&&labels.length===4,'Invalid continuation');
                  return {family:'pattern_next',answer:String(answer),key,values:[String(step),String(answer)]};
                }
                if(prompt.startsWith('Какое число пропущено внутри ряда')){
                  requireThat(gap>=1&&gap<=3&&bounded(answer)&&!labels.length,'Invalid inner gap');
                  return {family:'pattern_rule',answer:String(answer),key,values:['gap:'+gap+':'+step]};
                }
                const verb=step>0?'Прибавлять':'Вычитать';
                requireThat(prompt==='По какому правилу изменяются числа в ряду?'&&gap===-1&&labels.length===4&&
                  labels.filter(label=>label.startsWith(verb)).length===3&&
                  labels.includes((step>0?'Вычитать':'Прибавлять')+' '+Math.abs(step)),'The direction alone determines the right choice');
                return {family:'pattern_rule',answer:verb+' '+Math.abs(step),key,values:['rule:'+step]};
              }
              if(algorithm){
                const steps=[...algorithm.querySelectorAll('.g2-info-algorithm-step span')].map(node=>node.textContent);
                requireThat(steps.length===3&&!labels.length,'Incorrect algorithm or input mode');
                const start=Number(steps[0].match(/^Начни с числа (\d+)\.$/)[1]);
                const ops=steps.slice(1).map(text=>{
                  const match=text.match(/^(Прибавь|Вычти) (\d+|\?)\.$/);
                  requireThat(match,'Invalid algorithm step');
                  return {sign:match[1]==='Прибавь'?1:-1,magnitude:match[2]==='?'?null:Number(match[2])};
                });
                const hidden=ops.findIndex(op=>op.magnitude===null);
                const target=prompt.match(/^После всех шагов получилось (\d+)\. Какое число пропущено в алгоритме\?$/);
                requireThat(Boolean(target)===(hidden!==-1)&&ops.filter(op=>op.magnitude===null).length<=1,'Ambiguous algorithm');
                const partial=start+sum(ops.map(op=>op.sign*op.magnitude));
                const answer=target?(Number(target[1])-partial)*ops[hidden].sign:partial;
                if(hidden>=0)ops[hidden].magnitude=answer;
                const mid=start+ops[0].sign*ops[0].magnitude,result=mid+ops[1].sign*ops[1].magnitude;
                requireThat([start,mid,result,answer].every(bounded)&&ops.every(op=>op.magnitude>=1&&op.magnitude<=15)&&
                  (!target||result===Number(target[1])),'Algorithm result outside course range');
                return {family:'algorithm',answer:String(answer),key:prompt+steps.join('|'),values:[hidden+':'+ops.map(op=>op.sign).join(','),'result:'+result]};
              }
          
              const table=visual.querySelector('table.g1-simple-table');
              requireThat(table&&table.querySelector('caption')?.textContent&&table.querySelectorAll('thead th[scope="col"]').length===2&&
                table.querySelectorAll('tbody th[scope="row"]').length===3,'Missing table caption or row and column headers');
              const rows=[...table.querySelectorAll('tbody tr')].map(row=>[row.cells[0].textContent,row.cells[1].textContent]);
              const rowNames=rows.map(([name])=>name), values=new Map(rows.map(([name,value])=>[name,value==='?'?null:Number(value)]));
              const value=name=>{requireThat(values.has(name),'Unknown table row '+name);return values.get(name);};
              const visible=rows.filter(([,v])=>v!=='?').map(([,v])=>Number(v));
              requireThat(values.size===3&&visible.every(bounded)&&new Set(visible).size===visible.length,'Table ambiguously identifies rows');
              const footer=table.querySelector('tfoot td'),key=prompt+'|'+JSON.stringify(rows)+(footer?.textContent||'');
              const cell=prompt.match(/^Какое число стоит в строке «(.+)»\?$/);
              if(cell)return {family:'table_read',answer:String(value(cell[1])),key,values:['cell']};
              const row=prompt.match(/^В какой строке стоит число (\d+)\?$/);
              if(row)return {family:'table_read',answer:rows.find(([,v])=>v===row[1])[0],key,values:['row']};
              const extreme=prompt.match(/^В какой строке стоит самое (маленькое|большое) число\?$/);
              if(extreme){
                const number=extreme[1]==='маленькое'?Math.min(...visible):Math.max(...visible);
                return {family:'table_read',answer:rows.find(([,v])=>Number(v)===number)[0],key,values:[extreme[1]]};
              }
              const addition=prompt.match(/^Чему равна сумма чисел в строках «(.+)» и «(.+)»\?$/);
              const difference=prompt.match(/^На сколько число в строке «(.+)» больше, чем в строке «(.+)»\?$/);
              if(addition||difference){
                const [,first,second]=addition||difference;
                requireThat(!labels.length&&first!==second&&value(first)>value(second),'Invalid comparison or pair');
                const answer=addition?value(first)+value(second):value(first)-value(second);
                const pair=[rowNames.indexOf(first)+1,rowNames.indexOf(second)+1].sort().join('');
                return {family:'table_calculate',answer:String(answer),key,values:[(addition?'sum:':'difference:')+pair]};
              }
              const missing=prompt.match(/^Какое число должно стоять в пустой ячейке строки «(.+)»\?$/);
              if(missing){
                requireThat(footer&&footer.parentElement.cells[0].textContent==='Всего'&&value(missing[1])===null&&visible.length===2&&!labels.length,
                  'Missing or exposed unknown table cell');
                const answer=Number(footer.textContent)-sum(visible);
                requireThat(bounded(answer)&&!visible.includes(answer),'Invalid reconstructed value');
                return {family:'table_reasoning',answer:String(answer),key,values:['missing:'+(rowNames.indexOf(missing[1])+1)]};
              }
              requireThat(prompt==='Какое утверждение верно по данным таблицы?'&&labels.length===4&&visible.length===3&&!footer,'Unknown table exercise');
              const assertions=labels.map(label=>{
                const total=label.match(/^Сумма трёх значений — (\d+)\.$/);
                if(total)return {label,correct:sum(visible)===Number(total[1]),type:'total'};
                const pairSum=label.match(/^Сумма чисел в строках «(.+)» и «(.+)» — (\d+)\.$/);
                if(pairSum)return {label,correct:value(pairSum[1])+value(pairSum[2])===Number(pairSum[3]),type:'pair'};
                const gap=label.match(/^В строке «(.+)» на (\d+) больше, чем в строке «(.+)»\.$/);
                if(gap)return {label,correct:value(gap[1])-value(gap[3])===Number(gap[2]),type:'gap'};
                const order=label.match(/^В строке «(.+)» больше, чем в строке «(.+)»\.$/);
                requireThat(order,'Unknown assertion');
                return {label,correct:value(order[1])>value(order[2]),type:'order'};
              });
              const correct=assertions.filter(a=>a.correct);
              requireThat(correct.length===1,'Several assertions are true');
              return {family:'table_reasoning',answer:correct[0].label,key,values:['statement:'+correct[0].type]};
            }
            function submit(panel, answer) {
              const field=panel.querySelector('#quizInput');
              if(field){
                field.value=answer;
                field.dispatchEvent(new Event('input',{bubbles:true}));
                panel.querySelector('#quizCheck').click();
                return;
              }
              const button=[...panel.querySelectorAll('button.answer')].find(option=>plain(option.textContent)===answer);
              requireThat(button,'Independently solved option missing from the screen');
              button.click();
            }
          
            function seedRandom(value) {
              Math.random = () => ((value = (Math.imul(value, 1664525) + 1013904223) >>> 0) / 4294967296);
            }
            function siblingQuestions() {
              seedRandom(19503);
              return g2AllTopics().filter(t=>t.id!==topic&&t.implemented!==false).flatMap(t => [0,1,2].flatMap(level =>
                Array.from({length:12}, () => makeG2Question(t.id, level))));
            }
          
            if (mode === 'baseline') {
              const siblings = siblingQuestions();
              seedRandom(195);
              for (const level of [0,1]) {
                openG2Topic(topic);
                document.querySelectorAll('#modal .stage-card')[level].click();
                for (let i=0; i<STAGES[level].count; i++) {
                  submit(document.querySelector('#qstage'),q.ans);
                  document.querySelector('#quizNext').click();
                }
              }
              const stored = deepCopy(progressFor(topic));
              requireThat(JSON.stringify(stored.best) === '[5,7,0]' && JSON.stringify(stored.bonus) === '[true,true,false]', 'Baseline did not produce saved progress');
              return {siblings, stored, historyIds:state.attemptHistory.map(attempt=>attempt.id)};
            }
          
            const otherTopics = siblingQuestions();
            seedRandom(19601);
            const holder = document.createElement('div');
            const seen = expectedFamilies.map(() => new Set());
            const coverage=expectedFamilies.map(()=>new Map());
            const stories = expectedFamilies.map(()=>new Set());
            let generated=0, accepted=0, completed=0, rejected=0, entered=0, selected=0;
            for (const level of [0,1,2]) {
              for (let i=0; i<3200; i++) {
                const question = makeG2Question(topic, level);
                holder.innerHTML = '<div>' + question.text + '</div>' + quizVisualHtml(question);
                const prompt = plain(holder.firstElementChild.textContent);
                const labels = question.choices.map(option=>option.label);
                const task = solve(prompt, holder, labels);
                requireThat(task.answer === String(question.ans) && (question.answerMode==='number' ? labels.length===0 : labels.filter(label=>label===task.answer).length===1), 'Generated answer disagrees with an independent solution');
                requireThat(expectedFamilies[level].includes(task.family), 'Unexpected family on level ' + level);
                seen[level].add(task.family);
                stories[level].add(task.key);
                const values=coverage[level].get(task.family)||new Set();
                task.values.forEach(value=>values.add(value));
                coverage[level].set(task.family,values);
                generated++;
              }
              requireThat(seen[level].size===expectedFamilies[level].length, 'Insufficient coverage of the level');
              for (let run=0; run<6; run++) {
                openG2Topic(topic);
                const stages = [...document.querySelectorAll('#modal .stage-card')];
                for (const stage of stages) {
                  const rect=stage.getBoundingClientRect();
                  requireThat(rect.width>0 && rect.left>=-1 && rect.right<=innerWidth+1,'Stage card overflow');
                }
                const stage=stages[level];
                requireThat(!stage.disabled, 'Level not unlocked');
                stage.click();
                const keys=new Set(), methods=new Set();
                for (let i=0; i<STAGES[level].count; i++) {
                  const panel=document.querySelector('#qstage');
                  const choices=[...panel.querySelectorAll('button.answer')];
                  const labels=choices.map(button=>plain(button.textContent));
                  const task=solve(plain(panel.querySelector('.quizq').textContent),panel,labels);
                  const seqTops=[...panel.querySelectorAll('.g2-info-seq-item')].map(item=>item.getBoundingClientRect().top);
                  if(seqTops.length)requireThat(Math.max(...seqTops)-Math.min(...seqTops)<1,'Sequence wraps on mobile');
                  requireThat(expectedFamilies[level].includes(task.family) && !keys.has(task.key), 'Bad level or repetition inside an attempt');
                  keys.add(task.key);
                  methods.add(task.family);
                  for (const element of panel.querySelectorAll('.g1-simple-table, .g2-info-seq-item, .g2-info-algorithm-step, button.answer, #quizInput')) {
                    const rect=element.getBoundingClientRect();
                    requireThat(rect.width>0 && rect.left>=-1 && rect.right<=innerWidth+1, 'Question overflowing viewport');
                  }
                  if (run===0 && i===0) {
                    const wrong=labels.length ? labels.find(label=>label!==task.answer) : String((Number(task.answer)+1)%101);
                    submit(panel,wrong);
                    requireThat(blockSession.correct===i && blockSession.done===i && /Пока неверно/.test(document.querySelector('#qfb').textContent), 'Wrong answer was not rejected');
                    rejected++;
                  }
                  submit(panel,task.answer);
                  if(labels.length)selected++;else entered++;
                  const item=blockSession.items.at(-1);
                  const expectedScore=i+1-(run===0?1:0);
                  requireThat(blockSession.correct===expectedScore && blockSession.done===i+1 &&
                    item.finalCorrect && item.firstTry===!(run===0 && i===0), 'Answer handling differed from the level scoring rules: '+task.key);
                  accepted++;
                  const next=document.querySelector('#quizNext');
                  if (i+1===STAGES[level].count) requireThat(/Посмотреть результат/.test(next.textContent), 'Result button is missing');
                  next.click();
                }
                requireThat(methods.size===expectedFamilies[level].length, 'An attempt missed an action');
                const expectedBest=STAGES[level].count-(level===2 && run===0?1:0);
                requireThat(progressFor(topic).best[level]===expectedBest && progressFor(topic).bonus[level], 'Progress not saved');
                completed++;
              }
            }
            const steps=[2,5,10,-2,-5,-10];
            const requiredExamples=[
              {table_read:['cell','row','маленькое','большое'],pattern_next:[...steps.map(String),'0','100']},
              {table_calculate:['12','13','23'].flatMap(pair=>['sum:'+pair,'difference:'+pair]),
                pattern_rule:steps.flatMap(step=>['rule:'+step,...[1,2,3].map(gap=>'gap:'+gap+':'+step)])},
              {table_reasoning:['missing:1','missing:2','missing:3','statement:total','statement:pair','statement:gap','statement:order'],
                algorithm:[-1,0,1].flatMap(hidden=>['1,1','1,-1','-1,1','-1,-1'].map(signs=>hidden+':'+signs))}
            ];
            for(const [level,families] of Object.entries(requiredExamples)){
              for(const [family,examples] of Object.entries(families)){
                requireThat(examples.every(value=>coverage[level].get(family)?.has(value)),'Missing edge cases for '+family+': '+examples.filter(value=>!coverage[level].get(family)?.has(value)));
              }
            }
            const cases=Object.fromEntries(coverage.flatMap(level=>[...level].map(([family,values])=>[family,values.size])));
            const overlaps=[[0,1],[0,2],[1,2]].map(([a,b])=>[...stories[a]].filter(key=>stories[b].has(key)).length);
            requireThat(overlaps.every(count=>count===0), 'Same prompt exists on more than one level');
            return {otherTopics, generated, accepted, entered, selected, completed, rejected, cases, overlaps, familyByLevel:seen.map(level=>[...level].sort()), progress:deepCopy(progressFor(topic))};
          }
          
          (async () => {
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
            const address = 'http://127.0.0.1:' + server.address().port;
            let browser;
            try {
              browser=await chromium.launch({headless:true,executablePath:process.env.MATKVEST_CHECK_CHROMIUM});
              for (const width of [320,390,1280]) {
                const context=await browser.newContext({viewport:{width,height:850},isMobile:width<500,hasTouch:width<500,serviceWorkers:'block'});
                try {
                  const page=await context.newPage();
                  const errors=[];
                  page.on('pageerror',error=>errors.push(error.message));
                  oldBuild=true;
                  await page.goto(address);
                  await page.locator('button[onclick="openGrade(2)"]').click();
                  const card=page.locator('button.topic').filter({has:page.getByText('Математическая информация',{exact:true})});
                  await card.click();
                  assert.equal(await page.locator('#modal .stage-card:disabled').count(),2);
                  const old=await page.evaluate(inspectBuild,{topic,mode:'baseline'});
                  oldBuild=false;
                  await page.reload();
                  assert.deepEqual(await page.evaluate(key=>({stored:progressFor(key),historyIds:state.attemptHistory.map(attempt=>attempt.id)}),topic),{stored:old.stored,historyIds:old.historyIds});
                  const stagePicker = page.locator('#modal .stage-card').first();
                  if (!(await stagePicker.isVisible())) {
                    if (!(await card.isVisible())) await page.locator('button[onclick="openGrade(2)"]').click({timeout:8000});
                    await card.click({timeout:8000});
                  }
                  assert.match(await page.locator('#modal h2').textContent(), /Математическая информация/);
                  assert.equal(await page.locator('#modal .stage-card:disabled').count(),0);
                  assert.match(await page.locator('#modal .elementary-theory').textContent(), /30 − 8 − 12 = 10/);
                  assert.match(await page.locator('#modal .elementary-theory').textContent(), /Восстанови значение по итогу/);
                  assert.match(await page.locator('#modal .stage-card').nth(2).textContent(), /Восстанови ячейку/);
                  const {otherTopics,...result}=await page.evaluate(inspectBuild,{topic,mode:'candidate'});
                  assert.deepEqual(otherTopics,old.siblings);
                  const savedHistory = await page.evaluate(key=>state.attemptHistory.filter(row=>row.key===key).map(row=>row.id),topic);
                  assert.equal(savedHistory.length,20);
                  await page.reload();
                  assert.deepEqual(await page.evaluate(key=>progressFor(key),topic),{best:[5,7,10],bonus:[true,true,true]});
                  assert.deepEqual(await page.evaluate(key=>state.attemptHistory.filter(row=>row.key===key).map(row=>row.id),topic),savedHistory);
                  assert(old.historyIds.every(id=>savedHistory.includes(id)));
                  assert.match(await page.locator('#modal .subtle').filter({hasText:'Пройдено этапов'}).last().textContent(),/3\/3/);
                  assert.deepEqual(errors,[]);
                  console.log(JSON.stringify({width,siblingSamples:otherTopics.length,oldProgress:old.stored,oldHistory:old.historyIds.length,savedAttempts:savedHistory.length,...result}));
                } finally {
                  await context.close();
                }
              }
            } finally {
              await browser?.close();
              server.close();
            }
          })().catch(error=>{console.error(error);process.exitCode=1;});
          MATKVEST_CHECK
          MATKVEST_CHECK_REPO="$PWD" MATKVEST_CHECK_BASELINE="$RUNNER_TEMP/g2-info-before.html" node .grade-two-check.cjs
