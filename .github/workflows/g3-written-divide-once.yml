name: Grade 3 written division complete audit
on:
  push:
    branches: [audit/g1-g4-content-v195]
    paths:
      - .github/workflows/g3-written-divide-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Independently check 10800 long division problems and steps
        run: node audits/g3_written_divide_generator_browser.cjs
      - name: Check division cells, wrong digits, stage progress and reload
        run: node audits/g3_written_divide_progress_browser.cjs
