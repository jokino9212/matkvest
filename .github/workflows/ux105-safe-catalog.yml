name: UX105 safe new-pet catalog contracts and release guard
on:
  push:
    branches: [feature/ux105-ten-new-pets-20261110]
    paths:
      - 'audits/ux105_new_pets_manifest.json'
      - 'audits/ux105_baseline_pets.json'
      - 'audits/ux105_stage_v107.py'
      - 'audits/ux105_guard_test.py'
      - 'audits/ux105_contract_browser.cjs'
      - 'audits/ux105_v107_browser.cjs'
      - '.github/workflows/ux105-safe-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ten-new-pets-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check future approved-art browser gate
        run: node --check audits/ux105_v107_browser.cjs
      - name: Protect original catalog and saved data / refuse release without unique genuine WebP
        run: |
          python3 -m py_compile audits/ux105_stage_v107.py audits/ux105_guard_test.py
          python3 audits/ux105_guard_test.py
      - name: Install real browser
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify 20 current pets and price/rarity baseline, 10 new IDs without conflict
        run: timeout 160s node audits/ux105_contract_browser.cjs
      - name: Ensure PWA remains v106 and no unpublished pet sources in HTML
        run: |
          grep -q 'matkvest-iphone-v106' sw.js
          ! grep -q 'mk-ux105-ten-original-pets' index.html
