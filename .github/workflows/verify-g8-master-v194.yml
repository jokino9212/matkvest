name: Inspect Grade 8 graph and table APIs
on:
  push:
    branches: [verify/g8-master-v194]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source=Path('index.html').read_text()
          names=r'g7GraphData|g7LineSeries|g7AttachGraph|g7GraphSvg|g7GraphHtml|g7GraphTable|g6AttachTable|g7StrictChoice|g7Number|g8Sup82|g8Function|g8.*?Absolute'
          declarations=[m for m in re.finditer(r'^(?:function\s+(?:'+names+r')\s*\(|const (?:g7GraphData|g7LineSeries|g7AttachGraph|g6AttachTable)\s*=)',source,re.M)]
          for match in declarations:
              excerpt=source[match.start():]
              end=re.search(r'\n(?:function |const |let |//|/\*|</script>)',excerpt)
              print('---',match.group(0))
              for line in excerpt[:end.start() if end else 1300].splitlines()[:55]:
                  print(line[:650])
          for identifier in ['function_concept','function_representations','absolute_value_function','function_domain_range']:
              print('---',identifier)
              rows=[line for line in source.splitlines() if len(line)<750 and identifier in line]
              for line in rows[:25]:
                  print(line)
          PY
