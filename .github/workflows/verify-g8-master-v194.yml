name: Inspect Grade 8 area exercise templates
on:
  push:
    branches: [verify/g8-master-v194]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source=Path("index.html").read_text()
          lines=source.splitlines()
          p=re.compile(r"рамк|плитку|tileBorder|square_frame|frame_inside|rect_ratio|area_properties:\[|triangle_area:\[|parallelogram_rhombus_area:\[|trapezoid_area:\[|g7-stage5-area6870")
          near=set()
          for i,line in enumerate(lines):
              if len(line)<1400 and p.search(line):
                  near.update(range(max(0,i-2),min(len(lines),i+4)))
          for n in sorted(near)[:250]:
              if len(lines[n])<1400:print(n+1,lines[n])
          PY
