name: MatKvest UI stage19C2 - compact responsive header and cards gate
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19c2_gate.yml
      - audits/ui_stage19c2_patch.py
      - audits/ui_stage19c2_test.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-ui19c2-v59
  cancel-in-progress: false
jobs:
  layout-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          persist-credentials: true
          fetch-depth: 0
      - name: Apply v59 patch only on verified v58 HTML SHA256
        run: python3 audits/ui_stage19c2_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Test 10 widths, desktop and tablet header, cards, click safety, screenshots
        run: node audits/ui_stage19c2_test.mjs
      - name: Retest 19A card interactions, focus, touch and shortcuts
        run: |
          sed 's/matkvest-iphone-v56/matkvest-iphone-v59/g' audits/ui_stage19a_test.mjs > audits/_ui19c2_regress_a.mjs
          node audits/_ui19c2_regress_a.mjs
          rm audits/_ui19c2_regress_a.mjs
      - name: Retest 19B navigation with new tablet disclosure breakpoint
        run: |
          sed -e 's/matkvest-iphone-v57/matkvest-iphone-v59/g' -e 's/if(width<=600){/if(width<=768){/g' audits/ui_stage19b_test.mjs > audits/_ui19c2_regress_b.mjs
          node audits/_ui19c2_regress_b.mjs
          rm audits/_ui19c2_regress_b.mjs
      - name: Retest previous UI19C visual consistency, topic keyboard and grade navigation
        run: |
          sed -e 's/matkvest-iphone-v58/matkvest-iphone-v59/g' -e 's/state.mobileMenu===(w<=600)/state.mobileMenu===(w<=1120)/g' audits/ui_stage19c_test.mjs > audits/_ui19c2_regress_c.mjs
          node audits/_ui19c2_regress_c.mjs
          rm audits/_ui19c2_regress_c.mjs
      - name: Run grade 1,2,3,5,6,8 practice regression
        run: |
          SHA="$(sha256sum index.html | cut -d' ' -f1)"
          sed "s/f188d39a3a16fc54dfb32238fc34d3dfe6cc3c4416cd475579bf3ed65a7e1e36/$SHA/g" audits/g7_stage14_crossgrade_test.mjs > audits/_ui19c2_crossgrade.mjs
          node audits/_ui19c2_crossgrade.mjs
          rm audits/_ui19c2_crossgrade.mjs
      - name: Run grade 4 handwritten/table exercise regression
        run: |
          SHA="$(sha256sum index.html | cut -d' ' -f1)"
          sed "s/f188d39a3a16fc54dfb32238fc34d3dfe6cc3c4416cd475579bf3ed65a7e1e36/$SHA/g" audits/g7_stage14_grade4_test.mjs > audits/_ui19c2_grade4.mjs
          node audits/_ui19c2_grade4.mjs
          rm audits/_ui19c2_grade4.mjs
      - name: Validate cache version and service-worker fingerprint
        run: python3 audits/g7_stage12_sync_pwa.py --check
      - name: Save before/after screenshots as inspectable review data
        if: success()
        run: |
          for name in home_390 home_768 home_1280 grade1_1280 menu_768; do
            base64 -w0 "audits/ui19c2_after_$name.png" > "audits/ui19c2_review_$name.b64.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matkvest-ui19c2-v59-header-cards-screenshots
          path: |
            audits/ui_stage19c2_patch_report.json
            audits/ui_stage19c2_test_report.json
            audits/ui19c2_after_*.png
          if-no-files-found: warn
      - name: Persist only passed v59 to audit branch
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js audits/ui_stage19c2_patch_report.json audits/ui_stage19c2_test_report.json audits/ui19c2_review_*.b64.txt
          git diff --cached --quiet || git commit -m "feat(ui19C2): one-row adaptive header and compact class cards v59"
          for file in audits/ui_stage19a_test_report.json audits/ui_stage19b_test_report.json audits/ui_stage19c_test_report.json audits/g7_stage14_crossgrade_report.json audits/g7_stage14_grade4_report.json; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then git restore -- "$file"; else rm -f "$file"; fi
          done
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
