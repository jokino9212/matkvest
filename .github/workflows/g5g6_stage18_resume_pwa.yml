name: MatKvest stage18F - v54 resume and PWA gate
on:
  push:
    branches: [audit/g5g6-stage18-20261105]
    paths:
      - .github/workflows/g5g6_stage18_resume_pwa.yml
      - audits/g5g6_stage18_resume_pwa_test.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-stage18f-resume-pwa
  cancel-in-progress: false
jobs:
  browser-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g5g6-stage18-20261105
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Puppeteer
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Test G5/G6 fraction form recovery and real PWA transition v50 to v54
        run: node audits/g5g6_stage18_resume_pwa_test.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-stage18f-resume-pwa
          path: audits/g5g6_stage18_resume_pwa_report.json
          if-no-files-found: warn
      - name: Persist report if all tests pass
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/g5g6_stage18_resume_pwa_report.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(stage18F): verify fraction draft recovery, offline and PWA upgrade"
            git pull --rebase origin audit/g5g6-stage18-20261105
            git push origin HEAD:audit/g5g6-stage18-20261105
          fi
