name: Grade 3 tens and hundreds audit and patch
on:
  push:
    branches: [audit/g1-g4-content-v195]
    paths:
      - .github/workflows/g3-round-numbers-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped generator patch
        run: python3 audits/g3_round_numbers_patch.py
      - name: Prepare Chromium
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify 14400 answers across three sizes
        run: node audits/g3_round_numbers_browser.cjs
      - name: Verify 5-7-10 completion and F5 persistence
        run: node audits/g3_round_numbers_progress_browser.cjs
      - name: Commit source only after all checks pass
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'Expand Grade 3 tens and hundreds stages (verified)'
          git push origin HEAD:audit/g1-g4-content-v195
