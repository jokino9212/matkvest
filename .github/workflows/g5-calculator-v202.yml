name: Verify Grade 5 calculator wording
on:
  push:
    branches: [verify/g5-calculator-v202]
    paths: [.github/workflows/g5-calculator-v202.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply and verify candidate
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout --detach a6eb08e1aeefffd09ad8c828fc9753ebd2d2de90
          base64 -d <<'PATCH' | gzip -d | git apply --check
          
          PATCH
          base64 -d <<'PATCH' | gzip -d | git apply
          
          PATCH
          git diff --check
          node --check g5-pedagogy-v113.js
          node --check sw.js
          npm install --no-save --no-package-lock playwright@1.56.1
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { chromium } = require('playwright');
          const hash = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const sw = fs.readFileSync('sw.js', 'utf8');
          assert(sw.includes('APP_BUILD_HASH = "' + hash('index.html') + '"'));
          assert(sw.includes('"g5-pedagogy-v113.js": "' + hash('g5-pedagogy-v113.js') + '"'));
          (async () => {
            const browser = await chromium.launch({args: ['--no-sandbox']});
            try {
              const page = await browser.newPage();
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              await page.goto('file://' + process.cwd() + '/index.html');
              await page.evaluate(() => startG5QuizStage('calculator', 1));
              const prompt = await page.getByText(/На калькуляторе сложи/).innerText({timeout: 5000});
              const parts = prompt.match(/На калькуляторе сложи (\d+) и (\d+)\. Затем умножь полученную сумму на (\d+)\. Какое число получится\?/);
              assert(parts, prompt);
              const [a, b, c] = parts.slice(1).map(Number);
              const answer = String((a + b) * c);
              await page.getByRole('button', {name: answer, exact: true}).click({timeout: 5000});
              assert.match(await page.locator('#qfb').innerText(), /верно/i);
              assert.deepEqual(errors, []);
              console.log(JSON.stringify({prompt, answer}));
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add g5-pedagogy-v113.js index.html sw.js
          git commit -m 'Clarify Grade 5 calculator exercise'
          git push origin HEAD:refs/heads/audit/g5-calculator-v202
