name: Grade 5 sequential §20 authentic formulas
on:
  push:
    branches:
      - audit/g5-sequential-paragraph20-v155-20261114
  pull_request:
    branches:
      - main
    paths:
      - 'g5-arithmetic-tiers-v123.js'
      - 'g5-textbook-v111.js'
      - 'audits/g5_sequential_paragraph20_browser_oracle.cjs'
      - '.github/workflows/g5-sequential-20.yml'
jobs:
  real-formulas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check g5-arithmetic-tiers-v123.js
          node --check g5-textbook-v111.js
          node --check audits/g5_sequential_paragraph20_browser_oracle.cjs
      - name: Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Independently check 600 live formulas with learner-visible numbers
        run: node audits/g5_sequential_paragraph20_browser_oracle.cjs
      - name: Regression §1 through §19
        run: |
          node audits/g5_sequential_paragraphs01_03_browser.cjs
          for f in audits/g5_sequential_paragraph??_browser_oracle.cjs; do if [ "$f" != "audits/g5_sequential_paragraph20_browser_oracle.cjs" ]; then node "$f"; fi; done
      - name: Verify all 74 topics and their family metadata
        run: node audits/g5_v132_74_real_cognitive_inventory.cjs
