name: Quiz stage02 fraction input baseline
on:
  push:
    branches: [fix/quiz-fractions-stage01-20261110]
    paths:
      - audits/quiz_stage02_input_browser.cjs
      - audits/quiz_stage02_fix.py
      - .github/workflows/quiz-stage02-input-baseline.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Apply stage02 UI candidate and recompute PWA build hash
        run: python3 audits/quiz_stage02_fix.py
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Test actual fraction-box behavior at 390 and 1280px
        run: node audits/quiz_stage02_input_browser.cjs
      - name: Regress stage01 fraction math, real Next transitions, and form checks
        run: |
          node audits/quiz_stage01_fraction_browser.cjs
          node audits/quiz_stage01_navigation_browser.cjs
      - name: Commit validated stage02 UI candidate to working branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(quiz): fraction cells feedback and focus progression"
            git push origin HEAD:fix/quiz-fractions-stage01-20261110
          fi
