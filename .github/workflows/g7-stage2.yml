name: Verify and apply Matkvest G7 Stage 2 (isolated branch)
on:
  push:
    branches:
      - audit/g7-geometry-stage2-2026-11-03
    paths:
      - .github/workflows/g7-stage2.yml
permissions:
  contents: write
jobs:
  validate_and_apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated G7 branch
        uses: actions/checkout@v4
        with:
          ref: audit/g7-geometry-stage2-2026-11-03
          persist-credentials: true
      - name: Check patcher and test syntax
        run: |
          node --check tools/apply_g7_stage2.js
          node --check tools/test_g7_stage2.js
      - name: Run 15000 isolated question tests
        run: node tools/test_g7_stage2.js
      - name: Apply patch to existing production-derived HTML (branch only)
        run: node tools/apply_g7_stage2.js
      - name: Verify generated HTML and patch boundaries
        run: |
          git diff --check
          node -e 'const fs=require("fs");const s=fs.readFileSync("index.html","utf8");if(!s.includes("function g7Stage2Patch")||s.includes("if(!targeted.has(raw)||Math.random()<0.08"))process.exit(1);console.log("G7-only patch markers OK")'
      - name: Commit verified HTML only to isolated branch
        run: |
          git config user.name "matkvest-stage2-bot"
          git config user.email "matkvest-stage2-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Apply verified G7 geometry stage-2 patch" 
          git push origin HEAD:audit/g7-geometry-stage2-2026-11-03
