                const groups = [...visual.querySelectorAll('.g1-group-box')];
                requireThat(groups.length === 2, 'Expected two groups');
                const [left, right] = groups.map(group => group.querySelectorAll('.g1-counter').length);
                requireThat(inRange([left, right]), 'Invalid size of a group');
                return {family:'compare', key:prompt + left + '/' + right,
