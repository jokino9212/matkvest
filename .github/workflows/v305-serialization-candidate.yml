name: v305 serialization candidate (read-only)
on:
  push:
    branches: [feature/v305-learning-chest-rewards]
    paths:
      - .github/workflows/v305-serialization-candidate.yml
      - audits/v305_serialization_candidate.py
      - audits/v305_serialization_browser.cjs
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'jokino9212/matkvest' && github.ref == 'refs/heads/feature/v305-learning-chest-rewards'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize isolated candidate
        run: |
          python3 audits/g7_stage12_sync_pwa.py --check
          python3 audits/v305_serialization_candidate.py
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          python3 audits/g7_stage12_sync_pwa.py
          python3 audits/g7_stage12_sync_pwa.py --check
          node --check audits/v305_serialization_browser.cjs
      - name: Concurrent operation receipts, stale saves, exhaustion and offline artwork
        run: node audits/v305_serialization_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v305-serialization-candidate-evidence
          path: ci-acceptance-output/v305-king/
          if-no-files-found: warn
