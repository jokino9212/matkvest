name: UX107 production 30 pets, first-paint cache safety and archived purchases
on:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js
      - assets/source/pets/**
      - audits/ux107_firstpaint_archive_browser.cjs
      - .github/workflows/ux107-production-full.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-build:
    name: Real PWA v107 and 30-pet product/archived-purchase regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        name: Baseline previous production v106 for upgrade
        with:
          ref: backup/pre-ux107-pets-main-20261110
          path: baseline_v106
      - name: Verify v107 build, owner-approved art and no stale PWA
        run: |
          python3 - <<'PY'
          import json,hashlib,re
          from pathlib import Path
          h=Path('index.html').read_bytes();w=Path('sw.js').read_text()
          m=json.loads(Path('audits/ux105_new_pets_manifest.json').read_text())
          assert 'matkvest-iphone-v107' in w
          assert re.search(r'const APP_BUILD_HASH = "([0-9a-f]{64})"',w).group(1)==hashlib.sha256(h).hexdigest()
          assert m['artwork']['art_approval']=='approved' and m['artwork']['accepted_count']==10
          assert len(m['items'])==10
          print('UX107_PRODUCTION_INTEGRITY_PASS')
          PY
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Full 30-pet browser/alpha gate
        run: timeout 200s node audits/ux105_v107_browser.cjs
      - name: Three reloads with old/new pet assets and archived bought pet sale exactly once
        run: timeout 200s node audits/ux107_firstpaint_archive_browser.cjs
      - name: Profile/leaderboard badges constrained to 30px
        run: timeout 160s node audits/ux107_badge_firstpaint_browser.cjs
      - name: Upgrade v106 to v107 with two profiles and training draft, offline
        run: timeout 290s node audits/ux107_pwa_upgrade_v106_v107_browser.cjs
      - name: Local profiles and purchases isolation
        run: timeout 150s node audits/stage25_profile_isolation_browser.cjs
      - name: Offline PWA and balances
        run: timeout 150s node audits/stage28_offline_pwa_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux107-production-30-pets-firstpaint-archive-qa
          path: |
            audits/ux105_v107_output/
            audits/ux107_firstpaint_archive_output/
            audits/ux107_badge_firstpaint_output/
          retention-days: 60
