name: MatKvest UI19E legacy resale safety refinement v65
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19e_safety_gate.yml
      - audits/ui_stage19e_safety_patch.py
      - audits/ui_stage19e_legacy_test.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-ui19e-v65
  cancel-in-progress: false
jobs:
  wallet-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          fetch-depth: 0
          persist-credentials: true
      - name: Update source-verified v64 to v65
        run: python3 audits/ui_stage19e_safety_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify historic accessories are excluded from cash-now value
        run: node audits/ui_stage19e_legacy_test.mjs
      - name: Regression - all v64 wallet operations and rendering
        run: |
          sed 's/matkvest-iphone-v64/matkvest-iphone-v65/g' audits/ui_stage19e_test.mjs > audits/_ui19e_safety_wallet.mjs
          node audits/_ui19e_safety_wallet.mjs
          rm audits/_ui19e_safety_wallet.mjs
      - name: Regression - v63 purchases, sales and archived compensation
        run: |
          sed 's/matkvest-iphone-v63/matkvest-iphone-v65/g' audits/ui_stage19d_test.mjs > audits/_ui19e_safety_shop.mjs
          node audits/_ui19e_safety_shop.mjs
          rm audits/_ui19e_safety_shop.mjs
      - name: Regression - v62 crossgrade topic search
        run: |
          sed 's/matkvest-iphone-v62/matkvest-iphone-v65/g' audits/ui_stage19c4_test.mjs > audits/_ui19e_safety_c4.mjs
          node audits/_ui19e_safety_c4.mjs
          rm audits/_ui19e_safety_c4.mjs
      - name: Regression - math question generation
        run: |
          SHA="$(sha256sum index.html | cut -d' ' -f1)"
          sed "s/f188d39a3a16fc54dfb32238fc34d3dfe6cc3c4416cd475579bf3ed65a7e1e36/$SHA/g" audits/g7_stage14_crossgrade_test.mjs > audits/_ui19e_safety_math.mjs
          node audits/_ui19e_safety_math.mjs
          rm audits/_ui19e_safety_math.mjs
      - name: Regression - grade 4 written arithmetic
        run: |
          SHA="$(sha256sum index.html | cut -d' ' -f1)"
          sed "s/f188d39a3a16fc54dfb32238fc34d3dfe6cc3c4416cd475579bf3ed65a7e1e36/$SHA/g" audits/g7_stage14_grade4_test.mjs > audits/_ui19e_safety_grade4.mjs
          node audits/_ui19e_safety_grade4.mjs
          rm audits/_ui19e_safety_grade4.mjs
      - name: PWA source and cache fingerprint
        run: python3 audits/g7_stage12_sync_pwa.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matkvest-ui19e-v65-wallet-legacy-safety
          path: |
            audits/ui_stage19e_safety_patch_report.json
            audits/ui_stage19e_legacy_test_report.json
          if-no-files-found: warn
      - name: Preserve v65 only after full safety regression passes
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js audits/ui_stage19e_safety_patch_report.json audits/ui_stage19e_legacy_test_report.json
          git diff --cached --quiet || git commit -m "fix(ui19E): exclude unavailable legacy accessories from immediate cash-out estimate v65"
          for file in audits/ui_stage19e_test_report.json audits/ui_stage19d_test_report.json audits/ui_stage19c4_test_report.json audits/g7_stage14_crossgrade_report.json audits/g7_stage14_grade4_report.json; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then git restore -- "$file"; else rm -f "$file"; fi
          done
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
