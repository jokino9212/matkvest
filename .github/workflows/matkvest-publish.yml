name: MatKvest deploy verified HTML
on:
  push:
    branches: [main]
    paths:
      - '.deploy/matkvest-g7-stage1/part*'
permissions:
  contents: write
jobs:
  assemble-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble HTML and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts = sorted(Path(".deploy/matkvest-g7-stage1").glob("part*"))
          if len(parts) != 14:
              raise RuntimeError(f"Expected 14 parts, got {len(parts)}")
          data = b"".join(p.read_bytes() for p in parts)
          digest = hashlib.sha256(data).hexdigest()
          expected = "29d53bc819a58b90a482eba495ec06e3fc33bf9c1b2943daa431a4a5bcae5a5e"
          print("HTML bytes:", len(data), "SHA256:", digest)
          if digest != expected:
              raise RuntimeError("Incorrect HTML checksum: refusing deployment")
          if b"noindex,nofollow" not in data or not data.startswith(b"<!doctype html>"):
              raise RuntimeError("Unexpected HTML file: refusing deployment")
          Path("index.html").write_bytes(data)
          sw = Path("sw.js").read_text(encoding="utf-8")
          if sw.count("matkvest-iphone-v38") != 1:
              raise RuntimeError("PWA cache is not at expected v38")
          Path("sw.js").write_text(sw.replace("matkvest-iphone-v38","matkvest-iphone-v39"),encoding="utf-8")
          PY
      - name: Commit verified production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm -rf .deploy/matkvest-g7-stage1
          git commit -m "Deploy MatKvest 8.72: G8 audited, G7 geometry stage 1, PWA v39"
          git push origin HEAD:main
