name: MatKvest UI19F mounting diagnostic
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19f_mount_probe.yml
      - audits/ui_stage19f_mount_probe.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
      - run: python3 audits/ui_stage19f_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - run: node audits/ui_stage19f_mount_probe.mjs
