name: Collection pet viewer v81
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collection-viewer-v81.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collection-viewer-v81-main
  cancel-in-progress: false
jobs:
  patch-verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Patch guarded pet viewer and PWA
        run: python3 audits/fix_collection_pet_viewer_v81.py
      - name: Check source integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          s=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert s.count('v81: prevent collection pet art')==1
          assert s.count('v80: collection avatars')==1
          assert 'matkvest-iphone-v81' in sw
          assert hashlib.sha256(Path('index.html').read_bytes()).hexdigest() in sw
          assert s.count('</body>')==1
          print('PASS v81 static regression checks')
          PY
      - name: Commit v81
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix(collection): v81 normalize pet artwork zoom and PWA'
            git push origin HEAD:main
          fi
