name: MatKvest UI19E finance data contract probe
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19e_probe.yml
      - audits/ui_stage19e_finance_probe.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Identify persisted coin, purchase, refund and chest records
        run: node audits/ui_stage19e_finance_probe.mjs
      - name: Preserve grounded economic source evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/ui_stage19e_finance_baseline.json
          git diff --cached --quiet || git commit -m "audit(ui19E): inspect trustworthy monetary counters and history"
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
