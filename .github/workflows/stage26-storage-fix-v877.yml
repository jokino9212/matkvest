name: Stage26 repair corrupted profile storage v8.77
on:
  push:
    branches: [audit/stage26-storage-resilience-20261107]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/stage26-storage-resilience-20261107
          persist-credentials: true
      - name: Apply safe-storage patch
        run: |
          if ! grep -q 'id="mk-v877-storage-recovery"' index.html; then
            python3 audits/stage26_protect_corrupt_profiles_v877.py
          fi
      - name: Add explicit safe recovery UI and import gate
        run: python3 audits/stage26_recovery_actions_v877.py
      - name: Validate fingerprint and cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          html=Path('index.html').read_bytes()
          sw=Path('sw.js').read_text()
          assert b'8.77' in html and b'8.76' not in html
          assert html.count(b'id="mk-v877-storage-recovery"') == 1
          assert 'matkvest-iphone-v77' in sw
          assert hashlib.sha256(html).hexdigest() in sw
          print('PASS v8.77 integrity')
          PY
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Reproduce corruption and prove preservation
        run: node audits/stage26_corrupt_storage_browser.cjs
      - name: Explicit restore from verified backup
        run: node audits/stage26_verified_recovery_browser.cjs
      - name: Prior regression tests
        run: |
          node audits/stage25_profile_isolation_browser.cjs
          node audits/stage24_attempt_lifecycle_browser.cjs
          node audits/stage22_answer_drafts_browser.cjs
      - name: Commit vetted HTML and cache
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(frontend): v8.77 preserve corrupted profile storage"
            git fetch origin audit/stage26-storage-resilience-20261107
            git rebase origin/audit/stage26-storage-resilience-20261107
            git push origin HEAD:audit/stage26-storage-resilience-20261107
          fi
