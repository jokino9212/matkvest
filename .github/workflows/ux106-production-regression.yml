name: UX106 production regression - badge artwork cannot exceed chips
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'audits/ux106_badge_overflow_browser.cjs'
      - '.github/workflows/ux106-production-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-badge-and-leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Verify v106 PWA cache and HTML digest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          h=Path('index.html').read_bytes()
          w=Path('sw.js').read_text()
          assert 'matkvest-iphone-v106' in w
          assert re.search(r'const APP_BUILD_HASH = "([0-9a-f]{64})"',w).group(1)==hashlib.sha256(h).hexdigest()
          assert h.count(b'id="mk-ux106-profile-badge-sizes"')==1
          print('UX106_PRODUCTION_BUILD_INTEGRITY_PASS')
          PY
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: All badges fit 30px in profile and leaderboard across 320 390 900 1280
        run: timeout 170s node audits/ux106_badge_overflow_browser.cjs
      - name: Collection worth, media viewer and full-screen icons
        run: timeout 180s node audits/stage30_collection_media_browser.cjs
      - name: Local data safety with multiple profiles
        run: timeout 180s node audits/stage25_profile_isolation_browser.cjs
      - name: Offline PWA and balances
        run: timeout 180s node audits/stage28_offline_pwa_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux106-production-profile-badges-visual-qa
          path: audits/ux106_badge_fix_output/
          retention-days: 60
