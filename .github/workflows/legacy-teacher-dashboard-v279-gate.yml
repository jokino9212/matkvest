name: Test-only teacher dashboard Vue and native fallback actions PWA v279 gate
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: teacher-dashboard-v279-test-branch
  cancel-in-progress: false
jobs:
  integrate-test-publish:
    if: github.repository == 'jokino9212/matkvest' && github.ref == 'refs/heads/refactor/route-vue-actions-from-7c14ce9'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/route-vue-actions-from-7c14ce9
          persist-credentials: true
      - name: Apply SHA-locked v278 to v279 teacher dashboard UI patch
        run: python3 audits/legacy_teacher_dashboard_v279_patch.py
      - name: Synchronize PWA and check Python syntax
        run: |
          python3 audits/g7_stage12_sync_pwa.py
          python3 audits/g7_stage12_sync_pwa.py --check
          python3 -m py_compile audits/legacy_teacher_dashboard_v279_patch.py audits/legacy_teacher_dashboard_v279_publish.py
      - name: Install deterministic dependencies and Playwright
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Route and Vue action contracts v271 through v279
        run: |
          node audits/legacy_navigation_core.test.cjs
          node audits/legacy_vue_actions_v271.test.cjs
          node audits/legacy_training_plan_v272.test.cjs
          node audits/legacy_school_actions_v273.test.cjs
          node audits/legacy_school_column_v274.test.cjs
          node audits/legacy_school_frame_journal_v275.test.cjs
          node audits/legacy_reports_teacher_v276.test.cjs
          node audits/legacy_analytics_view_v277.test.cjs
          node audits/legacy_profile_dialog_v278.test.cjs
          node audits/legacy_teacher_dashboard_v279.test.cjs
      - name: Verify deterministic unchanged Vue build
        run: |
          before=$(sha256sum assets/ui/knowledge-map.js | cut -d ' ' -f1)
          npm run build:knowledge-map
          after=$(sha256sum assets/ui/knowledge-map.js | cut -d ' ' -f1)
          test "$before" = "$after"
      - name: Teacher dashboard search/filter/detail, stale controls, offline F5 and HTML fallback
        run: node audits/legacy_teacher_dashboard_v279_browser.cjs
      - name: Existing grade/map, routes, school, plans, journal and teacher regression
        run: |
          sed -e 's/v271/v279/g' -e 's/V271/V279/g' audits/legacy_vue_actions_v271_browser.cjs > audits/legacy_vue_actions_v279_route_browser.cjs
          sed -e 's/v272/v279/g' -e 's/V272/V279/g' audits/legacy_training_plan_v272_browser.cjs > audits/legacy_training_plan_v279_browser.cjs
          sed -e 's/v273/v279/g' -e 's/V273/V279/g' audits/legacy_school_actions_v273_browser.cjs > audits/legacy_school_actions_v279_browser.cjs
          sed -e 's/v274/v279/g' -e 's/V274/V279/g' audits/legacy_school_column_v274_browser.cjs > audits/legacy_school_column_v279_browser.cjs
          sed -e 's/v275/v279/g' -e 's/V275/V279/g' audits/legacy_school_frame_journal_v275_browser.cjs > audits/legacy_school_frame_journal_v279_browser.cjs
          sed -e 's/v276/v279/g' -e 's/V276/V279/g' audits/legacy_reports_teacher_v276_browser.cjs > audits/legacy_reports_teacher_v279_browser.cjs
          sed -e 's/v277/v279/g' -e 's/V277/V279/g' audits/legacy_analytics_view_v277_browser.cjs > audits/legacy_analytics_view_v279_browser.cjs
          node audits/legacy_vue_actions_v279_route_browser.cjs
          node audits/legacy_training_plan_v279_browser.cjs
          node audits/legacy_school_actions_v279_browser.cjs
          node audits/legacy_school_column_v279_browser.cjs
          node audits/legacy_school_frame_journal_v279_browser.cjs
          node audits/legacy_reports_teacher_v279_browser.cjs
          node audits/legacy_analytics_view_v279_browser.cjs
          sed -e 's/v278/v279/g' -e 's/V278/V279/g' audits/legacy_profile_dialog_v278_browser.cjs > audits/legacy_profile_dialog_v279_browser.cjs
          node audits/legacy_profile_dialog_v279_browser.cjs
      - name: Full PWA 278 to 279 refresh and offline mobile
        run: |
          node audits/pwa_verified_refresh_browser.cjs
          node audits/stage28_offline_pwa_browser.cjs
      - name: Verify final PWA cache and fingerprints
        run: python3 audits/g7_stage12_sync_pwa.py --check
      - name: Publish verified v279 teacher dashboard HTML and worker only to test branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 audits/legacy_teacher_dashboard_v279_publish.py
