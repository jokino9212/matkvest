name: Build §46 release candidate
on:
  push:
    branches: [audit/g5-paragraph46-20261115]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify candidate patch
        env:
          G5_PATCH: ''
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          printf '%s' "$G5_PATCH" | base64 -d | gzip -dc | git apply --index
          git diff --cached --check
          python3 audits/g7_stage12_sync_pwa.py --check
          node --check g5-decimal-tiers-v127.js
          node --check audits/g5_sequential_paragraph46_browser_oracle.cjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node audits/g5_sequential_paragraph46_browser_oracle.cjs
      - name: Commit verified candidate to the audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/g5-paragraph46-build-once.yml
          git commit -m "Audit Grade 5 paragraph 46 decimal division by a natural number and stamp v184"
          git push origin HEAD:refs/heads/audit/g5-paragraph46-20261115
