name: Grade 5 sequential textbook audit §12 multiplication properties
on:
  push:
    branches:
      - audit/g5-sequential-paragraph12-multiplication-20261114
    paths:
      - 'g5-arithmetic-tiers-v123.js'
      - 'g5-textbook-core.js'
      - 'audits/g5_sequential_paragraph12_browser_oracle.cjs'
      - '.github/workflows/g5-sequential-12.yml'
      - 'sw.js'
  pull_request:
    branches:
      - main
    paths:
      - 'g5-arithmetic-tiers-v123.js'
      - 'g5-textbook-core.js'
      - 'audits/g5_sequential_paragraph12_browser_oracle.cjs'
jobs:
  sequential-paragraph12:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Verify changed source and independent §12 checker syntax
        run: |
          node --check g5-arithmetic-tiers-v123.js
          node --check g5-textbook-core.js
          node --check audits/g5_sequential_paragraph12_browser_oracle.cjs
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify 600 live multiplication tasks and three authentic laws
        run: node audits/g5_sequential_paragraph12_browser_oracle.cjs
      - name: Repeat completed textbook paragraphs §§1-11
        run: |
          node audits/g5_sequential_paragraphs01_03_browser.cjs
          node audits/g5_sequential_paragraph04_browser_oracle.cjs
          node audits/g5_sequential_paragraph05_browser_oracle.cjs
          node audits/g5_sequential_paragraph06_browser_oracle.cjs
          node audits/g5_sequential_paragraph07_browser_oracle.cjs
          node audits/g5_sequential_paragraph08_browser_oracle.cjs
          node audits/g5_sequential_paragraph09_browser_oracle.cjs
          node audits/g5_sequential_paragraph10_browser_oracle.cjs
          node audits/g5_sequential_paragraph11_browser_oracle.cjs
      - name: Protect 74 topic IDs and 1110 cognitive families
        run: node audits/g5_v132_74_real_cognitive_inventory.cjs
      - name: Protect independent fraction arithmetic and drawn geometry
        run: |
          node audits/g5_stage43_factorization_real_math_oracle.cjs
          node audits/g5_stage42_mixed_fraction_oracle.cjs
          node audits/g5_stage41_fractions_angles_browser_oracle.cjs
          node audits/g5_stage40_paragraph25_browser_oracle.cjs
          node audits/g5_stage39_fraction_independent_oracle.cjs
      - name: Protect fractional conversions and full answer UX
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
