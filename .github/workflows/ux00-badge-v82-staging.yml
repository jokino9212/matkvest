name: UX-00 badge v82 staging integration
on:
  push:
    branches: [ux-final/ux00-inventory-20261108]
    paths: ['.github/workflows/ux00-badge-v82-staging.yml', 'audits/ux00_badge_integration_browser.cjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  staging:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch 16 badge illustrations into staging HTML and synchronize SW
        run: python3 audits/ux00_integrate_badges_v82.py
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify real artwork and unchanged item values
        run: timeout 150s node audits/ux00_badge_integration_browser.cjs
      - name: Regression - shop sorting and progress
        run: node audits/shop_progress_v874_browser_test.cjs
      - name: Regression - collection full-screen artwork
        run: node audits/collection_viewer_v81_browser.cjs
      - name: Regression - leaderboard and item worth
        run: node audits/stage30_collection_media_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux00-badges-integrated-staging
          path: audits/ux00_badge_integration_output/
          retention-days: 60
      - name: Commit only after all browser gates
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "feat(ux): stage 16 real SVG badge artworks in shop and collection [skip ci]"
            git push origin HEAD:ux-final/ux00-inventory-20261108
          fi
