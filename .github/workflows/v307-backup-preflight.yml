name: v307 backup preflight (read only)
on:
  push:
    branches: [feature/v307-accounts-migration-homework]
    paths: ['integrations/v307/**', 'integrations/backend95-next/school_block_queue.mjs', 'integrations/backend95/column_training.mjs', 'frontend/knowledge-map/QuestionNodes.vue', 'frontend/knowledge-map/TableExercise.vue', 'frontend/knowledge-map/AnswerChoices.vue', 'audits/v307_*', '.github/workflows/v307-backup-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test audits/v307_backup_preflight.test.mjs audits/v307_account_client.test.mjs audits/v307_training_queue.test.mjs audits/v307_economy_queue.test.mjs audits/v307_extended_choice.test.mjs audits/v307_quick_queue.test.mjs audits/v307_visual_nodes.test.mjs audits/v307_review_queue.test.mjs
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6eb9b1d12cc49d6c91fe444f531192855022ff3d
          path: v306-fixture
          persist-credentials: false
      - run: |
          echo '7e6e2b8de44e1eb4888b34f012288c32e24643eafe9c350fe79e9881935cb318  v306-fixture/index.html' | sha256sum -c -
          npm install --no-save --no-package-lock playwright@1.56.1
      - run: node audits/v307_export_learning_bank.cjs
      - run: node audits/v307_export_visual_bank.cjs
      - run: node audits/v307_backup_browser.cjs
      - run: node audits/v307_account_review_browser.cjs
      - run: python3 audits/v307_extract_column_layout.py v306-fixture/index.html integrations/v307/column_layout_generated.mjs
      - run: npm ci && npx vite build --config frontend/v307-review.vite.config.mjs && npm install --no-save --no-package-lock playwright@1.56.1
      - run: node audits/v307_training_vue_browser.cjs
      - run: node audits/v307_quick_browser.cjs
      - run: node audits/v307_all_topics_browser.cjs
      - run: node audits/v307_economy_browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: v307-public-catalog-and-synthetic-backups
          path: v307-public-fixtures/
          if-no-files-found: error
          retention-days: 14
      - run: python3 audits/v307_compose_local_review.py v306-fixture dist-v307-review
      - run: node audits/v307_combined_browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: v307-combined-review-not-for-deploy
          path: dist-v307-review/
          if-no-files-found: error
          retention-days: 14
