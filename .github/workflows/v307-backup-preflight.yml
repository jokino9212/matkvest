name: v307 backup preflight (read only)
on:
  push:
    branches: [feature/v307-accounts-migration-homework]
    paths: ['integrations/v307/**', 'audits/v307_*', '.github/workflows/v307-backup-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test audits/v307_backup_preflight.test.mjs audits/v307_account_client.test.mjs audits/v307_training_queue.test.mjs
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6eb9b1d12cc49d6c91fe444f531192855022ff3d
          path: v306-fixture
          persist-credentials: false
      - run: |
          echo '7e6e2b8de44e1eb4888b34f012288c32e24643eafe9c350fe79e9881935cb318  v306-fixture/index.html' | sha256sum -c -
          npm install --no-save --no-package-lock playwright@1.56.1
      - run: node audits/v307_backup_browser.cjs
      - run: node audits/v307_account_review_browser.cjs
