name: G5 stage40 textbook §25 circle disk sphere cylinder
on:
  push:
    branches:
      - audit/g5-stage40-paragraph25-circle-20261113
    paths:
      - 'g5-remaining-core-v126.js'
      - 'g5-fractions-v114.js'
      - 'audits/g5_stage40_paragraph25_browser_oracle.cjs'
      - '.github/workflows/g5-stage40-paragraph25.yml'
      - 'sw.js'
  pull_request:
    branches:
      - main
    paths:
      - 'g5-remaining-core-v126.js'
      - 'g5-fractions-v114.js'
      - 'audits/g5_stage40_paragraph25_browser_oracle.cjs'
      - '.github/workflows/g5-stage40-paragraph25.yml'
jobs:
  verify-paragraph25:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual lesson and test syntax
        run: |
          node --check g5-remaining-core-v126.js
          node --check g5-fractions-v114.js
          node --check audits/g5_stage40_paragraph25_browser_oracle.cjs
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Independent 300-question textbook and 80 image semantic checks
        run: node audits/g5_stage40_paragraph25_browser_oracle.cjs
      - name: Preserve entire Grade 5 content, correctness, and difficulty gates
        run: |
          node audits/g5_v132_74_real_cognitive_inventory.cjs
          node audits/g5_stage38_percent_context_check.cjs
          node audits/g5_stage39_fraction_independent_oracle.cjs
      - name: Preserve mixed-number input and progression
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
