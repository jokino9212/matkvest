name: UX-104 audit intermittent extra 83 coins on pet purchase
on:
  push:
    branches: [ux-final/ux00-inventory-20261108]
    paths: ['.github/workflows/ux104-coins-probe.yml','audits/ux104_coin_reward_probe.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: timeout 120s node audits/ux104_coin_reward_probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux104-coin-difference-trace
          path: audits/ux104_coins_audit_output/
          retention-days: 30
