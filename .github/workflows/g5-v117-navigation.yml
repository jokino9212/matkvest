name: Grade 5 textbook two-volume navigation v117
on:
  push:
    branches: [fix/g5-textbook-navigation-v117-20261113]
    paths:
      - g5-textbook-navigation-v117.js
      - audits/g5_v117_patch.py
      - audits/g5_v117_navigation_browser.cjs
      - .github/workflows/g5-v117-navigation.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  textbook-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Activate navigation and synchronize service-worker integrity
        run: python3 audits/g5_v117_patch.py
      - name: Validate JavaScript and Python syntax
        run: |
          node --check g5-textbook-navigation-v117.js
          node --check audits/g5_v117_navigation_browser.cjs
          python3 -m py_compile audits/g5_v117_patch.py
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Check 51 paragraphs, all 74 existing topics, search and 4 viewport widths
        run: node audits/g5_v117_navigation_browser.cjs
      - name: Run existing fractions and textbook regressions
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
      - name: Commit generated HTML and service worker only after checks pass
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(g5): activate two-volume textbook navigator v117"
            git fetch origin fix/g5-textbook-navigation-v117-20261113
            git rebase origin/fix/g5-textbook-navigation-v117-20261113
            git push origin HEAD:fix/g5-textbook-navigation-v117-20261113
          fi
