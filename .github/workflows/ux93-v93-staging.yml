name: UX-93 legacy avatar v93 staging Gate
on:
  push:
    branches: [ux-final/ux00-inventory-20261108]
    paths: ['.github/workflows/ux93-v93-staging.yml','audits/ux93_stack_avatar_v93_browser.cjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  staging:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Scale legacy avatar layers and synchronize PWA v93
        run: python3 audits/ux93_stack_avatar_patch.py
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: All 55 real avatar artworks in leaderboard
        run: timeout 160s node audits/ux93_all_avatar_leaderboard_browser.cjs
      - name: Test stacked trophy badge and real title on four widths
        run: timeout 150s node audits/ux93_stack_avatar_v93_browser.cjs
      - name: Regression - pet/avatar fullscreen zoom
        run: timeout 120s node audits/ux92_pet_viewer_v92_browser.cjs
      - name: Regression - 50 SVG badges and collection
        run: timeout 130s node audits/ux00_badge_final_visual_browser.cjs
      - name: Regression - leaderboard economy
        run: timeout 100s node audits/stage30_collection_media_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux93-v93-stacked-avatar-gallery
          path: |
            audits/ux93_stack_avatar_output/
            audits/ux93_legacy_avatar_output/
          retention-days: 60
      - name: Commit verified staging only when all tests pass
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(ux93): full-size historic trophy avatars with compact labels [skip ci]"
            git pull --rebase origin ux-final/ux00-inventory-20261108
            git push origin HEAD:ux-final/ux00-inventory-20261108
          fi
