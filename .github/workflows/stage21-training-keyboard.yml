name: Stage21 Android training and keyboard audit
on:
  push:
    branches: [main, audit/mobile-training-stage21-20261106]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node audits/stage21_training_keyboard_audit.cjs
