          ## После правок
          
          - Все 68 тем проверены по порядку, включая шесть общих тем итогового повторения. Повторный срез по 2 400 заданий на ступень (489 600 заданий) дал ноль совпадений между ступенями в рамках одной темы.
          - В повторении чисел до 1 000 отработаны чтение разрядов, составление чисел по условиям, переходы через разряд и обратные действия. В разделе многозначных чисел добавлены восстановление записи с нулями, упорядочение и сравнение, два изменения в 10/100/1 000 раз, составление числа с классами миллионов и миллиардов.
          - Для величин ступени ведут от прямого перевода к составной записи и сравнению. Время включает точное окончание события и расчёт через полночь. В заданиях на палетку сначала считаются целые клетки, затем половины, затем сравниваются площади.
          - Сложение и вычитание величин выдаёт только сложение, вычитание и сравнение. Умножение величин использует отдельный явный режим. В уравнениях растёт число действий до применения обратной операции.
          - В умножении и делении появились вычисление неполных произведений, разложение, восстановление делимого по частному и остатку и задачи с несколькими действиями. В задачах на движение, пропорциональное деление и работу мастер применяет дополнительный шаг после нахождения промежуточного результата.
          - В итоговом повторении разделены пересекавшиеся формы геометрии и задачи на движение, введены обратные и составные задачи, а годовой микс чередует навыки внутри попытки.
