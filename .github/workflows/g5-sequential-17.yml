name: Grade 5 sequential §17 natural-number exponents
on:
  push:
    branches:
      - audit/g5-sequential-paragraph17-v152-20261114
  pull_request:
    branches:
      - main
    paths:
      - 'g5-remaining-core-v126.js'
      - 'audits/g5_sequential_paragraph17_browser_oracle.cjs'
      - '.github/workflows/g5-sequential-17.yml'
jobs:
  powers-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check g5-remaining-core-v126.js
          node --check audits/g5_sequential_paragraph17_browser_oracle.cjs
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Independent calculations for 600 powers questions
        run: node audits/g5_sequential_paragraph17_browser_oracle.cjs
      - name: Regression of sequential paragraphs 1 through 16
        run: |
          node audits/g5_sequential_paragraphs01_03_browser.cjs
          for n in 04 05 06 07 08 09 10 11 12 13 14 15 16; do node "audits/g5_sequential_paragraph${n}_browser_oracle.cjs"; done
      - name: Preserve 74 textbook topics
        run: node audits/g5_v132_74_real_cognitive_inventory.cjs
