name: Grade5 full cognitive inventory stage v122
on:
  push:
    branches: [fix/g5-full-pedagogy-v122-20261113]
    paths: [audits/g5_v122_full_cognitive_inventory.cjs, .github/workflows/g5-v122-inventory.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node audits/g5_v122_full_cognitive_inventory.cjs
