name: Collection v81 visual regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collection-v81-visual-regression.yml'
      - 'audits/collection_viewer_v81_browser.cjs'
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Verify release digest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          sw=Path('sw.js').read_text()
          assert 'matkvest-iphone-v81' in sw
          assert hashlib.sha256(Path('index.html').read_bytes()).hexdigest() in sw
          print('PWA_DIGEST_PASS')
          PY
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Test modal geometry in mobile and desktop
        run: node audits/collection_viewer_v81_browser.cjs
