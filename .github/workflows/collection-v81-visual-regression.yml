name: Collection release-version-aware visual regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collection-v81-visual-regression.yml'
      - 'audits/collection_viewer_v81_browser.cjs'
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Verify release digest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          sw=Path('sw.js').read_text()
          assert 'matkvest-iphone-v81' in sw or 'matkvest-iphone-v105' in sw or 'matkvest-iphone-v106' in sw, 'Unexpected PWA version'
          assert hashlib.sha256(Path('index.html').read_bytes()).hexdigest() in sw
          print('PWA_DIGEST_PASS')
          PY
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify modal/collection on current production release and retain v81 baseline
        run: |
          if grep -q 'matkvest-iphone-v81' sw.js; then
            node audits/collection_viewer_v81_browser.cjs
          elif grep -q 'matkvest-iphone-v105' sw.js; then
            node audits/ux104_owner_v105_browser.cjs
            node audits/stage30_collection_media_browser.cjs
          elif grep -q 'matkvest-iphone-v106' sw.js; then
            node audits/ux106_badge_overflow_browser.cjs
            node audits/stage30_collection_media_browser.cjs
          else
            echo 'Unrecognized release version: inspect before updating baseline'
            exit 1
          fi
