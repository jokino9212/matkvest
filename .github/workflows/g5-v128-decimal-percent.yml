name: Grade 5 complete decimal and percentage pedagogy v128
on:
  push:
    branches: [fix/g5-decimal-percent-v128-20261113]
    paths:
      - g5-decimal-percent-v128.js
      - audits/g5_v128_activate.py
      - audits/g5_v128_real_decimal_percent_browser.cjs
      - .github/workflows/g5-v128-decimal-percent.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decimal-percent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Activate v128 and PWA cache
        run: python3 audits/g5_v128_activate.py
      - name: Check source syntax
        run: |
          node --check g5-decimal-percent-v128.js
          node --check audits/g5_v128_real_decimal_percent_browser.cjs
          python3 -m py_compile audits/g5_v128_activate.py
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Validate real student questions with independent BigInt oracle
        run: node audits/g5_v128_real_decimal_percent_browser.cjs
      - name: Preserve fraction conversion inputs
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
      - name: Commit verified HTML and worker
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(g5): activate six more real tiered lessons v128"
            git fetch origin fix/g5-decimal-percent-v128-20261113
            git rebase origin/fix/g5-decimal-percent-v128-20261113
            git push origin HEAD:fix/g5-decimal-percent-v128-20261113
          fi
