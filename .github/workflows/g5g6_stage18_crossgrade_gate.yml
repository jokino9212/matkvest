name: MatKvest stage18H - cross-grade regression for v55
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-stage18h-crossgrade
  cancel-in-progress: false
jobs:
  all-grades-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g5g6-stage18-20261105
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium harness
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Check baseline and PWA build
        run: |
          echo '12e52584246cf5763dc378052b7e134dda3b4d7639576296f3448ab97d638e0d  index.html' | sha256sum --check
          grep -F 'matkvest-iphone-v55' sw.js
      - name: Run G1 G2 G3 G5 G6 G8 generator and column-mode regressions
        run: |
          sed 's/f188d39a3a16fc54dfb32238fc34d3dfe6cc3c4416cd475579bf3ed65a7e1e36/12e52584246cf5763dc378052b7e134dda3b4d7639576296f3448ab97d638e0d/g' audits/g7_stage14_crossgrade_test.mjs > audits/_stage18h_crossgrade.mjs
          node audits/_stage18h_crossgrade.mjs
          rm audits/_stage18h_crossgrade.mjs
      - name: Run G4 lessons, all column operations and multiplication table modes
        run: |
          sed 's/f188d39a3a16fc54dfb32238fc34d3dfe6cc3c4416cd475579bf3ed65a7e1e36/12e52584246cf5763dc378052b7e134dda3b4d7639576296f3448ab97d638e0d/g' audits/g7_stage14_grade4_test.mjs > audits/_stage18h_grade4.mjs
          node audits/_stage18h_grade4.mjs
          rm audits/_stage18h_grade4.mjs
      - name: Verify 7th grade full 107-topic anti-repeat gate survives G5/G6
        run: node audits/g7_stage13_strict_test.mjs
      - name: Aggregate crossgrade results in isolated checkpoint
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          cross=json.loads(Path("audits/g7_stage14_crossgrade_report.json").read_text())
          g4=json.loads(Path("audits/g7_stage14_grade4_report.json").read_text())
          g7=json.loads(Path("audits/g7_stage13_strict_report.json").read_text())
          assert not cross["errors"] and not cross["pageErrors"] and len(cross["columnSessions"])==12
          assert not g4["grade4"]["errors"] and not g4["pageErrors"]
          assert (g7["catalog"],g7["sessions"],g7["questions"])==(107,963,7062)
          assert not any(g7[k] for k in ["errors","duplicates","exhaustions","pageErrors"])
          out={"sha256":hashlib.sha256(Path("index.html").read_bytes()).hexdigest(),"version":"v55","all_other_grades":"PASS","grade4_checks":g4["grade4"]["passed"],"grade7_topics":g7["catalog"],"grade7_questions":g7["questions"],"other_grades":{g:{"topics":v["topics"],"tested":v["attempted"],"passed":v["complete"]} for g,v in cross["grades"].items()},"column_sessions":len(cross["columnSessions"]),"released":False}
          Path("audits/g5g6_stage18_crossgrade_v55_checkpoint.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload crossgrade details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-stage18-v55-all-grades
          path: |
            audits/g7_stage14_crossgrade_report.json
            audits/g7_stage14_grade4_report.json
            audits/g7_stage13_strict_report.json
            audits/g5g6_stage18_crossgrade_v55_checkpoint.json
          if-no-files-found: warn
      - name: Save crossgrade checkpoint only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/g5g6_stage18_crossgrade_v55_checkpoint.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(stage18): verify G1-G8 and full G7 regression with v55"
            # Restore tracked reports and delete generated untracked reports safely.
            for f in audits/g7_stage13_strict_report.json audits/g7_stage14_crossgrade_report.json audits/g7_stage14_grade4_report.json; do
              if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then git restore -- "$f"; else rm -f "$f"; fi
            done
            git pull --rebase origin audit/g5g6-stage18-20261105
            git push origin HEAD:audit/g5g6-stage18-20261105
          fi
