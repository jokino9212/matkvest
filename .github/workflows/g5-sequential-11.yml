name: Grade 5 sequential textbook audit §11 equations, unique roots and substitution
on:
  push:
    branches:
      - audit/g5-sequential-paragraph11-equations-20261114
    paths:
      - 'g5-remaining-core-v126.js'
      - 'g5-conversion-ux.js'
      - 'audits/g5_conversion_diversity_smoke.cjs'
      - 'audits/g5_sequential_paragraph11_browser_oracle.cjs'
      - '.github/workflows/g5-sequential-11.yml'
      - 'sw.js'
  pull_request:
    branches:
      - main
    paths:
      - 'g5-remaining-core-v126.js'
      - 'g5-conversion-ux.js'
      - 'audits/g5_conversion_diversity_smoke.cjs'
      - 'audits/g5_sequential_paragraph11_browser_oracle.cjs'
jobs:
  sequential-paragraph11:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Validate actual published code and independent root oracle syntax
        run: |
          node --check g5-remaining-core-v126.js
          node --check g5-conversion-ux.js
          node --check audits/g5_sequential_paragraph11_browser_oracle.cjs
          node --check audits/g5_conversion_diversity_smoke.cjs
      - name: Install pinned browser runtime
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Independently solve 600 real equations with substitution and unique roots
        run: node audits/g5_sequential_paragraph11_browser_oracle.cjs
      - name: Preserve previous sequential §§1-10
        run: |
          node audits/g5_sequential_paragraphs01_03_browser.cjs
          node audits/g5_sequential_paragraph04_browser_oracle.cjs
          node audits/g5_sequential_paragraph05_browser_oracle.cjs
          node audits/g5_sequential_paragraph06_browser_oracle.cjs
          node audits/g5_sequential_paragraph07_browser_oracle.cjs
          node audits/g5_sequential_paragraph08_browser_oracle.cjs
          node audits/g5_sequential_paragraph09_browser_oracle.cjs
          node audits/g5_sequential_paragraph10_browser_oracle.cjs
      - name: Preserve all 74 topic IDs and 1110 Grade 5 families
        run: node audits/g5_v132_74_real_cognitive_inventory.cjs
      - name: Preserve fraction arithmetic, exact mathematics and diagrams
        run: |
          node audits/g5_stage43_factorization_real_math_oracle.cjs
          node audits/g5_stage42_mixed_fraction_oracle.cjs
          node audits/g5_stage41_fractions_angles_browser_oracle.cjs
          node audits/g5_stage40_paragraph25_browser_oracle.cjs
          node audits/g5_stage39_fraction_independent_oracle.cjs
      - name: Preserve mixed-fraction answer entry and scoring
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
