name: Apply verified Grade 3 difference comparison patch
on:
  push:
    branches: [audit/g1-g4-content-v195]
    paths: [.github/workflows/g3-difference-comparison-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply the tested source revision
        run: |
          patch_file="$RUNNER_TEMP/matkvest.patch"
          cat > "$patch_file" <<'MATKVEST_PATCH'
          diff --git a/index.html b/index.html
          index 0048646..cebf5dd 100644
          --- a/index.html
          +++ b/index.html
          @@ -5972,7 +5972,51 @@ function g3OperationWordQuestion(d,slot=null){
             total,groups,size,"Делим только тетради. Книги к этому распределению не относятся."
            );
           }
          -function g3DifferenceStoryQuestion(d){const small=ri(4,d===0?20:45),diff=ri(2,d===0?12:30),large=small+diff,larger=Math.random()<.5,item=g3StoryItem(),n1=g3StoryName(),n2=g3StoryName(n1),text=larger?`У ${n1} ${g3Qty(large,item)}, а у ${n2} ${g3Qty(small,item)}. На сколько у ${n1} больше?`:`У ${n1} ${g3Qty(small,item)}, а у ${n2} ${g3Qty(large,item)}. На сколько у ${n1} меньше?`;return g3StoryNumberQuestion(text,diff,`Для разностного сравнения вычитаем меньшее из большего: ${large} − ${small} = <b>${diff}</b>.`,`g3:difference_compare_tasks:${d}:${larger?"more":"less"}:${small}:${large}`,{small,large,difference:diff,direction:larger?"more":"less"})}
          +function g3DifferenceStoryQuestion(d,slot=null){
          + const variants=[["more","less"],["days","shelves"],["afterChange","equalize"]][d];
          + const variant=slot===null?g6RandomFrom(variants):variants[slot%variants.length];
          + const input=(story,answer,ex)=>g6NumberInputQuestion(
          +  `<span class="g3-story">${story}</span>`,answer,ex,
          +  `g3:difference_compare_tasks:${d}:${variant}:${story}`,
          +  {inputHint:"Введи целое число.",audit:{type:"g3StoryNumber",variant}}
          + );
          + const small=ri(4,d===0?20:45);
          + const difference=ri(2,d===0?12:30),large=small+difference;
          + const explain=`Из большего количества вычитаем меньшее: ${large} − ${small} = <b>${difference}</b>.`;
          + if(d===0){
          +  const item=g3StoryItem(),first=g3StoryName(),second=g3StoryName(first),more=variant==="more";
          +  return input(
          +   `У ${first} ${g3Qty(more?large:small,item)}, у ${second} — ${g3Qty(more?small:large,item)}. На сколько у ${first} ${more?"больше":"меньше"}?`,
          +   difference,explain
          +  );
          + }
          + if(variant==="days"){
          +  const monday=ri(8,40);
          +  return input(
          +   `В понедельник вернули ${g3Qty(monday,"book")}, во вторник — ${g3Qty(large,"book")}, в среду — ${g3Qty(small,"book")}. На сколько больше книг вернули во вторник, чем в среду?`,
          +   difference,`Сравниваем вторник и среду. ${explain}`
          +  );
          + }
          + if(variant==="shelves"){
          +  const second=ri(8,40);
          +  return input(
          +   `На первой полке ${g3Qty(small,"book")}, на второй — ${g3Qty(second,"book")}, на третьей — ${g3Qty(large,"book")}. На сколько меньше книг на первой полке, чем на третьей?`,
          +   difference,`Сравниваем первую и третью полки. ${explain}`
          +  );
          + }
          + if(variant==="afterChange"){
          +  const added=ri(2,12),updated=large+added;
          +  return input(
          +   `В первой коробке ${g3Qty(large,"pencil")}, во второй — ${g3Qty(small,"pencil")}. В первую положили ещё ${g3Qty(added,"pencil")}. На сколько карандашей теперь больше в первой коробке?`,
          +   updated-small,`В первой коробке теперь ${large} + ${added} = ${updated}.<br>Находим разность: ${updated} − ${small} = <b>${updated-small}</b>.`
          +  );
          + }
          + const moved=ri(2,9),first=small+2*moved;
          + return input(
          +  `В первой корзине ${g3Qty(first,"apple")}, во второй — ${g3Qty(small,"apple")}. Сколько яблок нужно переложить из первой во вторую, чтобы их стало поровну?`,
          +  moved,`Разность равна ${first} − ${small} = ${2*moved}. При перекладывании одного яблока разность уменьшается на два.<br>Поэтому перекладываем ${2*moved} : 2 = <b>${moved}</b>.`
          + );
          +}
           function g3MultiplicativeStoryQuestion(d){const small=ri(2,d===0?8:12),k=ri(2,d===0?5:9),large=small*k,larger=Math.random()<.5,item=g3StoryItem(),text=larger?`В первой группе ${g3Qty(small,item)}, а во второй ${g3Qty(large,item)}. Во сколько раз во второй группе больше?`:`В первой группе ${g3Qty(small,item)}, а во второй ${g3Qty(large,item)}. Во сколько раз в первой группе меньше?`;return g3StoryNumberQuestion(text,k,`Для кратного сравнения делим большее число на меньшее: ${large} : ${small} = <b>${k}</b>.`,`g3:multiplicative_compare_tasks:${d}:${larger?"more":"less"}:${small}:${large}`,{small,large,multiplier:k,direction:larger?"more":"less"})}
           function g3IncreaseDecreaseStoryQuestion(d){const variant=g6RandomFrom(["moreBy","lessBy","moreTimes","lessTimes"]),item=g3StoryItem(),base=ri(3,d===0?15:30),k=variant.includes("Times")?ri(2,d===0?5:8):ri(2,d===0?10:20);let first,answer,text,op;if(variant==="moreBy"){first=base;answer=base+k;op="+";text=`У Ани ${g3Qty(base,item)}. У Маши на ${k} больше. Сколько у Маши?`}else if(variant==="lessBy"){answer=base;first=base+k;op="−";text=`У Ани ${g3Qty(first,item)}. У Маши на ${k} меньше. Сколько у Маши?`}else if(variant==="moreTimes"){first=base;answer=base*k;op="·";text=`У Ани ${g3Qty(base,item)}. У Маши в ${k} ${ruTimes(k)} больше. Сколько у Маши?`}else{answer=base;first=base*k;op=":";text=`У Ани ${g3Qty(first,item)}. У Маши в ${k} ${ruTimes(k)} меньше. Сколько у Маши?`}return g3StoryNumberQuestion(text,answer,`Фраза «${variant==="moreBy"?"на несколько больше":variant==="lessBy"?"на несколько меньше":variant==="moreTimes"?"в несколько раз больше":"в несколько раз меньше"}» означает действие <b>${op}</b>.<br>${first} ${op} ${k} = <b>${answer}</b>.`,`g3:increase_decrease_tasks:${d}:${variant}:${first}:${k}`,{variant,source:first,k,answer})}
           function g3PriceQuestion(d){const variant=g6RandomFrom(d===0?["cost","cost","price"]:["cost","price","quantity"]),price=ri(3,d===0?15:25),qty=ri(2,d===0?6:9),cost=price*qty;let text,answer,unit,ex;if(variant==="cost"){text=`Одна тетрадь стоит ${price} руб. Купили ${qty} ${g3Plural(qty,["тетрадь","тетради","тетрадей"])}. Сколько заплатили?`;answer=cost;unit="руб.";ex=`Стоимость = цена · количество.<br>${price} · ${qty} = <b>${cost} руб.</b>`}else if(variant==="price"){text=`Купили ${g3Qty(qty,"notebook")} за ${cost} руб. Сколько стоит одна тетрадь?`;answer=price;unit="руб.";ex=`Цена = стоимость : количество.<br>${cost} : ${qty} = <b>${price} руб.</b>`}else{text=`Один карандаш стоит ${price} руб. На покупку потратили ${cost} руб. Сколько карандашей купили?`;answer=qty;unit="шт.";ex=`Количество = стоимость : цена.<br>${cost} : ${price} = <b>${qty}</b>.`}return g3StoryNumberQuestion(text,answer,ex,`g3:price_quantity_cost:${d}:${variant}:${price}:${qty}`,{variant,price,quantity:qty,cost},unit)}
          @@ -7325,7 +7369,10 @@ function makeG3Question(id,stageOverride=null){
             const live=stageOverride===null&&blockSession?.kind==="g3quiz"&&blockSession.key==="g3:operation_word_problems";
             return g3OperationWordQuestion(d,live?blockSession.done:null);
            }
          - if(raw==="difference_compare_tasks")return g3DifferenceStoryQuestion(d);
          + if(raw==="difference_compare_tasks"){
          +  const live=stageOverride===null&&blockSession?.kind==="g3quiz"&&blockSession.key==="g3:difference_compare_tasks";
          +  return g3DifferenceStoryQuestion(d,live?blockSession.done:null);
          + }
            if(raw==="multiplicative_compare_tasks")return g3MultiplicativeStoryQuestion(d);
            if(raw==="increase_decrease_tasks")return g3IncreaseDecreaseStoryQuestion(d);
            if(raw==="price_quantity_cost")return g3PriceQuestion(d);
          MATKVEST_PATCH
          git apply --check "$patch_file"
          git apply "$patch_file"
          test "$(git hash-object index.html)" = "cebf5ddecd4b5f7231f8ee7a51fb7208117dc759"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git rm -- .github/workflows/g3-difference-comparison-apply.yml
          git commit -m 'Diversify Grade 3 difference comparison exercises'
          git push origin HEAD:refs/heads/audit/g1-g4-content-v195
