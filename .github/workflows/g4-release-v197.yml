          retention-days: 14
  production:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HTML_SHA: ${{ needs.candidate.outputs.html }}
      WORKER_SHA: ${{ needs.candidate.outputs.worker }}
      G4_URL: https://jokino9212.github.io/matkvest/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grade4-release-browser-check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - name: Verify exact build and Grade 4 on the public site
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$G4_URL" -o "$RUNNER_TEMP/live.html" || true
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${G4_URL}sw.js" -o "$RUNNER_TEMP/live-sw.js" || true
            if printf '%s  %s\n%s  %s\n' "$HTML_SHA" "$RUNNER_TEMP/live.html" "$WORKER_SHA" "$RUNNER_TEMP/live-sw.js" | sha256sum --check --status; then
              export G4_CHROME="$(command -v google-chrome || command -v chromium)"
              python check-g4-release197.py
              exit
            fi
            sleep 8
          done
          echo 'The public site did not serve the release HTML and worker'
          exit 1
