          printf 'html=%s\n' "$(sha256sum index.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'worker=%s\n' "$(sha256sum sw.js | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
