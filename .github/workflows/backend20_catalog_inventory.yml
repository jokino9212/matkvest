name: MatKvest backend20 - real frontend v70 topic ID inventory
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - audits/backend20_frontend_catalog_probe.mjs
      - .github/workflows/backend20_catalog_inventory.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-backend20-catalog-v70
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Inventory grade themes and identifiers with real Chromium
        run: node audits/backend20_frontend_catalog_probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend20-v70-topic-ids
          path: audits/backend20_frontend_topic_inventory.json
          if-no-files-found: warn
      - name: Persist read-only source inventory
        if: always()
        run: |
          set -eu
          test -f audits/backend20_frontend_topic_inventory.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/backend20_frontend_topic_inventory.json
          git diff --cached --quiet || git commit -m "audit(backend20): actual v70 grade and topic ID inventory"
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
