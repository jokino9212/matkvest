name: MatKvest UI19D - audit store prices rarity and item catalog
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19d_inventory.yml
      - audits/ui_stage19d_source_scan.mjs
      - audits/ui_stage19d_shop_inventory.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          persist-credentials: true
          fetch-depth: 0
      - name: Parse source constants, item definitions and economy handlers
        run: node audits/ui_stage19d_source_scan.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Inspect real store cards and rarity filters on mobile and desktop
        run: node audits/ui_stage19d_shop_inventory.mjs
      - name: Save representative screenshots as readable review assets
        if: success()
        run: |
          for file in audits/ui19d_before_390_tab0.png audits/ui19d_before_390_tab2.png audits/ui19d_before_390_tab10.png audits/ui19d_before_390_tab11.png audits/ui19d_before_1280_tab2.png audits/ui19d_before_1280_tab11.png; do
            base64 -w0 "$file" > "audits/$(basename "$file" .png).b64.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matkvest-ui19d-v62-shop-catalog-audit
          path: |
            audits/ui_stage19d_source_scan.json
            audits/ui_stage19d_shop_inventory.json
            audits/ui19d_before_*.png
          if-no-files-found: warn
      - name: Save audited source and shop evidence on working branch
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/ui_stage19d_source_scan.json audits/ui_stage19d_shop_inventory.json audits/ui19d_before_*.b64.txt
          git diff --cached --quiet || git commit -m "audit(ui19D): record catalog, rarity, prices and shop screenshots"
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
