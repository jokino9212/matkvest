name: Grade 3 written multiplication complete audit
on:
  push:
    branches: [audit/g1-g4-content-v195]
    paths:
      - .github/workflows/g3-written-multiply-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium testing runtime
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Independently check 10800 generated multiplication tasks
        run: node audits/g3_written_multiply_generator_browser.cjs
      - name: Test column entry, errors, completion and F5 save
        run: node audits/g3_written_multiply_progress_browser.cjs
