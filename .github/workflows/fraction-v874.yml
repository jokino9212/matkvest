name: Gate responsive fraction cells v8.74
on:
  push:
    branches: [fix/ui-fractions-shop-progress-20261106]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-fractions-shop-progress-20261106
          persist-credentials: true
      - name: Apply patch if candidate not yet present
        run: |
          if ! grep -q 'id="mk-v74-responsive-fraction-answers"' index.html; then
            python3 audits/fix_responsive_fraction_v874.py
          fi
      - name: Check fingerprint, scripts and visible version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          html=Path('index.html').read_bytes()
          sw=Path('sw.js').read_text()
          assert html.count(b'id="mk-v74-responsive-fraction-answers"') == 1
          assert b'8.74' in html and b'8.73' not in html
          assert 'matkvest-iphone-v74' in sw
          assert hashlib.sha256(html).hexdigest() in sw
          assert html.count(b'</body>') == 1
          print('PASS candidate integrity')
          PY
      - name: Install Chromium driver
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Fraction answer mobile layout gate
        run: node audits/responsive_fraction_v874_test.cjs
      - name: Regress Android long division
        run: |
          node audits/mobile_division_v72_browser_test.cjs
          node audits/mobile_division_v72_real_app_test.cjs
      - name: Commit verified candidate
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(frontend): v8.74 responsive fraction answer cells and PWA"
            git push origin HEAD:fix/ui-fractions-shop-progress-20261106
          fi
