name: ONE-TIME Grade 5 paragraph 28 v164 PWA activation
on:
  push:
    branches:
      - audit/g5-paragraph28-20261114
    paths:
      - '.github/workflows/g5-v164-one-time.yml'
      - 'audits/g5_v164_activate.py'
permissions:
  contents: write
jobs:
  apply-v164:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Activate safe version-stamped scripts and worker
        run: |
          python3 audits/g5_v164_activate.py
          python3 audits/g5_v164_activate.py --check
      - name: Commit activated v164 HTML and worker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo 'v164 already activated'
          else
            git commit -m 'Release v164: cache-busted Grade 5 scripts and worker hash'
            git push origin HEAD:audit/g5-paragraph28-20261114
          fi
