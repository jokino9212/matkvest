name: Test-only v277 legacy HTML and Vue action inventory
on:
  push:
    branches: [refactor/route-vue-actions-from-7c14ce9]
    paths: ['.github/workflows/v277-legacy-inventory.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'jokino9212/matkvest' && github.ref == 'refs/heads/refactor/route-vue-actions-from-7c14ce9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only HTML legacy handler and Vue action inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib,collections
          s=Path('index.html').read_text(encoding='utf8')
          print('V277_BASE_SHA',hashlib.sha256(s.encode()).hexdigest(),'BYTES',len(s.encode()))
          print('V277_LEGACY_HANDLER_COUNTS',
            {kind:len(re.findall(r'\\b'+kind+r'\\s*=',s)) for kind in ['onclick','onkeydown','oninput','onchange','onsubmit','onkeyup','onpointerdown','onpointerup','onmousedown','ontouchstart']})
          print('V277_VUE_MOUNTS',sorted(collections.Counter(re.findall(r'module\\.(mount[A-Za-z0-9_]+)\\s*\\(',s)).items()))
          for token,size in [
           ('function renderAnalyticsView(',4200),
           ('function renderCourseView(',2400),
           ('function renderKnowledgeMap(',4300),
           ('function openKnowledgeTopicDetail(',3400),
           ('function renderTeacherView(',2000),
           ('function showVueReport(',2450),
           ('function openStagePicker(',1800),
           ('function showStageResult(',1500),
           ('function openQuickTrainer(',1500),
           ('function showVueResult(',1300),
           ('function renderHome(',1700),
           ('function knowledgeGoBack(',1000),
           ('function knowledgeTrainTopic(',1000),
          ]:
            hits=[m.start() for m in re.finditer(re.escape(token),s)]
            print('V277_TOKEN',repr(token),'COUNT',len(hits))
            for at in hits[:2]:
              print('V277_CONTEXT_BEGIN',repr(token),'OFFSET',at,'LINE',s.count('\\n',0,at)+1)
              print(s[at:at+size])
              print('V277_CONTEXT_END')
          PY
