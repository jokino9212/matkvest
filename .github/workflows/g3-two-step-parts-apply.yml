          +
          +**После правок.** Разминка объединяет данные и добавляет или убирает часть. Тренировка использует три разные цепочки из двух операций. Мастер восстанавливает исходные количества или сравнивает число предметов после равного распределения. Шаблоны чередуются, разбор показывает два шага.
          +
          +- Независимо решены 9 600 задач. Проверены целые ответы, промежуточные вычисления и отсутствие одинаковых условий между уровнями.
          +- На 320, 390 и 1280 px пройдены 12 попыток и засчитан 81 ответ. F5 сохранил прогресс и награды. На 390 px кнопка «Продолжить» восстановила второй вопрос всех трёх прерванных попыток.
          +
          +Следующая тема 3-го класса — «Половина, треть, четверть, пятая и десятая часть» (`g3:parts_intro`).
          +
          +### 2026-11-19. Половина, треть, четверть, пятая и десятая часть (`g3:parts_intro`)
          +
          +**До правок.** В Chromium проверено по 1 200 задач на уровень (зерно 19502).
          +
          +- Тексты между уровнями не совпадают. На разминке один тип вопроса, всего пять условий. Тренировка переводит название доли в запись и обратно.
          +- На мастере все задания сводятся к подсчёту равных клеток на рисунке и выбору названия или записи доли. Нет восстановления целого из выделенной части и разбиения одной доли на части.
          +
          +**После правок.** В разминке долю определяют по тексту и по рисунку. На тренировке переводят название в дробную запись и обратно. Мастер различает полное и недостающее количество частей и находит долю всего листа после повторного разбиения. Типы чередуются.
          +
          +- В Chromium независимо проверены 9 600 ответов по словам, записи дроби и количеству клеток в схеме. Проверены правильный вариант, его единственность и отсутствие одинаковых условий и рисунков между уровнями.
          +- На 320, 390 и 1280 px завершены 12 попыток и засчитан 81 ответ. F5 сохранил прогресс. На 390 px после F5 на всех трёх уровнях продолжение открыло тот же второй вопрос.
          +
