name: Stage16 grade-five meaningful variety audit
on:
  push:
    branches: [audit/g5-pedagogy-stage16-20261111]
    paths:
      - audits/g5_stage16_pedagogy_audit.cjs
      - .github/workflows/quiz-stage16-pedagogy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pedagogy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Sample 38,160 real questions and rank lesson monotony
        run: timeout 900s node audits/g5_stage16_pedagogy_audit.cjs
      - name: Upload ranked pedagogical deficits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-stage16-pedagogical-variety
          path: audits/out/g5_stage16_pedagogy_audit.json
          if-no-files-found: warn
