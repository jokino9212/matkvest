name: Private Vue v267 full-route and textbook smoke
on:
  push:
    branches: [fix/vue-mount-actions-20261123]
    paths:
      - '.github/workflows/vue-routes-v267-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grades:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify legacy analytics to Vue routing contracts
        run: node audits/vue_analytics_scope.cjs
      - name: Verify grades 1–8, map, keyboard, teacher scope and offline F5
        run: node audits/vue_knowledge_map_browser.cjs
