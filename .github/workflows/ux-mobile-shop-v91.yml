name: UX mobile shop v91 staged UI Gate
on:
  push:
    branches: [ux-final/ux00-inventory-20261108]
    paths: ['.github/workflows/ux-mobile-shop-v91.yml','audits/ux_mobile_shop_v91_browser.cjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  staging:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply mobile shop header and selector fix, PWA v91
        run: python3 audits/ux_mobile_shop_v91_patch.py
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Six-width category navigation and 50 badge UI Gate
        run: timeout 180s node audits/ux_mobile_shop_v91_browser.cjs
      - name: Regression - sorting and progress
        run: timeout 120s node audits/shop_progress_v874_browser_test.cjs
      - name: Regression - full-screen pet and avatar viewer
        run: timeout 120s node audits/collection_viewer_v81_browser.cjs
      - name: Regression - leaderboard and collection worth
        run: timeout 120s node audits/stage30_collection_media_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-mobile-shop-v91-screenshots
          path: audits/ux_mobile_shop_v91_output/
          retention-days: 60
      - name: Commit staging PWA only after all tests pass
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(ux): responsive shop title and accessible mobile category selector [skip ci]"
            git pull --rebase origin ux-final/ux00-inventory-20261108
            git push origin HEAD:ux-final/ux00-inventory-20261108
          fi
