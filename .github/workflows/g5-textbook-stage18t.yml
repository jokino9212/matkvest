name: Stage18T Grade5 textbook topics guarded candidate
on:
  push:
    branches: [audit/g5-g6-textbook-coverage-20261112]
    paths:
      - g5-textbook-topics.js
      - g5-textbook-core.js
      - audits/g5_textbook_patch.py
      - audits/g5_textbook_topics_browser.cjs
      - .github/workflows/g5-textbook-stage18t.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  textbook-topics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Activate only verified Grade 5 topics and PWA fingerprint
        run: python3 audits/g5_textbook_patch.py
      - name: Syntax validation
        run: |
          node --check g5-textbook-topics.js
          node --check g5-textbook-core.js
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: New grade-five topic and stage regression
        run: node audits/g5_textbook_topics_browser.cjs
      - name: Verify existing grade-five conversion math and diversity
        run: |
          node audits/g5_conversion_ux_smoke.cjs
          node audits/g5_conversion_diversity_smoke.cjs
      - name: Save validated candidate to audit branch only
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "feat(g5): activate three missing curriculum topics in staging v110"
            git fetch origin audit/g5-g6-textbook-coverage-20261112
            git rebase origin/audit/g5-g6-textbook-coverage-20261112
            git push origin HEAD:audit/g5-g6-textbook-coverage-20261112
          fi
