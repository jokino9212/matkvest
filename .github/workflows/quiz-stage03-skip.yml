name: Quiz stage03 skip answer diagnostics
on:
  push:
    branches: [fix/quiz-fractions-stage01-20261110]
    paths:
      - audits/quiz_stage03_probe.py
      - audits/quiz_stage03_skip_browser.cjs
      - audits/quiz_stage03_completion_browser.cjs
      - audits/quiz_stage03_fix.py
      - .github/workflows/quiz-stage03-skip.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: python3 audits/quiz_stage03_probe.py
      - name: Apply skip-answer reveal without score mutation
        run: python3 audits/quiz_stage03_fix.py
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node audits/quiz_stage03_skip_browser.cjs
      - name: Full skipped training across 3 widths and formats
        run: node audits/quiz_stage03_completion_browser.cjs
      - name: Regress earlier fraction logic and field focus
        run: |
          node audits/quiz_stage01_fraction_browser.cjs
          node audits/quiz_stage01_navigation_browser.cjs
          node audits/quiz_stage02_input_browser.cjs
      - name: Commit only tested HTML and PWA hash to working branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(quiz): reveal correct answer before advancing skipped question"
            git push origin HEAD:fix/quiz-fractions-stage01-20261110
          fi
