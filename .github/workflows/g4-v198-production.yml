      - name: Verify upgrading a v197 profile and draft to v198
        shell: bash
        run: |
          set -euo pipefail
          export G4_CHROME="$(command -v google-chrome || command -v chromium)"
          export G4_ROOT_FILE="$RUNNER_TEMP/g4-root"
          export G4_OLD_ROOT="$RUNNER_TEMP/matkvest-v197"
          git worktree add --detach "$G4_OLD_ROOT" 3522cbf0979390d4b2887f336cc6e76f76781921
          printf '%s' "$PWD" > "$G4_ROOT_FILE"
          cat > "$RUNNER_TEMP/g4-server.py" <<'SERVER'
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          import os
          class Handler(SimpleHTTPRequestHandler):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, directory=Path(os.environ["G4_ROOT_FILE"]).read_text(), **kwargs)
              def send_head(self):
                  del self.headers["If-Modified-Since"]
                  return super().send_head()
              def end_headers(self):
                  self.send_header("Cache-Control", "no-store")
                  super().end_headers()
          ThreadingHTTPServer(("127.0.0.1", 8198), Handler).serve_forever()
          SERVER
          python "$RUNNER_TEMP/g4-server.py" > "$RUNNER_TEMP/g4-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          curl -fsS --retry-connrefused --retry 4 -o /dev/null http://127.0.0.1:8198/
          G4_URL=http://127.0.0.1:8198/ G4_UPGRADE_ONLY=1 python "$RUNNER_TEMP/grade4.py" | tee -a "$GITHUB_STEP_SUMMARY"
