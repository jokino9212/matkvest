name: Grade 8 Warm-up verification
on:
  push:
    branches: [review/g8-warmup-training]
    paths:
      - .github/workflows/g8-warmup-review-once.yml
permissions:
  contents: read
jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node audits/g8_textbook_browser.cjs
        env:
          MATKVEST_G8_WARMUP_ONLY: '1'
