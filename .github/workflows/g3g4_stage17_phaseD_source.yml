name: MatKvest stage17D - source evidence
on:
  push:
    branches: [audit/g3g4-stage17-20261104]
    paths:
      - audits/g3g4_stage17_phaseD_source_inspect.py
      - .github/workflows/g3g4_stage17_phaseD_source.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-stage17D-source
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g3g4-stage17-20261104
          persist-credentials: true
      - name: Check working HTML and SW integrity
        run: |
          echo '8bd7ccd047368b8754299e7c1bd5995229f789b040a9ca8478d1ecb4b521da5a  index.html' | sha256sum --check
          python3 audits/g7_stage12_sync_pwa.py --check
      - name: Extract focused read-only generator contexts
        run: python3 audits/g3g4_stage17_phaseD_source_inspect.py
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-stage17D-source
          path: audits/g3g4_stage17_phaseD_source_inspect.json
          if-no-files-found: warn
      - name: Commit audit evidence on isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/g3g4_stage17_phaseD_source_inspect.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(stage17D): capture exact generator source contexts [skip ci]"
            git push origin HEAD:audit/g3g4-stage17-20261104
          fi
