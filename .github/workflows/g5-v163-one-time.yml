name: ONE-TIME Grade 5 paragraph 27 v163 PWA activation
on:
  push:
    branches:
      - audit/g5-paragraph27-20261114
    paths:
      - '.github/workflows/g5-v163-one-time.yml'
permissions:
  contents: write
jobs:
  apply-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Activate versioned scripts and network-first worker
        run: |
          python3 audits/g5_v163_activate.py
          python3 audits/g5_v163_activate.py --check
      - name: Commit release stamp
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo 'v163 already activated'
          else
            git commit -m 'Release v163: PWA versioned Grade 5 scripts and build hash'
            git push origin HEAD:audit/g5-paragraph27-20261114
          fi
