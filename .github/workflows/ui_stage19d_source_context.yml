name: MatKvest UI19D - capture scoped economy implementation source
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19d_source_context.yml
      - audits/ui_stage19d_source_context.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          persist-credentials: true
      - run: node audits/ui_stage19d_source_context.mjs
      - name: Save focused source snapshot for audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/ui_stage19d_source_context.json
          git diff --cached --quiet || git commit -m "audit(ui19D): extract current shop and archived-sale implementation"
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
