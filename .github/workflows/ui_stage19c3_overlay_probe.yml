name: MatKvest UI19C3 - modal structure and training entry probe
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19c3_overlay_probe.yml
      - audits/ui_stage19c3_overlay_probe.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - run: node audits/ui_stage19c3_overlay_probe.mjs
      - name: Compact readable DOM selectors and screenshot evidence
        if: success()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const d=JSON.parse(fs.readFileSync("audits/ui_stage19c3_overlay_probe.json","utf8"));
            const brief=d.screens.map(x=>({name:x.name,width:x.width,root:x.data.dialogs?.slice(0,3),buttons:x.data.buttons?.slice(0,30),cards:x.data.cards?.slice(0,34),overlayHtml:x.data.overlayRoot?.slice(0,5000),action:x.name==="stage click"?x.data:undefined}));
            fs.writeFileSync("audits/ui_stage19c3_overlay_brief.json",JSON.stringify({screens:brief,errors:d.errors},null,2)+"\n");
            console.log("SCREEN OVERLAY KEYS",JSON.stringify(brief.map(x=>({name:x.name,width:x.width,root:x.root?.[0],buttons:x.buttons?.slice(0,12).map(b=>({id:b.id,cls:b.cls,text:b.text})),action:x.action}))).slice(0,16000));
          '
          for name in stage_first_1280 stage_first_390 shop_390 profile_390 topic_390; do
            base64 -w0 "audits/ui19c3_overlay_${name}.png" > "audits/ui19c3_overlay_review_${name}.b64.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matkvest-ui19c3-v59-modals-and-practice-probe
          path: |
            audits/ui_stage19c3_overlay_probe.json
            audits/ui_stage19c3_overlay_brief.json
            audits/ui19c3_overlay_*.png
          if-no-files-found: warn
      - name: Save reduced audit data to working branch
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/ui_stage19c3_overlay_brief.json audits/ui19c3_overlay_review_*.b64.txt
          git diff --cached --quiet || git commit -m "audit(ui19C3): capture modal and practice DOM + visible screenshots"
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
