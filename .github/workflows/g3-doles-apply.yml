          --- a/audits/g1_g4_content_audit_2026-11-17.md
          +++ b/audits/g1_g4_content_audit_2026-11-17.md
          @@ -1570 +1570,29 @@
           - На мастере меняется сюжет, но оба типа заканчиваются выбором знака, который можно поставить без расчёта длин. Разбор задачи про шнуры завершает фраза о лентах.
          +
          +**После правок.** Равные доли теперь встречаются на разминке и на схеме в тренировке. Мастер сравнивает длины отрезанных частей и требует посчитать их разницу в сантиметрах. Разбор использует обозначения из условия.
          +
          +- В Chromium независимо решены 9 600 задач по записям дробей, названиям, клеткам равных полосок и длинам. Между уровнями одинаковых условий нет.
          +- На 320, 390 и 1280 px пройдены 12 попыток. Варианты со знаками и числовой ввод прошли проверку. Очки и история сохранены после F5, все три незаконченные попытки восстановлены со второго вопроса на 390 px.
          +
          +Следующая тема 3-го класса — «Нахождение доли величины» (`g3:part_of_quantity`).
          +
          +### 2026-11-19. Нахождение доли величины (`g3:part_of_quantity`)
          +
          +**До правок.** В Chromium проверено по 1 200 задач на уровень (зерно 19502).
          +
          +- Разминка и тренировка используют один формальный шаблон. Мастер повторяет его или добавляет единицу, действие остаётся тем же. Пересечения условий между уровнями составили 24, 24 и 55.
          +- Нет задач, где перед вычислением доли нужно найти целое, или после вычисления доли — остаток. Для целых ответов предложен формат десятичной дроби.
          +
          +**После правок.** Разминка предлагает долю в словесной и дробной записи. Тренировка использует длину, количество участников и продолжительность. Мастер находит долю после объединения или изменения исходных данных либо вычисляет остаток. Для именованных ответов указана единица.
          +
          +- В Chromium независимо решены 9 600 задач по условию и записи доли. Ответы и разборы совпали. Между уровнями повторов нет.
          +- На 320, 390 и 1280 px завершены 12 попыток с 81 правильным ответом. Проверены ошибка, исправление и сохранение прогресса после F5. На 390 px каждый прерванный уровень продолжился с того же второго вопроса.
          +
          +Следующая тема 3-го класса — «Точка, прямая, прямой угол, ломаная, многоугольник» (`g3:geometry_figures`).
          +
