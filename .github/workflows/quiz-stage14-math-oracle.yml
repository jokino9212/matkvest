name: Stage14 grade five independent math oracle probe
on:
  push:
    branches: [audit/g5-math-content-stage14-20261111]
    paths:
      - audits/g5_stage14_math_probe.cjs
      - .github/workflows/quiz-stage14-math-oracle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Capture actual answer and explanation structure
        run: node audits/g5_stage14_math_probe.cjs
