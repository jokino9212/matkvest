name: Grade 5 curriculum v111 candidate gate
on:
  push:
    branches: [feat/g5-v111-curriculum-20261112]
    paths:
      - g5-textbook-v111.js
      - audits/g5_v111_patch.py
      - audits/g5_v111_browser.cjs
      - .github/workflows/g5-v111-curriculum.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: python3 audits/g5_v111_patch.py
      - run: node --check g5-textbook-v111.js
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Six new curriculum topics independent full session checks and 320-1280 px browser
        run: node audits/g5_v111_browser.cjs
      - name: Grade 5 baseline previous topics and fraction regression
        run: |
          sed 's/!==61/!==67/g;s/61 fifth-grade/67 fifth-grade/g;s/!==56/!==67/g' audits/g5_textbook_topics_browser.cjs > /tmp/g5_v111_baseline.cjs
          cp /tmp/g5_v111_baseline.cjs audits/g5_v111_baseline_runtime.cjs
          node audits/g5_v111_baseline_runtime.cjs
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
      - name: Commit candidate HTML and PWA only after all tests succeed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "feat(g5): activate Vilenkin textbook sections in v111 candidate"
            git fetch origin feat/g5-v111-curriculum-20261112
            git rebase origin/feat/g5-v111-curriculum-20261112
            git push origin HEAD:feat/g5-v111-curriculum-20261112
          fi
