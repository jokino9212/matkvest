name: MatKvest UI19E - per-profile wealth and non-mutating wallet gate
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19e_gate.yml
      - audits/ui_stage19e_patch.py
      - audits/ui_stage19e_test.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-ui19e-v64
  cancel-in-progress: false
jobs:
  wallet-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          fetch-depth: 0
          persist-credentials: true
      - name: Patch SHA-verified v63 to v64
        run: python3 audits/ui_stage19e_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify wallet rendering, existing accounting, resale and archived assets
        run: node audits/ui_stage19e_test.mjs
      - name: Recheck store rarity tabs and verified checkout / refund transactions
        run: |
          sed 's/matkvest-iphone-v63/matkvest-iphone-v64/g' audits/ui_stage19d_test.mjs > audits/_ui19e_regress_d.mjs
          node audits/_ui19e_regress_d.mjs
          rm audits/_ui19e_regress_d.mjs
      - name: Recheck eight-grade topic search and mobile layout
        run: |
          sed 's/matkvest-iphone-v62/matkvest-iphone-v64/g' audits/ui_stage19c4_test.mjs > audits/_ui19e_regress_c4.mjs
          node audits/_ui19e_regress_c4.mjs
          rm audits/_ui19e_regress_c4.mjs
      - name: Recheck result, resume, collection and chests
        run: |
          sed 's/matkvest-iphone-v61/matkvest-iphone-v64/g' audits/ui_stage19c3b_test.mjs > audits/_ui19e_regress_c3b.mjs
          node audits/_ui19e_regress_c3b.mjs
          rm audits/_ui19e_regress_c3b.mjs
      - name: Recheck original store, profile, training modals
        run: |
          sed 's/matkvest-iphone-v60/matkvest-iphone-v64/g' audits/ui_stage19c3_test.mjs > audits/_ui19e_regress_c3.mjs
          node audits/_ui19e_regress_c3.mjs
          rm audits/_ui19e_regress_c3.mjs
      - name: Recheck grade cards responsive header
        run: |
          sed 's/matkvest-iphone-v59/matkvest-iphone-v64/g' audits/ui_stage19c2_test.mjs > audits/_ui19e_regress_c2.mjs
          node audits/_ui19e_regress_c2.mjs
          rm audits/_ui19e_regress_c2.mjs
      - name: Recheck keyboard, topic cards and design
        run: |
          sed -e 's/matkvest-iphone-v58/matkvest-iphone-v64/g' -e 's/state.mobileMenu===(w<=600)/state.mobileMenu===(w<=1120)/g' audits/ui_stage19c_test.mjs > audits/_ui19e_regress_c.mjs
          node audits/_ui19e_regress_c.mjs
          rm audits/_ui19e_regress_c.mjs
      - name: Recheck class-card navigation
        run: |
          sed 's/matkvest-iphone-v56/matkvest-iphone-v64/g' audits/ui_stage19a_test.mjs > audits/_ui19e_regress_a.mjs
          node audits/_ui19e_regress_a.mjs
          rm audits/_ui19e_regress_a.mjs
      - name: Recheck mobile menu interactions
        run: |
          sed -e 's/matkvest-iphone-v57/matkvest-iphone-v64/g' -e 's/if(width<=600){/if(width<=768){/g' audits/ui_stage19b_test.mjs > audits/_ui19e_regress_b.mjs
          node audits/_ui19e_regress_b.mjs
          rm audits/_ui19e_regress_b.mjs
      - name: Crossgrade math, question generation and access regression
        run: |
          SHA="$(sha256sum index.html | cut -d' ' -f1)"
          sed "s/f188d39a3a16fc54dfb32238fc34d3dfe6cc3c4416cd475579bf3ed65a7e1e36/$SHA/g" audits/g7_stage14_crossgrade_test.mjs > audits/_ui19e_crossgrade.mjs
          node audits/_ui19e_crossgrade.mjs
          rm audits/_ui19e_crossgrade.mjs
      - name: Grade4 written arithmetic and input regression
        run: |
          SHA="$(sha256sum index.html | cut -d' ' -f1)"
          sed "s/f188d39a3a16fc54dfb32238fc34d3dfe6cc3c4416cd475579bf3ed65a7e1e36/$SHA/g" audits/g7_stage14_grade4_test.mjs > audits/_ui19e_grade4.mjs
          node audits/_ui19e_grade4.mjs
          rm audits/_ui19e_grade4.mjs
      - name: Verify PWA SHA256 fingerprint
        run: python3 audits/g7_stage12_sync_pwa.py --check
      - name: Export visual-review screenshots
        if: success()
        run: |
          for name in wallet_320 wallet_390 wallet_1280; do
            base64 -w0 "audits/ui19e_after_${name}.png" > "audits/ui19e_after_review_${name}.b64.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matkvest-ui19e-v64-wallet-and-regression-gate
          path: |
            audits/ui_stage19e_patch_report.json
            audits/ui_stage19e_test_report.json
            audits/ui19e_after_*.png
          if-no-files-found: warn
      - name: Preserve v64 only if full gate passed
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js audits/ui_stage19e_patch_report.json audits/ui_stage19e_test_report.json audits/ui19e_after_review_*.b64.txt
          git diff --cached --quiet || git commit -m "feat(ui19E): clear read-only per-profile wealth wallet and financial transparency v64"
          for file in audits/ui_stage19d_test_report.json audits/ui_stage19c4_test_report.json audits/ui_stage19c3b_test_report.json audits/ui_stage19c3_test_report.json audits/ui_stage19c2_test_report.json audits/ui_stage19c_test_report.json audits/ui_stage19a_test_report.json audits/ui_stage19b_test_report.json audits/g7_stage14_crossgrade_report.json audits/g7_stage14_grade4_report.json; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then git restore -- "$file"; else rm -f "$file"; fi
          done
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
