name: Isolated backend 9.5 Vue account and read-only screens
on:
  push:
    branches: [integration/backend95-v290-account]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend95-account
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'jokino9212/matkvest' && github.ref == 'refs/heads/integration/backend95-v290-account'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm ci && npm install --no-save --no-package-lock playwright@1.56.1
      - name: Test shared account state
        run: node audits/backend95_account_store.test.mjs
      - name: Build isolated Vue and SHA-fenced PWA
        run: |
          npm run build:knowledge-map
          python3 audits/build_backend95_account.py "${{ runner.temp }}/backend95-site"
      - name: Browser integration against synthetic same-origin API
        run: node audits/backend95_account_browser.cjs "${{ runner.temp }}/backend95-site"
      - name: Isolated school block queue IndexedDB regression
        run: node audits/backend95_school_queue_browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: matkvest-v290-backend95-readonly-candidate
          path: ${{ runner.temp }}/backend95-site
