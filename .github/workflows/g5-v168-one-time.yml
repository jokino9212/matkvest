name: One-time Grade 5 paragraph 32 v168 PWA activation
on:
  push:
    branches:
      - audit/g5-paragraph32-20261115
    paths:
      - '.github/workflows/g5-v168-one-time.yml'
permissions:
  contents: write
jobs:
  apply-v168:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh all 19 Grade 5 script URLs and Service Worker
        run: |
          python3 audits/g5_v168_activate.py
          python3 audits/g5_v168_activate.py --check
          grep -q 'const CACHE_NAME = "matkvest-iphone-v168";' sw.js
          if grep -q -E 'src="g5-[^"]+\?v=167"' index.html; then
            echo "Old Grade 5 v167 URLs remain" >&2
            exit 1
          fi
      - name: Commit verified v168 HTML and Service Worker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo 'v168 already active'
          else
            git commit -m 'Release v168: Grade 5 mixed arithmetic and 19 fresh PWA assets'
            git push origin HEAD:audit/g5-paragraph32-20261115
          fi
