name: Inspect Vue candidate build and version markers
on:
  push:
    branches: [fix/vue-mount-actions-20261123]
    paths:
      - '.github/workflows/vue-candidate-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing version markers
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          x=Path('index.html').read_text('utf-8')
          print('index size=', len(x),'line count=',len(x.splitlines()))
          for term in ['v266','?v=266','Сборка v266','BUILD_VERSION','knowledgeMapUrl','appVersionBadge','v267']:
              print('MARKER',repr(term),'count',x.count(term))
              for m in list(re.finditer(re.escape(term),x))[:5]:
                  print('  ',repr(x[max(0,m.start()-120):m.end()+130]))
          print('SW cache=',re.findall(r'matkvest-iphone-v\\d+',Path('sw.js').read_text('utf-8'))[:4])
          PY
      - run: npm ci
      - run: npm run build:knowledge-map
      - name: Inspect build output
        run: |
          ls -lh assets/ui/knowledge-map.js
          git status --short
