name: Test-only route core integration PWA v269 and browser gate
on:
  push:
    branches: [refactor/route-vue-actions-from-7c14ce9]
    paths:
      - 'audits/legacy_navigation_v269_patch.py'
      - 'audits/legacy_navigation_v269_browser.cjs'
      - 'audits/g7_stage12_sync_pwa.py'
      - '.github/workflows/legacy-navigation-v269-gate.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: route-v269-test-branch
  cancel-in-progress: false
jobs:
  integrate-and-test:
    if: github.repository == 'jokino9212/matkvest' && github.ref == 'refs/heads/refactor/route-vue-actions-from-7c14ce9'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/route-vue-actions-from-7c14ce9
          persist-credentials: true
      - name: Apply exact known-base HTML edit on runner; never touch main
        run: python3 audits/legacy_navigation_v269_patch.py
      - name: Verify PWA v269 and script integrity
        run: |
          python3 audits/g7_stage12_sync_pwa.py
          python3 audits/g7_stage12_sync_pwa.py --check
          git diff --check
      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Check route unit contracts
        run: node audits/legacy_navigation_core.test.cjs
      - name: Verify Vue build still matches sources
        run: |
          npm run build:knowledge-map
          git diff --exit-code -- assets/ui/knowledge-map.js
      - name: Test browser keyboard, routes, fallback, offline F5, results and rewards
        run: node audits/legacy_navigation_v269_browser.cjs
      - name: Confirm final PWA snapshot matches committed assets
        run: python3 audits/g7_stage12_sync_pwa.py --check
      - name: Commit only validated index.html and sw.js into the SAME test branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "test(pwa): integrate guarded legacy route core and sync v269"
            git push origin HEAD:refs/heads/refactor/route-vue-actions-from-7c14ce9
          else
            echo "Verified v269 snapshot already committed."
          fi
