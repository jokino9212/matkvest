name: G5 stage42 Vilenkin §§28-32 mixed fractions exact oracle
on:
  push:
    branches:
      - audit/g5-stage42-mixed-fractions-20261113
    paths:
      - 'g5-fractions-v114.js'
      - 'g5-fraction-arithmetic-v115.js'
      - 'g5-fraction-applications-v130.js'
      - 'audits/g5_stage42_mixed_fraction_oracle.cjs'
      - '.github/workflows/g5-stage42-mixed-fractions.yml'
      - 'sw.js'
  pull_request:
    branches:
      - main
    paths:
      - 'g5-fractions-v114.js'
      - 'g5-fraction-arithmetic-v115.js'
      - 'g5-fraction-applications-v130.js'
      - 'audits/g5_stage42_mixed_fraction_oracle.cjs'
jobs:
  verify-grade5-fractions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Verify code and audit scripts syntax
        run: |
          node --check g5-fractions-v114.js
          node --check g5-fraction-arithmetic-v115.js
          node --check g5-fraction-applications-v130.js
          node --check audits/g5_stage42_mixed_fraction_oracle.cjs
      - name: Install pinned Playwright runtime
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify 2700 questions across §§28-32 and visual fractions
        run: node audits/g5_stage42_mixed_fraction_oracle.cjs
      - name: Preserve full Grade 5 topics and distinct difficulty
        run: node audits/g5_v132_74_real_cognitive_inventory.cjs
      - name: Preserve independent exact fraction arithmetic
        run: |
          node audits/g5_stage39_fraction_independent_oracle.cjs
          node audits/g5_stage38_percent_context_check.cjs
      - name: Preserve §25-§27 and §50-§51 visual and math semantics
        run: |
          node audits/g5_stage40_paragraph25_browser_oracle.cjs
          node audits/g5_stage41_fractions_angles_browser_oracle.cjs
      - name: Preserve conversion modes, example 26/9, and keyboard
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
