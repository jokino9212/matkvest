name: Grade 5 sequential textbook audit §8 addition and its properties
on:
  push:
    branches:
      - audit/g5-sequential-paragraph08-properties-20261113
    paths:
      - 'g5-arithmetic-tiers-v123.js'
      - 'g5-textbook-core.js'
      - 'audits/g5_sequential_paragraph08_browser_oracle.cjs'
      - '.github/workflows/g5-sequential-08.yml'
      - 'sw.js'
  pull_request:
    branches:
      - main
    paths:
      - 'g5-arithmetic-tiers-v123.js'
      - 'g5-textbook-core.js'
      - 'audits/g5_sequential_paragraph08_browser_oracle.cjs'
jobs:
  sequential-paragraph08:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Check source and independent §8 auditor syntax
        run: |
          node --check g5-arithmetic-tiers-v123.js
          node --check g5-textbook-core.js
          node --check audits/g5_sequential_paragraph08_browser_oracle.cjs
      - name: Install pinned Playwright browser
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify 600 real addition exercises and both properties
        run: node audits/g5_sequential_paragraph08_browser_oracle.cjs
      - name: Preserve strictly sequential §1 through §7
        run: |
          node audits/g5_sequential_paragraphs01_03_browser.cjs
          node audits/g5_sequential_paragraph04_browser_oracle.cjs
          node audits/g5_sequential_paragraph05_browser_oracle.cjs
          node audits/g5_sequential_paragraph06_browser_oracle.cjs
          node audits/g5_sequential_paragraph07_browser_oracle.cjs
      - name: Preserve 74 Grade 5 topics and 1110 distinct families
        run: node audits/g5_v132_74_real_cognitive_inventory.cjs
      - name: Preserve visual fractions, exact calculations and geometry
        run: |
          node audits/g5_stage43_factorization_real_math_oracle.cjs
          node audits/g5_stage42_mixed_fraction_oracle.cjs
          node audits/g5_stage41_fractions_angles_browser_oracle.cjs
          node audits/g5_stage40_paragraph25_browser_oracle.cjs
          node audits/g5_stage39_fraction_independent_oracle.cjs
      - name: Preserve mixed fraction conversion input and scoring
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
