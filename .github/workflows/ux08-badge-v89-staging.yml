name: UX-08 badge expansion v89 staging gate
on:
  push:
    branches: [ux-final/ux00-inventory-20261108]
    paths: ['.github/workflows/ux08-badge-v89-staging.yml','audits/ux08_badge_v89_browser.cjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  staging:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build final 50-item badge catalog, PWA v89
        run: python3 audits/ux08_expand_badges_v89.py
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Browser E2E catalog, price, purchase and collection for 50
        run: timeout 150s node audits/ux08_badge_v89_browser.cjs
      - name: Regression shop order and progress
        run: timeout 120s node audits/shop_progress_v874_browser_test.cjs
      - name: Regression full-screen avatar and pet viewer
        run: timeout 120s node audits/collection_viewer_v81_browser.cjs
      - name: Regression leaderboard and inventory value
        run: timeout 120s node audits/stage30_collection_media_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux08-badge-v89-gallery
          path: audits/ux08_badge_v89_output/
          retention-days: 60
      - name: Save verified staging HTML and PWA only on PASS
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "feat(ux08): 50 SVG badges in staging v89 [skip ci]"
            git pull --rebase origin ux-final/ux00-inventory-20261108
            git push origin HEAD:ux-final/ux00-inventory-20261108
          fi
