name: MatKvest UI19C4 - topic navigation structure probe
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19c4_nav_structure.yml
      - audits/ui_stage19c4_nav_structure.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  nav:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Record topic and section structure at mobile and desktop sizes
        run: node audits/ui_stage19c4_nav_structure.mjs
      - name: Save DOM structure report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/ui_stage19c4_nav_structure.json
          git diff --cached --quiet || git commit -m "audit(ui19C4): grade section structure for accessible topic navigation"
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
