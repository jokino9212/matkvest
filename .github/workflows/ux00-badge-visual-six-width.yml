name: UX-00 badge visual six-width gate
on:
  push:
    branches: [ux-final/ux00-inventory-20261108]
    paths: ['.github/workflows/ux00-badge-visual-six-width.yml','audits/ux00_badge_final_visual_browser.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Browser six-width real UI badge gallery
        run: timeout 150s node audits/ux00_badge_final_visual_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux00-badges-six-width-visual
          path: audits/ux00_badge_final_visual_output/
          retention-days: 60
