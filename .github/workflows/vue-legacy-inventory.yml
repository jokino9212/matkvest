name: Vue legacy handler inventory and offline regression
on:
  push:
    branches: [fix/vue-mount-actions-20261123]
    paths:
      - 'audits/vue_legacy_handler_inventory.py'
      - '.github/workflows/vue-legacy-inventory.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vue-legacy-inventory-private
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vue-mount-actions-20261123
          persist-credentials: true
      - name: Trust checked-out branch in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Enumerate HTML handlers and Vue mount points
        run: |
          python3 audits/vue_legacy_handler_inventory.py --json audits/VUE_LEGACY_HANDLERS_2026-11-23.json --markdown audits/VUE_LEGACY_HANDLERS_2026-11-23.md
          git diff --check
      - name: Install browser test dependencies
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify legacy route action contracts
        run: node audits/vue_analytics_scope.cjs
      - name: Verify grade routes on phone and desktop including offline F5
        run: node audits/vue_knowledge_map_browser.cjs
      - name: Verify cached PWA offline on phone and tablet
        run: node audits/stage28_offline_pwa_browser.cjs
      - name: Verify attempt completion and reward idempotence
        run: node audits/stage24_attempt_lifecycle_browser.cjs
      - name: Publish inventory into test branch after green regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/VUE_LEGACY_HANDLERS_2026-11-23.json audits/VUE_LEGACY_HANDLERS_2026-11-23.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "audit: record measured legacy handler and Vue inventory"
            git push origin HEAD:fix/vue-mount-actions-20261123
          fi
