name: Stage30 leaderboard, inventory worth and media viewer regression
on:
  push:
    branches: [main, fix/leaderboard-collection-avatar-pets-20261107]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          html=Path('index.html').read_bytes()
          sw=Path('sw.js').read_text()
          assert 'matkvest-iphone-v81' in sw
          assert hashlib.sha256(html).hexdigest() in sw
          assert b'mk30CollectionWorth' in html
          print('STAGE30_RELEASE_INTEGRITY_PASS')
          PY
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node audits/stage30_collection_media_browser.cjs
