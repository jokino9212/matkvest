          +  const live=stageOverride===null&&blockSession?.kind==="g3quiz"&&blockSession.key==="g3:unknown_component";
          +  return g3UnknownQuestion(d,live?blockSession.done:null);
          + }
            if(raw==="order_operations")return g3OrderQuestion(d);
            if(raw==="quantity_operations")return g3QuantityQuestion(d);
           
