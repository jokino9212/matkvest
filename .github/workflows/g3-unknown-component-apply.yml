name: Apply verified Grade 3 unknown component patch
on:
  push:
    branches: [audit/g1-g4-content-v195]
    paths: [.github/workflows/g3-unknown-component-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify the tested source revision
        run: |
          git apply --check - <<'MATKVEST_PATCH'
          diff --git a/index.html b/index.html
          index ec92309..d1b2d88 100644
          --- a/index.html
          +++ b/index.html
          @@ -5670,15 +5670,60 @@ function g3ColumnExplanation(t,taskMode=null){
            return "";
           }
           function g3RemainderInputQuestion(dividend,divisor,qv,rem,ex,sig,audit={}){return {text:`Разделите <b>${dividend} : ${divisor}</b>. Найдите частное и остаток.`,answerMode:"remainder",answerQuotient:qv,answerRemainder:rem,ans:`${qv} (ост. ${rem})`,correctText:`${qv} (ост. ${rem})`,correctHtml:`<span class="math">${qv} (ост. ${rem})</span>`,inputHint:"Введите частное и остаток в два отдельных поля.",ex,sig,audit:{type:"g3Remainder",dividend,divisor,quotient:qv,remainder:rem,...audit}}}
          -function g3UnknownQuestion(d){
          - const types=d===0?["addend","minuend","subtrahend","factor"]:["addend","minuend","subtrahend","factor","dividend","divisor"],type=g6RandomFrom(types),x=ri(2,d===0?20:d===1?50:90);let text,answer=x,ex,audit={type:"g3Unknown",variant:type,x};
          - if(type==="addend"){const a=ri(2,40),sum=a+x;text=`□ + ${a} = ${sum}`;ex=`Чтобы найти неизвестное слагаемое, из суммы вычитаем известное: ${sum} − ${a} = <b>${x}</b>.`;audit={...audit,a,sum}}
          - else if(type==="minuend"){const b=ri(2,30),diff=x;text=`□ − ${b} = ${diff}`;answer=diff+b;ex=`Чтобы найти неизвестное уменьшаемое, к разности прибавляем вычитаемое: ${diff} + ${b} = <b>${answer}</b>.`;audit={...audit,b,diff,x:answer}}
          - else if(type==="subtrahend"){const diff=ri(2,30),minuend=x+diff;text=`${minuend} − □ = ${diff}`;answer=x;ex=`Чтобы найти неизвестное вычитаемое, из уменьшаемого вычитаем разность: ${minuend} − ${diff} = <b>${x}</b>.`;audit={...audit,minuend,diff}}
          - else if(type==="factor"){const k=ri(2,9),factor=ri(2,9),prod=k*factor;text=`□ · ${k} = ${prod}`;answer=factor;ex=`Чтобы найти неизвестный множитель, произведение делим на известный множитель: ${prod} : ${k} = <b>${factor}</b>.`;audit={...audit,k,prod,x:factor}}
