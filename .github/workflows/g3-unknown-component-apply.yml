          + const x=ri(8,45),a=ri(5,24),sum=x+a;
          + if(variant==="sumThenSubtract"){
          +  const b=ri(2,sum-1),result=sum-b;
          +  return input(`(□ + ${a}) − ${b} = ${result}`,x,
          +   `Восстановим уменьшаемое: ${result} + ${b} = ${sum}.<br>Найдём слагаемое: ${sum} − ${a} = <b>${x}</b>.`);
          + }
          + if(variant==="subtractSum"){
          +  const result=ri(5,40),b=sum+result;
          +  return input(`${b} − (□ + ${a}) = ${result}`,x,
          +   `Восстановим вычитаемое: ${b} − ${result} = ${sum}.<br>Найдём слагаемое: ${sum} − ${a} = <b>${x}</b>.`);
          + }
          + if(variant==="sumThenMultiply"){
          +  const b=ri(2,9),result=sum*b;
          +  return input(`(□ + ${a}) · ${b} = ${result}`,x,
          +   `Восстановим множитель: ${result} : ${b} = ${sum}.<br>Найдём слагаемое: ${sum} − ${a} = <b>${x}</b>.`);
          + }
          + const divisor=ri(2,9),quotient=ri(2,9),difference=divisor*quotient,minuend=x+difference;
          + return input(`(${minuend} − □) : ${divisor} = ${quotient}`,x,
          +  `Восстановим делимое: ${quotient} · ${divisor} = ${difference}.<br>Найдём вычитаемое: ${minuend} − ${difference} = <b>${x}</b>.`);
           }
           function g3OrderQuestion(d){
            let variant,text,answer,ex,audit={type:"g3OrderOps"};
          @@ -7104,7 +7149,10 @@ function makeG3Question(id,stageOverride=null){
             const live=stageOverride===null&&blockSession?.kind==="g3quiz"&&blockSession.key==="g3:properties";
             return g3PropertiesQuestion(d,live?blockSession.done:null);
            }
          - if(raw==="unknown_component")return g3UnknownQuestion(d);
