          + const variants=[
          +  ["addendLeft","addendRight","minuend","subtrahend"],
          +  ["factorLeft","factorRight","dividend","divisor"],
          +  ["sumThenSubtract","subtractSum","sumThenMultiply","differenceThenDivide"]
          + ][d];
          + const variant=slot===null?g6RandomFrom(variants):variants[slot%variants.length];
