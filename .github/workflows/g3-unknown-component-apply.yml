          +   return input(`${left} = ${product}`,x,`Произведение делим на известный множитель: ${product} : ${a} = <b>${x}</b>.`);
          +  }
          +  if(variant==="dividend"){
          +   return input(`□ : ${a} = ${x}`,product,`Частное умножаем на делитель: ${x} · ${a} = <b>${product}</b>.`);
          +  }
          +  return input(`${product} : □ = ${a}`,x,`Делимое делим на частное: ${product} : ${a} = <b>${x}</b>.`);
