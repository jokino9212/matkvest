name: G5 stage43 Vilenkin §§33–40 factorization and exact math
on:
  push:
    branches:
      - audit/g5-stage43-common-denominator-20261113
    paths:
      - 'g5-fraction-concepts-v129.js'
      - 'g5-fraction-applications-v130.js'
      - 'audits/g5_stage43_factorization_real_math_oracle.cjs'
      - '.github/workflows/g5-stage43-factorization.yml'
      - 'sw.js'
  pull_request:
    branches:
      - main
    paths:
      - 'g5-fraction-concepts-v129.js'
      - 'g5-fraction-applications-v130.js'
      - 'audits/g5_stage43_factorization_real_math_oracle.cjs'
jobs:
  grade-five-stage43:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Syntax of changed fraction content and verification script
        run: |
          node --check g5-fraction-concepts-v129.js
          node --check g5-fraction-applications-v130.js
          node --check audits/g5_stage43_factorization_real_math_oracle.cjs
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Independent 3000 actual fraction answers and prime-factor explanations
        run: node audits/g5_stage43_factorization_real_math_oracle.cjs
      - name: Preserve entire 74-topic curriculum and variety
        run: node audits/g5_v132_74_real_cognitive_inventory.cjs
      - name: Preserve prior rational and conversion regressions
        run: |
          node audits/g5_stage39_fraction_independent_oracle.cjs
          node audits/g5_stage42_mixed_fraction_oracle.cjs
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
      - name: Preserve complete graphical §25 and §50–51 checks
        run: |
          node audits/g5_stage40_paragraph25_browser_oracle.cjs
          node audits/g5_stage41_fractions_angles_browser_oracle.cjs
          node audits/g5_stage38_percent_context_check.cjs
