name: Quiz stage01 fraction diagnosis
on:
  push:
    branches: [fix/quiz-fractions-stage01-20261110]
    paths:
      - audits/quiz_stage01_probe.py
      - audits/quiz_stage01_fraction_browser.cjs
      - audits/quiz_stage01_navigation_browser.cjs
      - audits/quiz_stage01_fix.py
      - .github/workflows/quiz-stage01-fraction-probe.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Examine real production quiz handlers
        run: python3 audits/quiz_stage01_probe.py
      - name: Apply narrow form fix and refresh service-worker integrity
        run: python3 audits/quiz_stage01_fix.py
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Check 161 rational-grading cases in production HTML
        run: node audits/quiz_stage01_fraction_browser.cjs
      - name: Navigate real grade-5 quiz by clicking Next
        run: node audits/quiz_stage01_navigation_browser.cjs
      - name: Commit only tested HTML and PWA hash to working branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(quiz): accept correct integer subquestions in grade-5 fractions"
            git push origin HEAD:fix/quiz-fractions-stage01-20261110
          fi
