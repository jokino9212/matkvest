name: Quiz stage01 fraction diagnosis
on:
  push:
    branches: [fix/quiz-fractions-stage01-20261110]
    paths:
      - audits/quiz_stage01_probe.py
      - .github/workflows/quiz-stage01-fraction-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Examine real production quiz handlers
        run: python3 audits/quiz_stage01_probe.py
