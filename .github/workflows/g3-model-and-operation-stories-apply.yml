          - return g3ChoiceQuestion(`${m.text}<br><b>Какое выражение соответствует задаче?</b>`,op,[{key:"add",label:`${m.a} + ${m.b}`},{key:"sub",label:`${m.a} − ${m.b}`},{key:"mul",label:`${m.a} · ${m.b}`},{key:"div",label:`${m.a} : ${m.b}`}],`По смыслу задачи подходит действие <b>${sym}</b>. Правильное выражение: <b>${correct}</b>.`,`g3:task_model:${d}:expr:${op}:${m.a}:${m.b}`,{variant:"expression",...m});
