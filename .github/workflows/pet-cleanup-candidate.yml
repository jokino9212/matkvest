name: Pet cleanup isolated archive candidate
on:
  push:
    branches: [refactor/pet-cleanup-ad61b3f3]
    paths:
      - audits/pet_cleanup_archive_candidate.mjs
      - .github/workflows/pet-cleanup-candidate.yml
permissions:
  contents: read
jobs:
  archive-candidate:
    if: github.repository == 'jokino9212/matkvest' && github.ref == 'refs/heads/refactor/pet-cleanup-ad61b3f3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply guarded small patch in isolated checkout
        run: |
          node audits/pet_cleanup_archive_candidate.mjs
          node audits/pet_cleanup_archive_candidate.mjs --apply
          python3 audits/g7_stage12_sync_pwa.py
          python3 audits/g7_stage12_sync_pwa.py --check
          git diff --check
      - name: Browser dependencies
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify PWA and prior sale behavior
        run: |
          node audits/stage28_offline_pwa_browser.cjs
          sed 's/v287/v290/g;s/V287/V290/g' audits/legacy_sale_v287_browser.cjs > audits/pet_cleanup_sale_regression.cjs
          node audits/pet_cleanup_sale_regression.cjs
      - name: Retain candidate for inspection only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-candidate-not-for-deploy
          path: |
            index.html
            sw.js
