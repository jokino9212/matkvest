name: UX-12 v208 release verification
on:
  push:
    branches: [verify/ux12-v208]
    paths: [.github/workflows/ux12-v208.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply release patch
        run: |
          git checkout --detach e20e989f835d76f30d55ca2bf4ccc433da2de683
          base64 -d <<'PATCH' | gzip -d | git apply --unidiff-zero
          
          PATCH
          git diff --check
          python3 audits/g7_stage12_sync_pwa.py --check
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node audits/ux12_version_footer_browser.cjs
      - run: node audits/stage24_attempt_lifecycle_browser.cjs
      - run: node audits/stage28_offline_pwa_browser.cjs
      - run: node audits/pwa_verified_refresh_browser.cjs
      - run: node audits/avatars_v207_browser.cjs
      - name: Save verified release commit
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add index.html sw.js audits/ux12_version_footer_browser.cjs audits/pwa_verified_refresh_browser.cjs
          git commit -m 'Keep the build control clear of learning content'
          git push origin HEAD:refs/heads/audit/ux12-v208-release
