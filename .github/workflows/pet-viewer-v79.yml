name: Fix pet viewer v79 and verify zoom
on:
  push:
    branches:
      - fix/pet-viewer-large-no-duplicate-20261107
    paths:
      - .github/workflows/pet-viewer-v79.yml
      - audits/fix_pet_viewer_v79.py
      - audits/pet_viewer_v79_browser.cjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply surgical repair to HTML and PWA manifest hash
        run: python3 audits/fix_pet_viewer_v79.py
      - name: Verify browser zoom on mobile and desktop
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          node audits/pet_viewer_v79_browser.cjs
      - name: Commit verified files to repair branch
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(pets): deployable v79 pet viewer [skip ci]"
          git push origin HEAD:fix/pet-viewer-large-no-duplicate-20261107
