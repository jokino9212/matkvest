name: MatKvest stage18 - grade5-6 generator audit
on:
  push:
    branches: [audit/g5g6-stage18-20261105]
    paths:
      - .github/workflows/g5g6_stage18_quality_audit.yml
      - audits/g5g6_stage18_quality_inventory.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generator-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g5g6-stage18-20261105
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium harness
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Inventory grade5-6 generators in browser
        run: node audits/g5g6_stage18_quality_inventory.mjs
      - name: Publish isolated audit evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-stage18-grade56-generator-inventory
          path: audits/g5g6_stage18_quality_inventory.json
          if-no-files-found: warn
      - name: Save inventory without touching release or main
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/g5g6_stage18_quality_inventory.json
          git diff --cached --quiet || (git commit -m "audit(stage18): capture grade5-6 generator contracts" && git pull --rebase origin audit/g5g6-stage18-20261105 && git push origin HEAD:audit/g5g6-stage18-20261105)
