name: MatKvest stage17D - quality batch1 source discovery
on:
  push:
    branches: [audit/g3g4-stage17-20261104]
    paths:
      - audits/g3g4_stage17_phaseD_quality_batch1_source.py
      - .github/workflows/g3g4_stage17_phaseD_quality_batch1_source.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-stage17D-quality-batch1-discovery
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g3g4-stage17-20261104
          persist-credentials: true
      - name: Verify expected candidate and PWA
        run: |
          echo 'fa4db04c3a53351ed672b12daa577a2ea3bb1376932f13b821e50db95436cd9a  index.html' | sha256sum --check
          python3 audits/g7_stage12_sync_pwa.py --check
      - name: Read exact source for first three topics
        run: python3 audits/g3g4_stage17_phaseD_quality_batch1_source.py
      - name: Upload contexts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-stage17D-quality-batch1-source
          path: audits/g3g4_stage17_phaseD_quality_batch1_source.json
          if-no-files-found: warn
      - name: Save read-only findings on audit branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/g3g4_stage17_phaseD_quality_batch1_source.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(stage17D): preserve source evidence for batch1 [skip ci]"
            git pull --rebase origin audit/g3g4-stage17-20261104
            git push origin HEAD:audit/g3g4-stage17-20261104
          fi
