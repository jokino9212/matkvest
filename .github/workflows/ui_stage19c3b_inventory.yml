name: MatKvest UI19C3B - results, resume, collection and chest inventory
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19c3b_inventory.yml
      - audits/ui_stage19c3b_inventory.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Inspect quiz results and remaining modal screens in isolated Chrome
        run: node audits/ui_stage19c3b_inventory.mjs
      - name: Export compact evidence and screenshots
        if: success()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const d=JSON.parse(fs.readFileSync("audits/ui_stage19c3b_inventory.json","utf8"));
            const brief={version:d.version,events:d.events,errors:d.errors,scenes:d.scenes.map(x=>({name:x.name,width:x.width,modalText:x.data.modalText,roots:x.data.roots,panels:x.data.panels,controls:x.data.controls,html:x.data.html}))};
            fs.writeFileSync("audits/ui_stage19c3b_inventory_brief.json",JSON.stringify(brief,null,2)+"\n");
          '
          for name in quiz_result_1280 quiz_result_390 resume_reload_390 collection_1280 collection_390 chests_1280 chests_390 shop_help_1280; do
            base64 -w0 "audits/ui19c3b_before_${name}.png" > "audits/ui19c3b_review_${name}.b64.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matkvest-ui19c3b-v60-results-collection-baseline
          path: |
            audits/ui_stage19c3b_inventory.json
            audits/ui19c3b_before_*.png
          if-no-files-found: warn
      - name: Preserve focused baseline evidence in audit branch
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/ui_stage19c3b_inventory_brief.json audits/ui19c3b_review_*.b64.txt
          git diff --cached --quiet || git commit -m "audit(ui19C3B): inventory quiz result, resume, collection and chest UI"
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
