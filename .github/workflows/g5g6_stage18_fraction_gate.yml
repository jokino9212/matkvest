name: MatKvest stage18 - fractions UI grade5-6 gate
on:
  push:
    branches: [audit/g5g6-stage18-20261105]
    paths:
      - .github/workflows/g5g6_stage18_fraction_gate.yml
      - audits/g5g6_stage18_fraction_patch.py
      - audits/g5g6_stage18_fraction_test.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-stage18-fractions-visual
  cancel-in-progress: false
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g5g6-stage18-20261105
          persist-credentials: true
      - name: Assert release v50 source
        run: |
          echo '0b64dc42f34e375fedce727720bb6475fcca63b2429c0d9fa8fd6539012e761d  index.html' | sha256sum --check
      - name: Apply visual fraction patch to isolated audit checkout
        run: |
          python3 audits/g5g6_stage18_fraction_patch.py
          grep -F 'matkvest-iphone-v51' sw.js
          test "$(grep -c 'stage18UsesFractionBoxes' index.html)" -ge 5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Test fraction fields, keyboard, fractions/mixed and grade isolation
        run: node audits/g5g6_stage18_fraction_test.mjs
      - name: Upload reports on pass or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage18-fractions-visual-gate
          path: |
            audits/g5g6_stage18_fraction_patch_report.json
            audits/g5g6_stage18_fraction_test_report.json
          if-no-files-found: warn
      - name: Persist verified patch, never touch main
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js audits/g5g6_stage18_fraction_patch_report.json audits/g5g6_stage18_fraction_test_report.json
          git commit -m "feat(stage18): grade5-6 fraction and mixed number answer boxes v51"
          git pull --rebase origin audit/g5g6-stage18-20261105
          git push origin HEAD:audit/g5g6-stage18-20261105
