name: Grade 8 live v195 verification
on:
  push:
    branches: [review/g8-warmup-training]
    paths:
      - .github/workflows/g8-v195-live-review-once.yml
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8195decaa2eb8bd57c192a5dab9413dcb19e8082
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Wait for published v195 and compare the deployed files
        run: |
          site=https://jokino9212.github.io/matkvest
          for attempt in $(seq 1 36); do
            if curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' "$site/sw.js?deploy-check=$GITHUB_RUN_ID-$attempt" -o /tmp/live-v195-sw.js &&
              cmp -s sw.js /tmp/live-v195-sw.js; then
              break
            fi
            sleep 6
          done
          cmp sw.js /tmp/live-v195-sw.js
          for artifact in index.html g8-textbook.js; do
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$site/$artifact?deploy-check=$GITHUB_RUN_ID" -o "/tmp/live-v195-$artifact"
            cmp "$artifact" "/tmp/live-v195-$artifact"
          done
          sha256sum /tmp/live-v195-*
      - name: Verify the real site, Grade 8 catalogue, and normal reloads in Chromium
        run: |
          node <<'JS'
          'use strict';
          const assert = require('node:assert/strict');
          const { readFileSync } = require('node:fs');
          const { createHash } = require('node:crypto');
          const { chromium } = require('playwright');
          
          const base = 'https://jokino9212.github.io/matkvest/';
          const release = {
            html: createHash('sha256').update(readFileSync('index.html')).digest('hex'),
            script: createHash('sha256').update(readFileSync('g8-textbook.js')).digest('hex')
          };
          const expectedParagraphs = [[1, 51], [46, 83], [32, 58]].map(([first, last]) =>
            Array.from({ length: last - first + 1 }, (_, index) => first + index));
          const menuSelector = '#mk-g8-textbook-nav';
          
          async function checkGrade(page) {
            await page.locator(menuSelector).waitFor({ state: 'visible' });
            const state = await page.evaluate(async ({ release, menuSelector }) => {
              const menu = document.querySelector(menuSelector);
              const paragraphs = [...menu.querySelectorAll('.mk-g5-toc-part')].map(part =>
                [...part.querySelectorAll('[data-paragraph]')].map(item => Number(item.dataset.paragraph)));
              const cache = await caches.has('matkvest-iphone-v195')
                ? await caches.open('matkvest-iphone-v195')
                : null;
              const key = new URL('__matkvest_snapshot__/' + release.html + '/index.html', location.href);
              const html = await cache?.match(key);
              const script = await fetch('g8-textbook.js?v=195');
              async function fingerprint(response) {
                if (!response?.ok) return null;
                const hash = await crypto.subtle.digest('SHA-256', await response.arrayBuffer());
                return [...new Uint8Array(hash)].map(byte => byte.toString(16).padStart(2, '0')).join('');
              }
              return {
                version: document.querySelector('#appVersionBadge')?.textContent,
                grade: currentGrade,
                topics: g8AllTopics().length,
                paragraphs,
                catalogIssues: g8CatalogAudit().issues,
                controller: !!navigator.serviceWorker.controller,
                htmlHash: await fingerprint(html),
                scriptHash: await fingerprint(script)
              };
            }, { release, menuSelector });
            assert.equal(state.version, 'Сборка v195');
            assert.equal(state.grade, 8);
            assert.equal(state.topics, 137);
            assert.deepEqual(state.paragraphs, expectedParagraphs);
            assert.deepEqual(state.catalogIssues, []);
            assert.equal(state.controller, true);
            assert.equal(state.htmlHash, release.html);
            assert.equal(state.scriptHash, release.script);
            return { grade: state.grade, topics: state.topics, paragraphs: state.paragraphs.flat().length };
          }
          
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const width of [320, 390, 1280]) {
                const mobile = width < 500;
                const context = await browser.newContext({ viewport: { width, height: 850 }, isMobile: mobile, hasTouch: mobile });
                try {
                  const page = await context.newPage();
                  const errors = [];
                  page.on('pageerror', error => errors.push(error.message));
                  await page.goto(base, { waitUntil: 'domcontentloaded' });
                  await page.waitForFunction(() => document.querySelector('#appVersionBadge')?.textContent === 'Сборка v195');
                  await page.waitForFunction(() => !!navigator.serviceWorker.controller);
                  await page.locator('button[onclick="openGrade(8)"]').click();
                  const initial = await checkGrade(page);
                  for (let i = 0; i < 3; i++) {
                    await page.reload({ waitUntil: 'domcontentloaded' });
                    assert.deepEqual(await checkGrade(page), initial);
                  }
                  await page.locator('main input[type=search]:visible').fill('геометрия 79');
                  const topic = page.locator(menuSelector + ' [data-topic-id="g8:arc_degree_measure"]:visible');
                  await topic.click();
                  const stages = page.locator('#modal .stage-card');
                  await stages.first().waitFor({ state: 'visible' });
                  assert.equal(await stages.count(), 3);
                  await page.reload({ waitUntil: 'domcontentloaded' });
                  await stages.first().waitFor({ state: 'visible' });
                  assert.equal(await stages.count(), 3);
                  const restored = await page.evaluate(() => {
                    const marker = document.querySelector('#appVersionBadge');
                    return { version: marker?.textContent, grade: currentGrade, route: history.state?.route?.topicId };
                  });
                  assert.deepEqual(restored, { version: 'Сборка v195', grade: 8, route: 'g8:arc_degree_measure' });
                  assert.deepEqual(errors, []);
                  console.log(JSON.stringify({ width, version: 195, ...initial, tableOfContentsReloads: 3, topicReloads: 1, topic: 'arc_degree_measure', verifiedHtmlAndScript: true }));
                } finally {
                  await context.close();
                }
              }
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          JS
