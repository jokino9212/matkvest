name: MatKvest UI19I - exact v68 residual UX baseline
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - audits/ui_stage19i_probe.mjs
      - .github/workflows/ui_stage19i_probe.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-ui19i-probe-v68
  cancel-in-progress: false
jobs:
  residual-ux-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Probe real Chromium at 320 390 768 1280 px
        run: node audits/ui_stage19i_probe.mjs
      - name: Archive audit JSON and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-ui19i-v68-baseline
          path: |
            audits/ui_stage19i_baseline.json
            audits/ui19i_*.png
          if-no-files-found: warn
      - name: Save diagnostic summary to audit branch
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/ui_stage19i_baseline.json
          git diff --cached --quiet || git commit -m "test(ui19I): record v68 Chromium residual UX baseline"
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
