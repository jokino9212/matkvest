name: One-time Grade 5 paragraph 33 v169 PWA activation
on:
  push:
    branches:
      - audit/g5-paragraph33-20261115
    paths:
      - '.github/workflows/g5-v169-one-time.yml'
permissions:
  contents: write
jobs:
  apply-v169:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh all 19 Grade 5 assets and PWA worker
        run: |
          python3 audits/g5_v169_activate.py
          python3 audits/g5_v169_activate.py --check
          grep -q 'const CACHE_NAME = "matkvest-iphone-v169";' sw.js
          if grep -q -E 'src="g5-[^"]+\?v=168"' index.html; then
            echo "Stale Grade 5 v168 asset URL" >&2
            exit 1
          fi
      - name: Commit verified v169 fingerprints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo 'v169 already active'
          else
            git commit -m 'Release v169: equal fractions and fresh PWA assets'
            git push origin HEAD:audit/g5-paragraph33-20261115
          fi
