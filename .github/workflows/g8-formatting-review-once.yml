name: Grade 8 formatting verification
on:
  push:
    branches: [review/g8-warmup-training]
    paths:
      - .github/workflows/g8-formatting-review-once.yml
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: MATKVEST_G8_SHAPE_ONLY=1 node audits/g8_textbook_browser.cjs
