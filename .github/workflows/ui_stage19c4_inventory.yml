name: MatKvest UI19C4 - eight-grade responsive screen inventory
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19c4_inventory.yml
      - audits/ui_stage19c4_inventory.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Inspect 8 grades and lessons at 5 widths
        run: node audits/ui_stage19c4_inventory.mjs
      - name: Save summarized DOM and representative screenshot evidence
        if: success()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const d=JSON.parse(fs.readFileSync("audits/ui_stage19c4_inventory.json","utf8"));
            const x={version:d.version,widths:d.testedWidths,errors:d.errors,anomalies:d.anomalies,
             screens:d.screens.map(s=>({kind:s.kind,width:s.width,grade:s.grade,viewport:s.data.viewport,scrollWidth:s.data.scrollWidth,top:s.data.top,frame:s.data.frame,topics:s.data.topicCount,first:s.data.firstTopic,header:s.data.modalHeader,stages:s.data.stageCount,targets:s.data.targetCount,small:s.data.smallTargets,offscreen:s.data.offscreen.slice(0,4),oversized:s.data.oversized.slice(0,4),heading:s.data.heading.slice(0,4)}))};
            fs.writeFileSync("audits/ui_stage19c4_inventory_brief.json",JSON.stringify(x,null,2)+"\n");
          '
          for name in grade1_390 grade4_390 grade7_390 grade8_390 modal1_390 modal7_390 modal8_390 grade7_1280 grade8_1280; do
            base64 -w0 "audits/ui19c4_baseline_${name}.png" > "audits/ui19c4_review_${name}.b64.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matkvest-ui19c4-v61-full-eight-grade-inventory
          path: |
            audits/ui_stage19c4_inventory.json
            audits/ui19c4_baseline_*.png
          if-no-files-found: warn
      - name: Save compact baseline and screenshots to audit branch
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/ui_stage19c4_inventory_brief.json audits/ui19c4_review_*.b64.txt
          git diff --cached --quiet || git commit -m "audit(ui19C4): responsive eight-grade and lesson screenshots"
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
