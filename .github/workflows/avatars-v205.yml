name: Verify new avatar collection v205
on:
  push:
    branches: [verify/avatars-v205]
    paths: [.github/workflows/avatars-v205.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify catalog, purchase, collection, and offline art
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout --detach 86790f6ec38b25d395e6ae0b27865f9220620a9d
          base64 -d <<'PATCH' | gzip -d | git apply --unidiff-zero
          
          PATCH
          git diff --check
          python3 audits/g7_stage12_sync_pwa.py --check
          npm install --no-save --no-package-lock playwright@1.56.1
          node audits/avatars_v205_browser.cjs
          node audits/shop_progress_v874_browser_test.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js audits/avatars_v205_browser.cjs audits/UX_UI_FINAL_STATUS.md
          git commit -m 'Offer 30 avatars with options for starting levels'
          git push origin HEAD:refs/heads/audit/avatars-v205
