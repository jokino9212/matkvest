name: MatKvest stage17D - quality batch4 source discovery
on:
  push:
    branches: [audit/g3g4-stage17-20261104]
    paths:
      - audits/g3g4_stage17_phaseD_quality_batch4_source.py
      - .github/workflows/g3g4_stage17_phaseD_quality_batch4_source.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-stage17D-quality-batch4-source
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g3g4-stage17-20261104
          persist-credentials: true
      - name: Verify v46 source and service worker
        run: |
          echo '4a9a597d34dfe8f7f48abb323e99784f7f0b529ceb5275b2bc1b94d64fe0bd7c  index.html' | sha256sum --check
          python3 audits/g7_stage12_sync_pwa.py --check
      - name: Extract source for batch4
        run: python3 audits/g3g4_stage17_phaseD_quality_batch4_source.py
      - name: Upload contexts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-stage17D-quality-batch4-source
          path: audits/g3g4_stage17_phaseD_quality_batch4_source.json
          if-no-files-found: warn
      - name: Save read-only evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/g3g4_stage17_phaseD_quality_batch4_source.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(stage17D): preserve G3 compare mass money source evidence [skip ci]"
            git pull --rebase origin audit/g3g4-stage17-20261104
            git push origin HEAD:audit/g3g4-stage17-20261104
          fi
