name: Grade 7 textbook and navigation
on:
  pull_request:
    branches: [main]
    paths:
      - 'g7-textbook.js'
      - 'g5-textbook-navigation-v121.js'
      - 'index.html'
      - 'sw.js'
      - 'audits/g7_textbook_*.cjs'
      - '.github/workflows/g7-textbook.yml'
permissions:
  contents: read
jobs:
  textbook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Check out the published v191 baseline
        uses: actions/checkout@v4
        with:
          ref: 83c8361f793557d95c275bb8b569f180f977a7b1
          path: v191-baseline
      - run: python3 audits/g7_stage12_sync_pwa.py --check
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node audits/g7_textbook_navigation.cjs
      - run: node audits/g7_textbook_sessions.cjs
      - run: node audits/g6_textbook_navigation_browser.cjs
      - run: node audits/g7_textbook_upgrade.cjs v191-baseline
