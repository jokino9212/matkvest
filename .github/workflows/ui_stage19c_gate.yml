name: MatKvest UI stage19C - design system and regression gate
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19c_gate.yml
      - audits/ui_stage19c_patch.py
      - audits/ui_stage19c_test.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-ui19c-v58
  cancel-in-progress: false
jobs:
  visual-system-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          fetch-depth: 0
          persist-credentials: true
      - name: Apply v58 only on the verified v57 checkpoint
        run: python3 audits/ui_stage19c_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Test design tokens, full keyboard navigation, grade layouts, Chrome screenshots
        run: node audits/ui_stage19c_test.mjs
      - name: Regress clickable class and quick-trainer cards from 19A
        run: |
          sed 's/matkvest-iphone-v56/matkvest-iphone-v58/g' audits/ui_stage19a_test.mjs > audits/_ui19c_regress_a.mjs
          node audits/_ui19c_regress_a.mjs
          rm audits/_ui19c_regress_a.mjs
      - name: Regress compact navigation from 19B
        run: |
          sed 's/matkvest-iphone-v57/matkvest-iphone-v58/g' audits/ui_stage19b_test.mjs > audits/_ui19c_regress_b.mjs
          node audits/_ui19c_regress_b.mjs
          rm audits/_ui19c_regress_b.mjs
      - name: Regression for grades 1,2,3,5,6,8 generators
        run: |
          SHA="$(sha256sum index.html | cut -d' ' -f1)"
          sed "s/f188d39a3a16fc54dfb32238fc34d3dfe6cc3c4416cd475579bf3ed65a7e1e36/$SHA/g" audits/g7_stage14_crossgrade_test.mjs > audits/_ui19c_crossgrade.mjs
          node audits/_ui19c_crossgrade.mjs
          rm audits/_ui19c_crossgrade.mjs
      - name: Regression for grade 4 input and handwritten math
        run: |
          SHA="$(sha256sum index.html | cut -d' ' -f1)"
          sed "s/f188d39a3a16fc54dfb32238fc34d3dfe6cc3c4416cd475579bf3ed65a7e1e36/$SHA/g" audits/g7_stage14_grade4_test.mjs > audits/_ui19c_grade4.mjs
          node audits/_ui19c_grade4.mjs
          rm audits/_ui19c_grade4.mjs
      - name: Verify service worker and content fingerprint
        run: python3 audits/g7_stage12_sync_pwa.py --check
      - name: Upload diagnostic results and screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-ui19c-v58-design-system-gate
          path: |
            audits/ui_stage19c_patch_report.json
            audits/ui_stage19c_test_report.json
            audits/ui19c_after_*.png
          if-no-files-found: warn
      - name: Commit only fully tested v58 to audit branch
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js audits/ui_stage19c_patch_report.json audits/ui_stage19c_test_report.json
          git diff --cached --quiet || git commit -m "feat(ui19C): apply unified visual system and topic keyboard navigation v58"
          for file in audits/ui_stage19a_test_report.json audits/ui_stage19b_test_report.json audits/g7_stage14_crossgrade_report.json audits/g7_stage14_grade4_report.json; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then git restore -- "$file"; else rm -f "$file"; fi
          done
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
