name: Grade 5 six textbook topics - all three cognitive tiers v124
on:
  push:
    branches: [fix/g5-all-three-stages-v124-20261113]
    paths:
      - g5-textbook-tiers-v124.js
      - audits/g5_v124_activate.py
      - audits/g5_v124_real_lesson_oracle_browser.cjs
      - .github/workflows/g5-v124-all-levels.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  real-lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Activate and synchronize v124 PWA
        run: python3 audits/g5_v124_activate.py
      - name: Syntax and payload integrity
        run: |
          node --check g5-textbook-tiers-v124.js
          node --check audits/g5_v124_real_lesson_oracle_browser.cjs
          python3 -m py_compile audits/g5_v124_activate.py
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify all learner-facing question types and symbolic math
        run: node audits/g5_v124_real_lesson_oracle_browser.cjs
      - name: Preserve fraction input behavior
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
      - name: Commit tested HTML and worker
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(g5): activate real tiered 6-topic exercises v124"
            git fetch origin fix/g5-all-three-stages-v124-20261113
            git rebase origin/fix/g5-all-three-stages-v124-20261113
            git push origin HEAD:fix/g5-all-three-stages-v124-20261113
          fi
