name: UX-104 pet-vs-avatar duplicate baseline (read-only)
on:
  push:
    branches: [ux-final/ux00-inventory-20261108]
    paths:
      - '.github/workflows/ux104-duplicate-preflight.yml'
      - 'audits/ux104_duplicate_baseline_browser.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-baseline:
    name: Ten original pet/avatar pairs, live IDs, prices and 10-up artwork sheet
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Confirm source is premium staging v102
        run: grep -q 'matkvest-iphone-v102' sw.js
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Match all ten pet/avatar source hashes and render mobile-friendly gallery
        run: timeout 150s node audits/ux104_duplicate_baseline_browser.cjs
      - name: Check no regression in existing premium pet view and store
        run: timeout 160s node audits/ux103r_premium_v102_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux104-ten-duplicate-pairs-baseline
          path: audits/ux104_preflight_output/
          retention-days: 60
