name: Grade 5-6 textbook catalog coverage read-only inventory
on:
  push:
    branches: [audit/g5-g6-textbook-coverage-20261112]
    paths:
      - audits/g5_g6_textbook_coverage.cjs
      - .github/workflows/g5-g6-textbook-coverage.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Enumerate grade 5 and grade 6 real catalog and search title matches
        run: node audits/g5_g6_textbook_coverage.cjs
      - name: Inspect source catalog and search anchors
        run: python3 audits/g5_g6_source_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-g6-textbook-catalog-inventory
          path: audits/out/g5_g6_textbook_coverage.json
          if-no-files-found: warn
