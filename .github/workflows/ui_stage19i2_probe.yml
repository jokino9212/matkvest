name: MatKvest UI19I phase2 - actual UX residual probe v69
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - audits/ui_stage19i2_probe.mjs
      - .github/workflows/ui_stage19i2_probe.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-ui19i2-v69-probe
  cancel-in-progress: false
jobs:
  chromium-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Audit focus, target dimensions and nested dialogs 320 to 1280px
        run: node audits/ui_stage19i2_probe.mjs
      - name: Save screenshot artifact even if findings fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-ui19i2-v69-evidence
          path: |
            audits/ui_stage19i2_probe_report.json
            audits/ui19i2_*.png
          if-no-files-found: warn
      - name: Commit diagnostic evidence to audit branch
        if: always()
        run: |
          set -eu
          test -f audits/ui_stage19i2_probe_report.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/ui_stage19i2_probe_report.json
          git diff --cached --quiet || git commit -m "test(ui19I/2): retain v69 residual UX evidence"
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
