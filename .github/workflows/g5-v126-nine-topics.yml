name: Grade 5 nine remaining natural and geometry topics - v126
on:
  push:
    branches: [fix/g5-remaining-natural-geometry-v126-20261113]
    paths:
      - g5-remaining-core-v126.js
      - audits/g5_v126_activate.py
      - audits/g5_v126_real_lesson_oracle_browser.cjs
      - .github/workflows/g5-v126-nine-topics.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  nine-core-topics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Activate v126 and sync worker
        run: python3 audits/g5_v126_activate.py
      - name: Syntax and integrity
        run: |
          node --check g5-remaining-core-v126.js
          node --check audits/g5_v126_real_lesson_oracle_browser.cjs
          python3 -m py_compile audits/g5_v126_activate.py
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Validate live three-stage lessons using independent arithmetic oracle
        run: node audits/g5_v126_real_lesson_oracle_browser.cjs
      - name: Protect fraction and mixed-number conversions
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
      - name: Commit tested HTML and worker only after PASS
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(g5): activate 135 new cognitive families v126"
            git fetch origin fix/g5-remaining-natural-geometry-v126-20261113
            git rebase origin/fix/g5-remaining-natural-geometry-v126-20261113
            git push origin HEAD:fix/g5-remaining-natural-geometry-v126-20261113
          fi
