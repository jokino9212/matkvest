name: MatKvest stage17D - quality batch3 source inspection
on:
  push:
    branches: [audit/g3g4-stage17-20261104]
    paths:
      - audits/g3g4_stage17_phaseD_quality_batch3_source.py
      - .github/workflows/g3g4_stage17_phaseD_quality_batch3_source.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-stage17D-quality-batch3-source
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g3g4-stage17-20261104
          persist-credentials: true
      - name: Guard v45 HTML and PWA
        run: |
          echo 'fa3810ac65800b14dfaf5b041598c1a3c21a93e92c71fccc9b00899b3dabf741  index.html' | sha256sum --check
          python3 audits/g7_stage12_sync_pwa.py --check
      - name: Capture read-only source
        run: python3 audits/g3g4_stage17_phaseD_quality_batch3_source.py
      - name: Upload contexts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-stage17D-quality-batch3-source
          path: audits/g3g4_stage17_phaseD_quality_batch3_source.json
          if-no-files-found: warn
      - name: Save evidence in working branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/g3g4_stage17_phaseD_quality_batch3_source.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(stage17D): save generator evidence batch3 [skip ci]"
            git pull --rebase origin audit/g3g4-stage17-20261104
            git push origin HEAD:audit/g3g4-stage17-20261104
          fi
