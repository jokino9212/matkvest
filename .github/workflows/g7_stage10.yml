name: G7 stage 10 - answer semantics and SVG probe
on:
  push:
    branches:
      - audit/g7-stage10-20261104
    paths:
      - .github/workflows/g7_stage10.yml
      - audits/g7_stage10_probe.mjs
      - audits/g7_stage10_input_probe.mjs
      - audits/g7_stage10_deep_test.mjs
      - audits/g7_stage10_input_test.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Run stage 10 probe
        run: node audits/g7_stage10_probe.mjs
      - name: Probe typed answer inputs
        run: node audits/g7_stage10_input_probe.mjs
      - name: Run deep math and UI tests
        if: hashFiles('audits/g7_stage10_deep_test.mjs') != ''
        run: node audits/g7_stage10_deep_test.mjs
      - name: Test correct and incorrect typed answers
        run: node audits/g7_stage10_input_test.mjs
      - name: Upload full diagnostic reports even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g7-stage10-diagnostics
          path: |
            audits/g7_stage10_probe.json
            audits/g7_stage10_input_probe.json
            audits/g7_stage10_deep_report.json
            audits/g7_stage10_input_report.json
          if-no-files-found: warn
          retention-days: 30
