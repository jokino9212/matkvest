name: Grade 5 paragraph 35 one-time PWA v171 activation
on:
  push:
    branches: [audit/g5-paragraph35-20261115]
    paths: ['.github/workflows/g5-v171-release-once.yml']
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g5-paragraph35-20261115
          persist-credentials: true
      - name: Update 19 script URLs, cache and HTML integrity hash
        run: |
          python3 audits/g5_v171_activate.py
          python3 audits/g5_v171_activate.py --check
          node --check g5-fraction-concepts-v129.js
      - name: Commit v171 stamp and remove self-trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git rm .github/workflows/g5-v171-release-once.yml
          git commit -m "release(g5): activate paragraph 35 PWA v171"
          git fetch origin audit/g5-paragraph35-20261115
          git rebase origin/audit/g5-paragraph35-20261115
          git push origin HEAD:audit/g5-paragraph35-20261115
