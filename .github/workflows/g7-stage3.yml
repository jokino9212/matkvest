name: Verify and apply Matkvest G7 Stage 3 (isolated branch)
on:
  push:
    branches:
      - audit/g7-geometry-stage2-2026-11-03
    paths:
      - .github/workflows/g7-stage3.yml
permissions:
  contents: write
jobs:
  validate_and_apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated G7 branch
        uses: actions/checkout@v4
        with:
          ref: audit/g7-geometry-stage2-2026-11-03
          persist-credentials: true
      - name: Validate patcher and test syntax
        run: |
          node --check tools/apply_g7_stage3.js
          node --check tools/test_g7_stage3.js
      - name: Exercise G7 algebra model invariants
        run: node tools/test_g7_stage3.js
      - name: Apply patch to existing stage-2 HTML (branch only)
        run: node tools/apply_g7_stage3.js
      - name: Verify generated HTML and restricted patch
        run: |
          git diff --check
          node -e 'const fs=require("fs");const s=fs.readFileSync("index.html","utf8");if(!s.includes("function g7AlgebraStage3")||!s.includes("function g7Stage2Patch"))process.exit(1);console.log("Both G7 stages present")'
      - name: Commit verified HTML only to isolated branch
        run: |
          git config user.name "matkvest-stage3-bot"
          git config user.email "matkvest-stage3-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Apply G7 algebra stage-3 variability patch"
          git push origin HEAD:audit/g7-geometry-stage2-2026-11-03
