name: Final frontend baseline import and recovery audit
on:
  push:
    branches: [refactor/route-vue-actions-from-7c14ce9]
    paths: ['.github/workflows/final-frontend-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'jokino9212/matkvest' && github.ref == 'refs/heads/refactor/route-vue-actions-from-7c14ce9'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read exact published baseline source
        run: python3 audits/final_frontend_source.py
      - run: npm ci && npm install --no-save --no-package-lock playwright@1.56.1
      - name: Reproduce import stale actions and delayed reads
        run: node audits/final_frontend_preflight.cjs
