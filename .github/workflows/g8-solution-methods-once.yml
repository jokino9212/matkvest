name: Grade 8 Solution Methods verification
on:
  push:
    branches: [review/g8-warmup-training]
    paths:
      - .github/workflows/g8-solution-methods-once.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [shape, warmup]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: MATKVEST_G8_SHAPE_ONLY=1 node audits/g8_textbook_browser.cjs
        if: matrix.check == 'shape'
      - run: MATKVEST_G8_WARMUP_ONLY=1 node audits/g8_textbook_browser.cjs
        if: matrix.check == 'warmup'
