name: MatKvest stage17B - grade 3-4 written arithmetic and alignment
on:
  push:
    branches: [audit/g3g4-stage17-20261104]
    paths:
      - audits/g3g4_stage17_phaseB_column.mjs
      - .github/workflows/g3g4_stage17_phaseB.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-stage17-g3g4-column
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g3g4-stage17-20261104
          persist-credentials: true
      - name: Verify stage17 candidate byte for byte
        run: |
          echo 'b953b710a471210fe0f8247b55e879cedf4d7e11c6f369d551040a9f5d46c7d3  index.html' | sha256sum --check
          python3 audits/g7_stage12_sync_pwa.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify grade 3-4 column arithmetic, long division and aligned digit columns at mobile width
        run: node audits/g3g4_stage17_phaseB_column.mjs
      - name: Preserve all evidence even if mathematical check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-stage17B-column-digits
          path: audits/g3g4_stage17_phaseB_column_report.json
          if-no-files-found: warn
          retention-days: 60
      - name: Record report in stage17 audit branch
        if: always()
        run: |
          if [ -f audits/g3g4_stage17_phaseB_column_report.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add audits/g3g4_stage17_phaseB_column_report.json
            if ! git diff --cached --quiet; then
              git commit -m "audit(stage17B): save independent arithmetic and digit alignment evidence [skip ci]"
              git push origin HEAD:audit/g3g4-stage17-20261104
            fi
          fi
