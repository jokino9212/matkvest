name: Isolated v302 integration diagnostic (not for deployment)
on:
  push:
    branches: [integration/backend95-pets-v302]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend95-pets-v302
  cancel-in-progress: true
jobs:
  backend-baseline:
    if: github.repository == 'jokino9212/matkvest' && github.ref == 'refs/heads/integration/backend95-pets-v302'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm ci && npm install --no-save --no-package-lock playwright@1.56.1
      - name: Test shared account state
        run: node audits/backend95_account_store.test.mjs
      - name: Economy controller lost receipt regression
        run: node audits/backend95_economy_operations.test.mjs
      - name: Build isolated Vue and SHA-fenced PWA
        run: |
          npm run build:knowledge-map
          mkdir ci-acceptance-output
          python3 audits/build_backend95_account.py ci-acceptance-output/backend95-site
          test -s ci-acceptance-output/backend95-site/index.html
          test -s ci-acceptance-output/backend95-site/sw.js
          test -s ci-acceptance-output/backend95-site/assets/ui/knowledge-map.js
      - name: Export economy policy from exact v290 frontend
        run: |
          node audits/export_economy_policy_v290.cjs ci-acceptance-output/economy_v290.json
          test -s ci-acceptance-output/economy_v290.json
      - uses: actions/upload-artifact@v4
        id: economy_artifact
        with:
          name: v302-baseline-v290-economy-policy
          path: ci-acceptance-output/economy_v290.json
          if-no-files-found: error
          retention-days: 7
      - name: Browser integration against synthetic same-origin API
        run: node audits/backend95_account_browser.cjs ci-acceptance-output/backend95-site
      - name: Isolated school block queue IndexedDB regression
        run: node audits/backend95_school_queue_browser.cjs
      - name: Check reproducible acceptance build
        run: |
          test "$(sha256sum ci-acceptance-output/backend95-site/index.html | cut -d ' ' -f 1)" = af4019ae4e4e96dcf9fcdf6e08a5ce609a0c1d61074c02b676e351d96b237929
          test "$(sha256sum ci-acceptance-output/economy_v290.json | cut -d ' ' -f 1)" = e12e0b972331ecf508f40a0e9a5b285d205807844222d2191260d91a88e54c43
      - uses: actions/upload-artifact@v4
        id: site_artifact
        with:
          name: v302-baseline-v300-site-not-for-deploy
          path: ci-acceptance-output/backend95-site/
          if-no-files-found: error
          retention-days: 7
      - name: Verify artifact receipts
        env:
          POLICY_ARTIFACT_ID: ${{ steps.economy_artifact.outputs.artifact-id }}
          SITE_ARTIFACT_ID: ${{ steps.site_artifact.outputs.artifact-id }}
        run: |
          test -n "$POLICY_ARTIFACT_ID"
          test -n "$SITE_ARTIFACT_ID"
          echo "PASS_ACCEPTANCE_ARTIFACTS policy=$POLICY_ARTIFACT_ID site=$SITE_ARTIFACT_ID"
  pet-regression:
    if: github.repository == 'jokino9212/matkvest' && github.ref == 'refs/heads/integration/backend95-pets-v302'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply guarded patch in isolated checkout
        run: |
          node audits/pet_cleanup_archive_candidate.mjs
          node audits/pet_cleanup_archive_candidate.mjs --apply
          python3 audits/g7_stage12_sync_pwa.py
          python3 audits/g7_stage12_sync_pwa.py --check
          git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" diff --check
      - name: Browser dependencies
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Pet history, purchase, selection, compensation, reward art
        run: node audits/pet_cleanup_regression.cjs
      - name: Existing Vue, fallback and school regression
        run: |
          for f in audits/legacy_navigation_core.test.cjs audits/legacy_*_v*.test.cjs audits/v288_store.test.cjs; do node "$f"; done
          python3 - <<'PY'
          from pathlib import Path
          names=['legacy_vue_actions_v271_browser.cjs','legacy_training_plan_v272_browser.cjs','legacy_school_actions_v273_browser.cjs','legacy_school_column_v274_browser.cjs','legacy_school_frame_journal_v275_browser.cjs','legacy_reports_teacher_v276_browser.cjs','legacy_analytics_view_v277_browser.cjs','legacy_profile_dialog_v278_browser.cjs','legacy_teacher_dashboard_v279_browser.cjs','legacy_teacher_escape_store_v280_browser.cjs','legacy_achievements_v281_browser.cjs','legacy_quest_back_v282_browser.cjs','legacy_leaderboard_v283_browser.cjs','legacy_help_v284_browser.cjs','legacy_artwork_v285_browser.cjs','legacy_sale_v286_browser.cjs','legacy_sale_v287_browser.cjs']
          for name in names:
              s=(Path('audits')/name).read_text()
              import re
              s=re.sub(r'(?<=[vV])(?:27[1-9]|28[0-9]|290)\b','301',s)
              (Path('audits')/('pet301_'+name)).write_text(s)
          PY
          for f in audits/pet301_*_browser.cjs; do node "$f"; done
          node audits/v288_browser.cjs
          node audits/v289_teacher_browser.cjs
      - name: Verify PWA offline and refresh
        run: |
          node audits/stage28_offline_pwa_browser.cjs
          node audits/pwa_verified_refresh_browser.cjs
          python3 audits/g7_stage12_sync_pwa.py --check
      - name: Retain tested files for inspection only
        uses: actions/upload-artifact@v4
        with:
          name: v302-pet-only-regression-not-for-deploy
          path: |
            index.html
            sw.js
          if-no-files-found: error
          retention-days: 7
  combined-diagnostic:
    if: github.repository == 'jokino9212/matkvest' && github.ref == 'refs/heads/integration/backend95-pets-v302'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm ci && npm install --no-save --no-package-lock playwright@1.56.1
      - name: Build Vue and prove original pinned policy
        run: |
          npm run build:knowledge-map
          mkdir ci-acceptance-output
          node audits/export_economy_policy_v290.cjs ci-acceptance-output/economy_v290.json
          test "$(sha256sum ci-acceptance-output/economy_v290.json | cut -d ' ' -f 1)" = e12e0b972331ecf508f40a0e9a5b285d205807844222d2191260d91a88e54c43
      - name: Apply guarded pet patch only in ephemeral checkout
        run: |
          node audits/pet_cleanup_archive_candidate.mjs
          node audits/pet_cleanup_archive_candidate.mjs --apply
          python3 audits/g7_stage12_sync_pwa.py
          python3 audits/g7_stage12_sync_pwa.py --check
          git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" diff --check
      - name: Export and compare proposed pet policy (not installed on server)
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('audits/export_economy_policy_v290.cjs')
          s=p.read_text()
          old='bec1537186acb23b7483d98f8fabf3b3870def64e255cfcec5208d659851ecce'
          assert s.count(old)==1
          p.write_text(s.replace(old,hashlib.sha256(Path('index.html').read_bytes()).hexdigest()))
          PY
          node audits/export_economy_policy_v290.cjs ci-acceptance-output/economy_v302_candidate.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('ci-acceptance-output')
          old=json.loads((root/'economy_v290.json').read_bytes())
          candidate=root/'economy_v302_candidate.json'
          new=json.loads(candidate.read_bytes())
          retired={'pet_robotx','pet_wisecat','pet_royal_dragon'}
          assert new['build']==hashlib.sha256(Path('index.html').read_bytes()).hexdigest()
          assert new['build']!=old['build']
          olditems={x['id']:x for x in old['items']}
          assert retired <= olditems.keys()
          assert all(olditems[i]['category']=='pets' for i in retired)
          assert retired <= {i for xs in old['pools'].values() for i in xs}
          old['build']=new['build']
          for item in old['items']:
              if item['id'] in retired:
                  item['buyable']=False
                  item['selectable']=False
          old['pools']={r:[i for i in ids if i not in retired] for r,ids in old['pools'].items()}
          assert old==new, 'Unexpected economy policy delta'
          print('PASS_EXACT_PET_POLICY_DELTA',hashlib.sha256(candidate.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v302-proposed-policy-not-for-deploy
          path: ci-acceptance-output/economy_v302_candidate.json
          if-no-files-found: error
          retention-days: 7
      - name: Build combined diagnostic with distinct cache namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('audits/build_backend95_account.py')
          s=p.read_text()
          old='bec1537186acb23b7483d98f8fabf3b3870def64e255cfcec5208d659851ecce'
          assert s.count(old)==1
          s=s.replace(old,hashlib.sha256(Path('index.html').read_bytes()).hexdigest())
          assert s.count('?v=290')==1
          s=s.replace('?v=290','?v=301').replace('?v=300','?v=302')
          assert s.count('matkvest-integration95-v290')==1
          s=s.replace('matkvest-integration95-v290','matkvest-integration95-v301').replace('matkvest-integration95-v300','matkvest-integration95-v302')
          p.write_text(s)
          PY
          python3 audits/build_backend95_account.py ci-acceptance-output/combined
          grep -q 'matkvest-integration95-v302' ci-acceptance-output/combined/sw.js
      - name: Synthetic integration diagnostic only (old server policy)
        run: |
          node audits/backend95_account_browser.cjs ci-acceptance-output/combined
          node audits/backend95_school_queue_browser.cjs
      - name: Release guard
        run: |
          echo "::warning::Diagnostic uses old v290 server policy; no combined release artifact, real server or PostgreSQL acceptance. Migration required."
