name: Build and test Grade 5 refresh fix
on:
  push:
    branches: [fix/g5-render-on-refresh-20261115]
permissions:
  contents: write
concurrency:
  group: grade5-refresh-fix-build
jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Apply the tested candidate patch
        env:
          G5_REFRESH_PATCH: ''
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          printf '%s' "$G5_REFRESH_PATCH" | base64 -d | gzip -dc | git apply --index
          git diff --cached --check
          python3 audits/g7_stage12_sync_pwa.py --check
          node --check sw.js
          node --check audits/pwa_v158_grade5_production_browser.cjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify the rendered catalog without reopening Grade 5 after refresh
        run: node audits/pwa_verified_refresh_browser.cjs
      - name: Verify offline play
        run: node audits/stage28_offline_pwa_browser.cjs
      - name: Commit validated files to the fix branch and remove this build workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/g5-render-refresh-build.yml
          git commit -m "Fix Grade 5 catalog and topic restoration after F5"
          git push origin HEAD:refs/heads/fix/g5-render-on-refresh-20261115
