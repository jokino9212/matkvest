name: MatKvest stage18B - exact fractions and powers gate
on:
  push:
    branches: [audit/g5g6-stage18-20261105]
    paths:
      - .github/workflows/g5g6_stage18_semantics_gate.yml
      - audits/g5g6_stage18_semantics_patch.py
      - audits/g5g6_stage18_semantics_test.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-stage18b-semantic-gate
  cancel-in-progress: false
jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g5g6-stage18-20261105
          persist-credentials: true
      - name: Patch semantics from grade5-6 v51 to v52
        run: |
          python3 audits/g5g6_stage18_semantics_patch.py
          test "$(grep -c 'matkvest-iphone-v52' sw.js)" -eq 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test harness
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Regress original grade5-6 fraction cells
        run: |
          sed "s/matkvest-iphone-v51/matkvest-iphone-v52/g" audits/g5g6_stage18_fraction_test.mjs > audits/_stage18b_regression.mjs
          node audits/_stage18b_regression.mjs
          rm audits/_stage18b_regression.mjs
      - name: Test exact fractions, mixed numbers and powers variety
        run: node audits/g5g6_stage18_semantics_test.mjs
      - name: Archive test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-stage18b-fractions-powers-evidence
          path: |
            audits/g5g6_stage18_semantics_patch_report.json
            audits/g5g6_stage18_semantics_test_report.json
            audits/g5g6_stage18_fraction_test_report.json
          if-no-files-found: warn
      - name: Commit only after both checks pass - never to main
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js audits/g5g6_stage18_semantics_patch_report.json audits/g5g6_stage18_semantics_test_report.json audits/g5g6_stage18_fraction_test_report.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(stage18B): explicit fraction answers and grade5 powers variety v52"
            git pull --rebase origin audit/g5g6-stage18-20261105
            git push origin HEAD:audit/g5g6-stage18-20261105
          fi
