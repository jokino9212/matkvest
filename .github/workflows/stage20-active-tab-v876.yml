name: Stage20 fix mobile collection tab v8.76
on:
  push:
    branches: [audit/mobile-overlays-stage20-20261106]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/mobile-overlays-stage20-20261106
          persist-credentials: true
      - name: Apply UI patch
        run: |
          if ! grep -q 'id="mk-v876-active-shop-tab"' index.html; then
            python3 audits/stage20_fix_shop_active_tab_v876.py
          fi
      - name: Verify PWA version and checksum
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          h=Path('index.html').read_bytes()
          sw=Path('sw.js').read_text()
          assert b'8.76' in h and b'8.75' not in h
          assert h.count(b'id="mk-v876-active-shop-tab"')==1
          assert 'matkvest-iphone-v76' in sw
          assert hashlib.sha256(h).hexdigest() in sw
          print('PASS v8.76 release fingerprint')
          PY
      - name: Install browser
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Mobile overlays and selected category visibility
        run: node audits/stage20_mobile_overlays_browser.cjs
      - name: Existing regression gates
        run: |
          node audits/ui875_card_nav_browser_audit.cjs
          node audits/shop_progress_v874_browser_test.cjs
          node audits/responsive_fraction_v874_test.cjs
          node audits/mobile_division_v72_real_app_test.cjs
      - name: Commit verified bundle
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(frontend): v8.76 scroll active collection tab into view"
            git push origin HEAD:audit/mobile-overlays-stage20-20261106
          fi
