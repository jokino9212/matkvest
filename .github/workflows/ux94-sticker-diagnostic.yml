name: UX-94 real sticker responsive diagnosis
on:
  push:
    branches: [ux-final/ux00-inventory-20261108]
    paths: ['.github/workflows/ux94-sticker-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: timeout 120s node audits/ux94_sticker_real_browser_probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux94-sticker-real-screenshots
          path: audits/ux94_sticker_diagnostic_output/
          retention-days: 60
