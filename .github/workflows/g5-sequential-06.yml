name: Grade 5 sequential textbook audit §6 natural number comparisons
on:
  push:
    branches:
      - audit/g5-sequential-paragraph06-comparison-20261113
    paths:
      - 'g5-textbook-v112.js'
      - 'audits/g5_sequential_paragraph06_browser_oracle.cjs'
      - '.github/workflows/g5-sequential-06.yml'
      - 'sw.js'
  pull_request:
    branches:
      - main
    paths:
      - 'g5-textbook-v112.js'
      - 'audits/g5_sequential_paragraph06_browser_oracle.cjs'
jobs:
  grade5-sequential-06:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Check reviewed source and oracle syntax
        run: |
          node --check g5-textbook-v112.js
          node --check audits/g5_sequential_paragraph06_browser_oracle.cjs
      - name: Install browser runtime
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Independent 600 student questions and displayed digit-table oracle
        run: node audits/g5_sequential_paragraph06_browser_oracle.cjs
      - name: Preserve strictly earlier §§1-5
        run: |
          node audits/g5_sequential_paragraphs01_03_browser.cjs
          node audits/g5_sequential_paragraph04_browser_oracle.cjs
          node audits/g5_sequential_paragraph05_browser_oracle.cjs
      - name: Preserve 74 topic and difficulty inventory
        run: node audits/g5_v132_74_real_cognitive_inventory.cjs
      - name: Preserve exact fractional math and geometry
        run: |
          node audits/g5_stage43_factorization_real_math_oracle.cjs
          node audits/g5_stage42_mixed_fraction_oracle.cjs
          node audits/g5_stage41_fractions_angles_browser_oracle.cjs
          node audits/g5_stage40_paragraph25_browser_oracle.cjs
          node audits/g5_stage39_fraction_independent_oracle.cjs
      - name: Preserve fractional conversion and answer entry
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
