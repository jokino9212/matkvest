          cat > .grade-one-objects-check.cjs <<'MATKVEST_CHECK'
          'use strict';
          
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const http = require('node:http');
          const path = require('node:path');
          const {chromium} = require('playwright');
          
          const topic = 'g1:object_properties';
          const repository = process.env.MATKVEST_CHECK_REPO || path.join(__dirname, 'matkvest-g1-objects');
          const baseline = fs.readFileSync(process.env.MATKVEST_CHECK_BASELINE || path.join(__dirname, 'matkvest-g1-objects-before.html'));
          let oldBuild = true;
          const types = {
            '.html': 'text/html; charset=utf-8', '.svg': 'image/svg+xml', '.js': 'text/javascript',
            '.png': 'image/png', '.webp': 'image/webp', '.webmanifest': 'application/manifest+json'
          };
          const server = http.createServer((request, response) => {
            const url = new URL(request.url, 'http://localhost');
            const asset = path.join(repository, url.pathname === '/' ? 'index.html' : decodeURIComponent(url.pathname));
            const html = url.pathname === '/';
            response.setHeader('Cache-Control', 'no-store');
            response.setHeader('Content-Type', types[path.extname(asset)] || 'application/octet-stream');
            try {
              response.end(html && oldBuild ? baseline : fs.readFileSync(asset));
            } catch {
              response.writeHead(404).end();
            }
          });
          
          function inspectBuild({topic, mode}) {
            function requireThat(condition, message) {
              if (!condition) throw new Error(message);
            }
            const plain = value => value.replace(/\s+/g, ' ').trim();
            const expectedFamilies = [['name_property','compare_size'], ['find_object','common_property'], ['count_two_properties','group_rule']];
            const colorName={'#e98484':'Красный','#78aee8':'Синий','#6fc39a':'Зелёный','#f2ca58':'Жёлтый'};
            const colorGen={красного:'Красный',синего:'Синий',зелёного:'Зелёный',жёлтого:'Жёлтый'};
            const shapeGen={круга:'Круг',треугольника:'Треугольник',квадрата:'Квадрат',прямоугольника:'Прямоугольник'};
            const capitalize=value=>value[0].toUpperCase()+value.slice(1);
            function readObject(item){
              const svg=item.querySelector('svg'), primitive=svg.querySelector('circle,polygon,rect');
              const tag=primitive.localName;
              const shape=tag==='circle'?'Круг':tag==='polygon'?'Треугольник':primitive.getAttribute('width')===primitive.getAttribute('height')?'Квадрат':'Прямоугольник';
              const color=colorName[primitive.getAttribute('fill')],size=svg.querySelector('g[transform]')?'Маленький':'Большой';
              requireThat(color && !/(Большой|Маленький) фигура|красный цвета/.test(svg.getAttribute('aria-label')), 'Invalid color or spoken grammar');
              return {shape,color,size,letter:item.querySelector('b')?.textContent};
            }
            function solve(prompt,visual,labels){
              requireThat(labels.length>=2&&new Set(labels).size===labels.length,'Invalid options');
              const objects=[...visual.querySelectorAll('.g1-info-item')].map(readObject);
              requireThat(objects.length>0,'Missing drawing');
              const key=prompt+JSON.stringify(objects);
              const name=prompt.match(/^Какого цвета фигура\?$|^Какой формы фигура\?$/);
              if(name){
                requireThat(objects.length===1&&labels.length===4,'Expected one object for naming');
                const property=prompt.includes('цвета')?'color':'shape';
                const answer=objects[0][property];
                return {family:'name_property',key,answer,values:[property,answer]};
              }
              if(prompt==='Какая фигура больше?'){
                requireThat(objects.length===2&&objects[0].color===objects[1].color&&objects[0].shape===objects[1].shape&&objects[0].size!==objects[1].size,'Two figures should differ only by size');
                const answer=objects.find(item=>item.size==='Большой').letter;
                return {family:'compare_size',key,answer,values:[answer]};
              }
              const find=prompt.match(/^Под какой буквой находится (\S+) (\S+)\?$/);
              if(find){
                requireThat(objects.length===4,'Expected four objects');
                const color=capitalize(find[1]),shape=capitalize(find[2]);
                const match=objects.filter(obj=>obj.color===color&&obj.shape===shape);
                requireThat(match.length===1&&objects.some(o=>o.color===color&&o.shape!==shape)&&objects.some(o=>o.color!==color&&o.shape===shape),'The search should require both properties');
                return {family:'find_object',key,answer:match[0].letter,values:[color,shape,match[0].letter]};
              }
              if(prompt==='Какой признак общий у всех фигур?'){
                const names={color:'Одинаковый цвет',shape:'Одинаковая форма',size:'Одинаковый размер'};
                const common=Object.keys(names).filter(property=>new Set(objects.map(x=>x[property])).size===1);
                requireThat(objects.length===3&&common.length===1&&labels.length===3&&Object.values(names).every(x=>labels.includes(x)),'Expected exactly one common property');
                const answer=names[common[0]];
                return {family:'common_property',key,answer,values:[answer]};
              }
              const count=prompt.match(/^Сколько на рисунке фигур (\S+) цвета в форме (\S+)\?$/);
              if(count){
                const color=colorGen[count[1]],shape=shapeGen[count[2]];
                requireThat(color&&shape&&objects.length===6&&objects.some(o=>o.color===color&&o.shape!==shape)&&objects.some(o=>o.color!==color&&o.shape===shape),'Counting should require both properties');
                const n=objects.filter(item=>item.color===color&&item.shape===shape).length;
                return {family:'count_two_properties',key,answer:String(n),values:[String(n),color,shape]};
              }
              const rule=prompt.match(/^Подходят только (большие|маленькие) фигуры (\S+) цвета\. Какая фигура не подходит\?$/);
              requireThat(rule&&objects.length===4,'Missing two-property rule');
              const color=colorGen[rule[2]],size=rule[1]==='большие'?'Большой':'Маленький';
              const fails=objects.filter(o=>o.color!==color||o.size!==size);
              requireThat(fails.length===1,'Expected one rule violation');
              const failure=(fails[0].color!==color?'color':'')+(fails[0].size!==size?'size':'');
              return {family:'group_rule',key,answer:fails[0].letter,values:[fails[0].letter,color,size,failure]};
            }
            function submit(panel, answer) {
              const field=panel.querySelector('#quizInput');
              if(field){
                field.value=answer;
                field.dispatchEvent(new Event('input',{bubbles:true}));
                panel.querySelector('#quizCheck').click();
                return;
              }
              const button=[...panel.querySelectorAll('button.answer')].find(option=>plain(option.textContent)===answer);
              requireThat(button,'Independently solved option missing from the screen');
              button.click();
            }
          
            function seedRandom(value) {
              Math.random = () => ((value = (Math.imul(value, 1664525) + 1013904223) >>> 0) / 4294967296);
            }
            function siblingQuestions() {
              seedRandom(19503);
              return g1AllTopics().filter(t=>t.id!==topic).flatMap(t => [0,1,2].flatMap(level =>
                Array.from({length:12}, () => makeG1Question(t.id, level))));
            }
          
            if (mode === 'baseline') {
              const siblings = siblingQuestions();
              seedRandom(195);
              for (const level of [0,1]) {
                openG1Topic(topic);
                document.querySelectorAll('#modal .stage-card')[level].click();
                for (let i=0; i<STAGES[level].count; i++) {
                  submit(document.querySelector('#qstage'),q.ans);
                  document.querySelector('#quizNext').click();
                }
              }
              const stored = deepCopy(progressFor(topic));
              requireThat(JSON.stringify(stored.best) === '[5,7,0]' && JSON.stringify(stored.bonus) === '[true,true,false]', 'Baseline did not produce saved progress');
              return {siblings, stored, historyIds:state.attemptHistory.map(attempt=>attempt.id)};
            }
          
            const otherTopics = siblingQuestions();
            seedRandom(19601);
            const holder = document.createElement('div');
            const seen = expectedFamilies.map(() => new Set());
            const coverage=expectedFamilies.map(()=>new Map());
            const stories = expectedFamilies.map(()=>new Set());
            let generated=0, accepted=0, completed=0, rejected=0, entered=0, selected=0;
            for (const level of [0,1,2]) {
              for (let i=0; i<600; i++) {
                const question = makeG1Question(topic, level);
                holder.innerHTML = '<div>' + question.text + '</div>' + quizVisualHtml(question);
                const prompt = plain(holder.firstElementChild.textContent);
                const labels = question.choices.map(option=>option.label);
                const task = solve(prompt, holder, labels);
                requireThat(task.answer === String(question.ans) && (question.answerMode==='number' ? labels.length===0 : labels.filter(label=>label===task.answer).length===1), 'Generated answer disagrees with an independent solution');
                requireThat(expectedFamilies[level].includes(task.family), 'Unexpected family on level ' + level);
                seen[level].add(task.family);
                stories[level].add(task.key);
                const values=coverage[level].get(task.family)||new Set();
                task.values.forEach(value=>values.add(value));
                coverage[level].set(task.family,values);
                generated++;
              }
              requireThat(seen[level].size===expectedFamilies[level].length, 'Insufficient coverage of the level');
              for (let run=0; run<6; run++) {
                openG1Topic(topic);
                const stages = [...document.querySelectorAll('#modal .stage-card')];
                for (const stage of stages) {
                  const rect=stage.getBoundingClientRect();
                  requireThat(rect.width>0 && rect.left>=-1 && rect.right<=innerWidth+1,'Stage card overflow');
                }
                const stage=stages[level];
                requireThat(!stage.disabled, 'Level not unlocked');
                stage.click();
                const keys=new Set(), methods=new Set();
                for (let i=0; i<STAGES[level].count; i++) {
                  const panel=document.querySelector('#qstage');
                  const choices=[...panel.querySelectorAll('button.answer')];
                  const labels=choices.map(button=>plain(button.textContent));
                  const task=solve(plain(panel.querySelector('.quizq').textContent),panel,labels);
                  requireThat(expectedFamilies[level].includes(task.family) && !keys.has(task.key), 'Bad level or repetition inside an attempt');
                  keys.add(task.key);
                  methods.add(task.family);
                  for (const element of panel.querySelectorAll('.g1-info-symbol, button.answer')) {
                    const rect=element.getBoundingClientRect();
                    requireThat(rect.width>0 && rect.left>=-1 && rect.right<=innerWidth+1, 'Question overflowing viewport');
                  }
                  for(const svg of panel.querySelectorAll('.g1-info-symbol')){
                    const primitive=svg.querySelector('circle,polygon,rect');
                    const source=primitive.getBBox().width;
                    const visible=primitive.getBoundingClientRect().width;
                    const displayedRatio=visible/(svg.getBoundingClientRect().width*source/120);
                    requireThat(Math.abs(displayedRatio-(svg.querySelector('g[transform]') ? .65 : 1))<.04,'The figure has the wrong visual scale');
                  }
                  if (run===0 && i===0) {
                    const wrong=labels.length ? labels.find(label=>label!==task.answer) : String((Number(task.answer)+1)%21);
                    submit(panel,wrong);
                    requireThat(blockSession.correct===i && blockSession.done===i && /Пока неверно/.test(document.querySelector('#qfb').textContent), 'Wrong answer was not rejected');
                    rejected++;
                  }
                  submit(panel,task.answer);
                  if(labels.length)selected++;else entered++;
                  const item=blockSession.items.at(-1);
                  const expectedScore=i+1-(run===0?1:0);
                  requireThat(blockSession.correct===expectedScore && blockSession.done===i+1 &&
                    item.finalCorrect && item.firstTry===!(run===0 && i===0), 'Answer handling differed from the level scoring rules: '+task.key);
                  accepted++;
                  const next=document.querySelector('#quizNext');
                  if (i+1===STAGES[level].count) requireThat(/Посмотреть результат/.test(next.textContent), 'Result button is missing');
                  next.click();
                }
                requireThat(methods.size===expectedFamilies[level].length, 'An attempt missed an action');
                const expectedBest=STAGES[level].count-(level===2 && run===0?1:0);
                requireThat(progressFor(topic).best[level]===expectedBest && progressFor(topic).bonus[level], 'Progress not saved');
                completed++;
              }
            }
            const expectedCoverage=[[10,2],[12,3],[12,13]];
            for(const [level,families] of expectedFamilies.entries()){
              for(const [i,family] of families.entries()){
                requireThat(coverage[level].get(family)?.size===expectedCoverage[level][i],'Coverage of directions or targets is missing: '+family+' '+coverage[level].get(family)?.size);
              }
            }
            const cases=Object.fromEntries(coverage.flatMap(level=>[...level].map(([family,values])=>[family,values.size])));
            const overlaps=[[0,1],[0,2],[1,2]].map(([a,b])=>[...stories[a]].filter(key=>stories[b].has(key)).length);
            requireThat(overlaps.every(count=>count===0), 'Same prompt exists on more than one level');
            return {otherTopics, generated, accepted, entered, selected, completed, rejected, cases, overlaps, familyByLevel:seen.map(level=>[...level].sort()), progress:deepCopy(progressFor(topic))};
          }
          
          (async () => {
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
            const address = 'http://127.0.0.1:' + server.address().port;
            let browser;
            try {
              browser=await chromium.launch({headless:true,executablePath:process.env.MATKVEST_CHECK_CHROMIUM});
              for (const width of [320,390,1280]) {
                const context=await browser.newContext({viewport:{width,height:850},isMobile:width<500,hasTouch:width<500,serviceWorkers:'block'});
                try {
                  const page=await context.newPage();
                  const errors=[];
                  page.on('pageerror',error=>errors.push(error.message));
                  oldBuild=true;
                  await page.goto(address);
                  await page.locator('button[onclick="openGrade(1)"]').click();
                  const card=page.locator('button.topic').filter({has:page.getByText('Характеристика объекта, группы объектов',{exact:true})});
                  await card.click();
                  assert.equal(await page.locator('#modal .stage-card:disabled').count(),2);
                  const old=await page.evaluate(inspectBuild,{topic,mode:'baseline'});
                  oldBuild=false;
                  await page.reload();
                  assert.deepEqual(await page.evaluate(key=>({stored:progressFor(key),historyIds:state.attemptHistory.map(attempt=>attempt.id)}),topic),{stored:old.stored,historyIds:old.historyIds});
                  const stagePicker = page.locator('#modal .stage-card').first();
                  if (!(await stagePicker.isVisible())) {
                    if (!(await card.isVisible())) await page.locator('button[onclick="openGrade(1)"]').click({timeout:8000});
                    await card.click({timeout:8000});
                  }
                  assert.match(await page.locator('#modal h2').textContent(), /Характеристика объекта, группы объектов/);
                  assert.equal(await page.locator('#modal .stage-card:disabled').count(),0);
                  assert.match(await page.locator('#modal .stage-card').nth(2).textContent(), /Посчитай фигуры по двум признакам/);
                  const {otherTopics,...result}=await page.evaluate(inspectBuild,{topic,mode:'candidate'});
                  assert.deepEqual(otherTopics,old.siblings);
                  await page.reload();
                  assert.deepEqual(await page.evaluate(key=>progressFor(key),topic),{best:[5,7,10],bonus:[true,true,true]});
                  assert.deepEqual(errors,[]);
                  console.log(JSON.stringify({width,siblingSamples:otherTopics.length,oldProgress:old.stored,oldHistory:old.historyIds.length,...result}));
                } finally {
                  await context.close();
                }
              }
            } finally {
              await browser?.close();
              server.close();
            }
          })().catch(error=>{console.error(error);process.exitCode=1;});
          MATKVEST_CHECK
          MATKVEST_CHECK_REPO="$PWD" MATKVEST_CHECK_BASELINE="$RUNNER_TEMP/matkvest-objects-before.html" node .grade-one-objects-check.cjs
