name: Grade 5 live postdeploy verification for current version
on:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js
      - g5-fraction-applications-v130.js
      - audits/g5_paragraph30_v166_postdeploy_marker_2026-11-15.md
      - .github/workflows/g5-live-postdeploy.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: grade5-live-postdeploy
  cancel-in-progress: false
jobs:
  android-live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the official GitHub Pages URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MATKVEST_PAGES_URL="$(node -e 'fetch("https://api.github.com/repos/"+process.env.GITHUB_REPOSITORY+"/pages",{headers:{"Authorization":"Bearer "+process.env.GH_TOKEN,"User-Agent":"matkvest-ci"}}).then(r=>r.json()).then(j=>{if(!j.html_url)throw Error("No Pages URL");process.stdout.write(j.html_url)}).catch(e=>{console.error(e);process.exit(1)})')"
          test -n "$MATKVEST_PAGES_URL"
          echo "MATKVEST_PAGES_URL=$MATKVEST_PAGES_URL" >> "$GITHUB_ENV"
      - name: Validate current HTML/worker fingerprint and exact v166 release stamp
        run: |
          python3 audits/g7_stage12_sync_pwa.py --check
          python3 audits/g5_v166_activate.py --check
          node --check audits/pwa_v158_grade5_production_browser.cjs
          node --check audits/g5_sequential_paragraph30_browser_oracle.cjs
      - name: Install pinned browser runtime
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Validate actual deployed Pages HTML and Android-width Grade 5 refresh
        run: node audits/pwa_v158_grade5_production_browser.cjs
      - name: Rerun all 600 §30 divisions on real student-facing code
        run: node audits/g5_sequential_paragraph30_browser_oracle.cjs
