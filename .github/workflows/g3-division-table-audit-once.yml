name: Grade 3 division table audit once
on:
  push:
    branches: [audit/g1-g4-content-v195]
    paths: [.github/workflows/g3-division-table-audit-once.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
