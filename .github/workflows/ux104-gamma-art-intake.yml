name: UX-104 inspect two completed standalone Gamma character candidates
on:
  push:
    branches: [ux-final/ux00-inventory-20261108]
    paths: ['.github/workflows/ux104-gamma-art-intake.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download 2 generated standalone images for artistic review only
        shell: bash
        run: |
          mkdir -p audits/ux104_gamma_reference/
          python3 - <<'PY'
          import urllib.request, pathlib, json, hashlib
          images={
            'pet_bot':'https://cdn.gamma.app/4yf1zvcliizt6s1/design-anything/vakZX7wlDfF3C04zpm4JF/tNIObXRQ2SL7u8NTJNlTZ.jpg',
            'pet_owl':'https://cdn.gamma.app/4yf1zvcliizt6s1/design-anything/GeIPjjyrdmj1g4zU8TivE/oiIBq8e718HaHlKk1STau.jpg'
          }
          for name,url in images.items():
            dest=pathlib.Path('audits/ux104_gamma_reference')/(name+'.jpg')
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=35) as response: b=response.read()
            assert b[:3]==b'\xff\xd8\xff' and 10000<len(b)<10000000,(name,len(b))
            dest.write_bytes(b)
            print('UX104_GAMMA_INTAKE',json.dumps({'item':name,'size':len(b),'sha':hashlib.sha256(b).hexdigest()}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux104-gamma-candidates-review-not-approved
          path: audits/ux104_gamma_reference/
          retention-days: 30
