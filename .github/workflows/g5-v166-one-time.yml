name: One-time Grade 5 paragraph 30 v166 PWA activation
on:
  push:
    branches:
      - audit/g5-paragraph30-20261115
    paths:
      - '.github/workflows/g5-v166-one-time.yml'
permissions:
  contents: write
jobs:
  apply-v166:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Activate all 19 versioned scripts and worker
        run: |
          python3 audits/g5_v166_activate.py
          python3 audits/g5_v166_activate.py --check
          grep -q 'const CACHE_NAME = "matkvest-iphone-v166";' sw.js
          if grep -q -E 'src="g5-[^"]+\?v=165"' index.html; then
            echo "Old v165 script references still present" >&2
            exit 1
          fi
      - name: Commit cache-busted v166 release fingerprint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo 'v166 already activated'
          else
            git commit -m 'Release v166: fresh Grade 5 scripts and PWA worker fingerprint'
            git push origin HEAD:audit/g5-paragraph30-20261115
          fi
