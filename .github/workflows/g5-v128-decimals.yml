name: Grade 5 six decimal percentage average real three-tier lessons v128
on:
  push:
    branches: [fix/g5-decimal-percent-v128-20261113]
    paths:
      - g5-decimal-percent-v128.js
      - audits/g5_v128_activate.py
      - audits/g5_v128_real_lesson_oracle_browser.cjs
      - .github/workflows/g5-v128-decimals.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  six-decimal-topics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Activate v128 and sync worker
        run: python3 audits/g5_v128_activate.py
      - name: Check scripts
        run: |
          node --check g5-decimal-percent-v128.js
          node --check audits/g5_v128_real_lesson_oracle_browser.cjs
          python3 -m py_compile audits/g5_v128_activate.py
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify 90 actual learner-facing question families and independent oracle
        run: node audits/g5_v128_real_lesson_oracle_browser.cjs
      - name: Fraction input regression
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
      - name: Commit HTML and PWA if all tests passed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(g5): activate percent and decimal cognitive tiers v128"
            git fetch origin fix/g5-decimal-percent-v128-20261113
            git rebase origin/fix/g5-decimal-percent-v128-20261113
            git push origin HEAD:fix/g5-decimal-percent-v128-20261113
          fi
