name: Stage07B navigation, keyboard and accessibility diagnosis
on:
  push:
    branches: [audit/postrelease-ui-stage07-20261110]
    paths:
      - audits/stage07b_navigation_browser.cjs
      - audits/stage07b_quick_action_compare.cjs
      - audits/stage07b_quick_click_fix.py
      - .github/workflows/stage07b-navigation.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Apply stage07B quick card fix and PWA hash
        run: python3 audits/stage07b_quick_click_fix.py
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Regress keyboard entry for single-action quick cards
        run: timeout 200s node audits/stage07_quick_card_keyboard_browser.cjs
      - name: Visit all eight class and four quick cards at four widths
        run: timeout 300s node audits/stage07b_navigation_browser.cjs
      - name: Compare real quick card blank-area, button, keyboard outcomes
        run: timeout 220s node audits/stage07b_quick_action_compare.cjs
      - name: Regress compact mobile screens and collection worth
        run: |
          timeout 200s node audits/stage27_compact_mobile_browser.cjs
          timeout 160s node audits/stage30_collection_media_browser.cjs
      - name: Regress skip, resumed training and pet overlays
        run: |
          timeout 180s node audits/stage24_attempt_lifecycle_browser.cjs
          timeout 180s node audits/quiz_stage04_pet_browser.cjs
      - name: Commit verified frontend and service worker only to working branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(ui): clickable quick card surfaces with descriptive screenreader names"
            git fetch origin audit/postrelease-ui-stage07-20261110
            git rebase origin/audit/postrelease-ui-stage07-20261110
            git push origin HEAD:audit/postrelease-ui-stage07-20261110
          fi
