name: Apply verified Grade 3 perimeter and area audits
on:
  push:
    branches: [audit/g1-g4-content-v195]
    paths: [.github/workflows/g3-perimeter-area-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply the verified audit patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d8d1e876aff805262fec1d1322cd1d9429759ddf"
          patch_file="$RUNNER_TEMP/matkvest.patch"
          cat > "$patch_file" <<'MATKVEST_PATCH'
          diff --git a/audits/g1_g4_content_audit_2026-11-17.md b/audits/g1_g4_content_audit_2026-11-17.md
          index ae01777..ff699fd 100644
          --- a/audits/g1_g4_content_audit_2026-11-17.md
          +++ b/audits/g1_g4_content_audit_2026-11-17.md
          @@ -1639 +1639,41 @@
           - Все вопросы сводятся к прямому вычислению периметра. Нет задач на восстановление стороны и пересчёт периметра после изменения размеров.
          +
          +**После правок.** Разминка суммирует подписанные стороны треугольников и разных многоугольников. Тренировка использует формулы периметра для квадрата и прямоугольника. Мастер восстанавливает длину стороны или пересчитывает периметр после изменения. Схемы помещаются в SVG.
          +
          +- В Chromium независимо решены 9 600 условий. Длины и подписи на SVG пропорциональны, числовые равенства верны, повторов между уровнями нет.
          +- На 320, 390 и 1280 px пройдены 12 попыток и введён 81 правильный ответ. F5 сохранил прогресс. На 390 px второй вопрос восстановился на всех трёх уровнях.
          +
          +Следующая тема 3-го класса — «Измерение и сравнение площади» (`g3:area_measure`).
          +
          +### 2026-11-19. Измерение и сравнение площади (`g3:area_measure`)
          +
          +**До правок.** В Chromium проверено по 1 200 задач на уровень (зерно 19502).
          +
          +- Тренировка частично повторяет подсчёт клеток в прямоугольнике из разминки. В вопросе о сравнении A и B называются буквы, которых нет на рисунке. Мастер выбирает дополнение и сравнение случайно.
          +
          +**После правок.** Тренировка переключается между Г-образной фигурой и сравнением площадей. На сравнительных рисунках подписаны фигуры A и B. На мастере чередуются дополнение фигуры и вычисление разности площадей.
          +
          +- В Chromium независимо проверены 9 600 задач по клеткам SVG, включая равные площади и пустой угол. Для сравнений подтверждены две подписанные фигуры. Между уровнями нет повторов с тем же рисунком.
          +- На 320, 390 и 1280 px пройдены 12 попыток с 81 правильным ответом. После F5 остались очки и награды. На 390 px каждый уровень восстановился со второго вопроса.
          +
          +Следующая тема 3-го класса — «Площадь прямоугольника и квадрата» (`g3:rectangle_square_area`).
          +
          +### 2026-11-19. Площадь прямоугольника и квадрата (`g3:rectangle_square_area`)
          +
          +**До правок.** В Chromium проверено по 1 200 задач на уровень (зерно 19502).
          +
          +- Уровни различаются: сетка, формула, обратная задача или изменение стороны. На мастере неизвестную длину можно считать по клеткам, так как схему строят на сетке с готовыми размерами. Типы тренировки и мастера выбираются случайно.
          +
          +**После правок.** Сетка осталась в заданиях на подсчёт клеток. В задачах с заданными величинами показана схема, а неизвестная сторона находится по площади и известной длине. Типы на тренировке и мастере чередуются.
          +
          +- В Chromium проверены 9 600 условий, включая размеры рисунка на сетке, вычисление площадей и длины, единицы и отсутствие совпадений между уровнями.
          +- На 320, 390 и 1280 px подтверждены 12 попыток и 81 правильный ответ. F5 сохраняет результаты и восстанавливает второй вопрос всех трёх уровней на 390 px.
          +
          +Следующая тема 3-го класса — «Классификация и закономерности» (`g3:classification_patterns`).
          +
          +### 2026-11-19. Классификация и закономерности (`g3:classification_patterns`)
          +
          +**До правок.** В Chromium проверено по 1 200 задач на уровень (зерно 19502).
          +
