name: Grade 5 sequential §16 order of arithmetic operations
on:
  push:
    branches:
      - audit/g5-sequential-paragraph16-v151-20261114
  pull_request:
    branches:
      - main
    paths:
      - 'g5-remaining-core-v126.js'
      - 'audits/g5_sequential_paragraph16_browser_oracle.cjs'
      - '.github/workflows/g5-sequential-16.yml'
jobs:
  real-order-of-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check g5-remaining-core-v126.js
          node --check audits/g5_sequential_paragraph16_browser_oracle.cjs
      - name: Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify 600 independent order-of-operations examples
        run: node audits/g5_sequential_paragraph16_browser_oracle.cjs
      - name: Regression §1 to §15
        run: |
          node audits/g5_sequential_paragraphs01_03_browser.cjs
          for n in 04 05 06 07 08 09 10 11 12 13 14 15; do node "audits/g5_sequential_paragraph${n}_browser_oracle.cjs"; done
