name: MatKvest UI19F - precise grade progress contract
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19f_contract.yml
      - audits/ui_stage19f_contract.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Inspect grade counters and level thresholds from real JS implementation
        run: node audits/ui_stage19f_contract.mjs
      - name: Save progress data contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/ui_stage19f_progress_contract.json
          git diff --cached --quiet || git commit -m "audit(ui19F): document actual per-grade progress and XP contract"
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
