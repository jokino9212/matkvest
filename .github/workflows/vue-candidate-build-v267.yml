name: Private Vue PWA v267 candidate build and checks

on:
  push:
    branches: [fix/vue-mount-actions-20261123]
    paths:
      - '.github/workflows/vue-candidate-build-v267.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vue-candidate-v267
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vue-mount-actions-20261123
          persist-credentials: true
      - name: Trust checkout path inside the Playwright container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install exact application and test dependencies
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Build changed Vue source
        run: npm run build:knowledge-map
      - name: Prepare private PWA v267 and synchronize snapshots
        run: |
          python3 audits/prepare_vue_pwa_v267.py
          python3 audits/g7_stage12_sync_pwa.py
          python3 audits/g7_stage12_sync_pwa.py --check
          git diff --check
          git diff --exit-code --quiet -- frontend/knowledge-map/mount.js
          test "$(git diff --name-only | sort | tr '\n' ',')" = "assets/ui/knowledge-map.js,index.html,sw.js,"
      - name: Validate fresh Vue callbacks and component switching
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/vue-http.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8765/audits/vue_mount_fixture.html >/dev/null; then break; fi
            sleep 0.1
          done
          node audits/vue_mount_actions_browser.cjs
      - name: Verify installed PWA is usable offline (mobile, tablet)
        run: node audits/stage28_offline_pwa_browser.cjs
      - name: Verify update from old PWA and offline recovery
        run: |
          git fetch --depth=1 origin main
          git worktree add --detach /tmp/matkvest-v266 origin/main
          node audits/vue_v266_to_v267_upgrade_browser.cjs /tmp/matkvest-v266 "$PWD"
      - name: Verify training attempt recovery and one-time rewards
        run: node audits/stage24_attempt_lifecycle_browser.cjs
      - name: Verify saved student profile boundaries
        run: node audits/stage25_profile_isolation_browser.cjs
      - name: Commit candidate assets ONLY to test branch after all checks pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 audits/g7_stage12_sync_pwa.py --check
          git add assets/ui/knowledge-map.js index.html sw.js
          git diff --cached --check
          git commit -m "build(vue): synchronize private v267 bundle, HTML and PWA worker"
          git push origin HEAD:fix/vue-mount-actions-20261123
