name: Grade 5 sequential §22 units of area (independent 600-question oracle)
on:
  push:
    branches:
      - audit/g5-sequential-paragraph22-v157-20261114
  pull_request:
    branches: [main]
    paths:
      - 'g5-natural-units-v125.js'
      - 'g5-textbook-v111.js'
      - 'audits/g5_sequential_paragraph22_browser_oracle.cjs'
      - '.github/workflows/g5-sequential-22.yml'
jobs:
  independent-square-area-units:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check g5-natural-units-v125.js
          node --check g5-textbook-v111.js
          node --check audits/g5_sequential_paragraph22_browser_oracle.cjs
      - name: Install pinned browser tools
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify 600 actual learner-visible §22 exercises independently
        run: node audits/g5_sequential_paragraph22_browser_oracle.cjs
      - name: Regression 1–21 in textbook order
        run: |
          node audits/g5_sequential_paragraphs01_03_browser.cjs
          for f in audits/g5_sequential_paragraph??_browser_oracle.cjs; do
            if [ "$f" != "audits/g5_sequential_paragraph22_browser_oracle.cjs" ]; then
              node "$f"
            fi
          done
      - name: Preserve full Grade 5 subject inventory
        run: node audits/g5_v132_74_real_cognitive_inventory.cjs
