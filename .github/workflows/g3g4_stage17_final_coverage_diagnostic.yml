name: MatKvest stage17D - comprehensive grade3-4 coverage diagnostic
on:
  push:
    branches: [audit/g3g4-stage17-20261104]
    paths:
      - audits/g3g4_stage17_final_coverage_diagnostic.mjs
      - .github/workflows/g3g4_stage17_final_coverage_diagnostic.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g3g4-stage17-20261104
          persist-credentials: true
      - name: Guard approved candidate
        run: |
          echo '04a719fe8c292d8fe42b9762fdca5b8b48c316042cbdb1709ac18fe5290eff21  index.html' | sha256sum --check
          python3 audits/g7_stage12_sync_pwa.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Audit all grade3/4 stages and special arithmetic engines
        run: node audits/g3g4_stage17_final_coverage_diagnostic.mjs
      - name: Preserve diagnostic even with findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-stage17D-final-coverage-diagnostic
          path: audits/g3g4_stage17_final_coverage_diagnostic.json
          if-no-files-found: warn
      - name: Commit read-only diagnostic
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/g3g4_stage17_final_coverage_diagnostic.json
          git commit -m "audit(stage17D): preserve complete grade3-4 coverage diagnostic [skip ci]"
          git pull --rebase origin audit/g3g4-stage17-20261104
          git push origin HEAD:audit/g3g4-stage17-20261104
