name: MatKvest UI19G pets audit baseline
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19g_probe.yml
      - audits/ui_stage19g_probe.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pet-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Inspect actual pet states and source behavior
        run: node audits/ui_stage19g_probe.mjs
      - name: Save compact pet test evidence
        if: success()
        run: |
          for pic in audits/ui19g_before_shop_390.png audits/ui19g_before_purchased_390.png audits/ui19g_before_collection_390.png audits/ui19g_before_collection_pets_390.png; do
            base64 -w0 "$pic" > "audits/$(basename "$pic" .png).b64.txt"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/ui_stage19g_pet_baseline.json audits/ui19g_before_*.b64.txt
          git diff --cached --quiet || git commit -m "audit(ui19G): inspect pet shop, purchase, equip, reward and collection screens"
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matkvest-ui19g-pets-baseline
          path: |
            audits/ui_stage19g_pet_baseline.json
            audits/ui19g_before_*.png
          if-no-files-found: warn
