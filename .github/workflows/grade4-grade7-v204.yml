name: Verify Grade 4 progress and complex answers v204
on:
  push:
    branches: [verify/grade4-grade7-v204]
    paths: [.github/workflows/grade4-grade7-v204.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply candidate and run browser regressions
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout --detach 07d23f81a786d0145305e943cf881285d930d461
          base64 -d <<'PATCH' | gzip -d | git apply
          
          PATCH
          git diff --check
          python3 audits/g7_stage12_sync_pwa.py --check
          npm install --no-save --no-package-lock playwright@1.56.1
          node audits/shop_progress_v874_browser_test.cjs
          node audits/stage23_complex_answers_browser.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html g4-textbook.js sw.js audits/shop_progress_v874_browser_test.cjs audits/stage23_complex_answers_browser.cjs audits/UX_UI_FINAL_STATUS.md
          git commit -m 'Restore Grade 4 section progress and verify complex answer inputs'
          git push origin HEAD:refs/heads/audit/grade4-grade7-v204
