name: MatKvest UI stage19A - clickable cards and design polish gate
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19a_gate.yml
      - audits/ui_stage19a_patch.py
      - audits/ui_stage19a_test.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-ui-stage19a
  cancel-in-progress: false
jobs:
  navigation-and-style:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          fetch-depth: 0
          persist-credentials: true
      - name: Build v56 patch from exact v55 production checkpoint
        run: python3 audits/ui_stage19a_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome test harness
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Test 1-8 grade clickable backgrounds, quick cards, keyboard and responsive design
        run: node audits/ui_stage19a_test.mjs
      - name: Regress all G1/G2/G3/G5/G6/G8 practice generators
        run: |
          SHA="$(sha256sum index.html | cut -d' ' -f1)"
          sed "s/f188d39a3a16fc54dfb32238fc34d3dfe6cc3c4416cd475579bf3ed65a7e1e36/$SHA/g" audits/g7_stage14_crossgrade_test.mjs > audits/_ui19a_crossgrade.mjs
          node audits/_ui19a_crossgrade.mjs
          rm audits/_ui19a_crossgrade.mjs
      - name: Regress fourth-grade handwritten/table exercises
        run: |
          SHA="$(sha256sum index.html | cut -d' ' -f1)"
          sed "s/f188d39a3a16fc54dfb32238fc34d3dfe6cc3c4416cd475579bf3ed65a7e1e36/$SHA/g" audits/g7_stage14_grade4_test.mjs > audits/_ui19a_grade4.mjs
          node audits/_ui19a_grade4.mjs
          rm audits/_ui19a_grade4.mjs
      - name: Validate PWA build integrity
        run: |
          python3 audits/g7_stage12_sync_pwa.py --check
          grep -F 'matkvest-iphone-v56' sw.js
      - name: Preserve before/after evidence and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-ui19a-navigation-design-gate
          path: |
            audits/ui_stage19a_patch_report.json
            audits/ui_stage19a_test_report.json
            audits/ui_stage19a_grade1_390.png
            audits/ui_stage19a_grade6_390.png
            audits/ui_stage19a_grade1_1280.png
            audits/ui_stage19a_grade6_1280.png
          if-no-files-found: warn
      - name: Persist tested v56 to audit branch only
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js audits/ui_stage19a_patch_report.json audits/ui_stage19a_test_report.json
          git diff --cached --quiet || git commit -m "feat(ui19A): whole-card grade/quick navigation and modern feedback v56"
          for file in audits/g7_stage14_crossgrade_report.json audits/g7_stage14_grade4_report.json; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then git restore -- "$file"; else rm -f "$file"; fi
          done
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
