name: Grade 5 sequential textbook audit §§1-3 (tables, digits, geometry)
on:
  push:
    branches:
      - audit/g5-sequential-paragraphs01-03-20261113
    paths:
      - 'g5-textbook-v111.js'
      - 'g5-natural-units-v125.js'
      - 'g5-arithmetic-tiers-v123.js'
      - 'g5-live-pedagogy-v122.js'
      - 'audits/g5_sequential_paragraphs01_03_browser.cjs'
      - '.github/workflows/g5-sequential-01-03.yml'
      - 'sw.js'
  pull_request:
    branches:
      - main
    paths:
      - 'g5-textbook-v111.js'
      - 'g5-natural-units-v125.js'
      - 'g5-arithmetic-tiers-v123.js'
      - 'g5-live-pedagogy-v122.js'
      - 'audits/g5_sequential_paragraphs01_03_browser.cjs'
jobs:
  grade5-sequential-paragraphs01-03:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Syntax of reviewed modules and independent test
        run: |
          node --check g5-textbook-v111.js
          node --check g5-natural-units-v125.js
          node --check g5-arithmetic-tiers-v123.js
          node --check g5-live-pedagogy-v122.js
          node --check audits/g5_sequential_paragraphs01_03_browser.cjs
      - name: Install pinned browser
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify 900 actual questions for §§1-3 with visual geometry geometry and table semantics
        run: node audits/g5_sequential_paragraphs01_03_browser.cjs
      - name: Preserve full Grade 5 catalog and 1110 cognitive families
        run: node audits/g5_v132_74_real_cognitive_inventory.cjs
      - name: Preserve exact fractions and textbook geometry
        run: |
          node audits/g5_stage43_factorization_real_math_oracle.cjs
          node audits/g5_stage42_mixed_fraction_oracle.cjs
          node audits/g5_stage41_fractions_angles_browser_oracle.cjs
          node audits/g5_stage40_paragraph25_browser_oracle.cjs
          node audits/g5_stage39_fraction_independent_oracle.cjs
      - name: Preserve conversion behavior and input UI
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
