name: Stage23 grade-five fractions compare add subtract v115
on:
  push:
    branches: [feat/g5-v115-fraction-arithmetic-20261113]
    paths:
      - g5-fraction-arithmetic-v115.js
      - audits/g5_v115_patch.py
      - audits/g5_v115_arithmetic_oracle.cjs
      - .github/workflows/g5-v115-fraction-arithmetic.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage23:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Activate new fraction arithmetic and PWA hash
        run: python3 audits/g5_v115_patch.py
      - name: Syntax validation
        run: node --check g5-fraction-arithmetic-v115.js
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Validate 105 new cognitive families and exact arithmetic at 4 widths
        run: node audits/g5_v115_arithmetic_oracle.cjs
      - name: Check previous curricula, conversions, UI, mobile and fractions
        run: |
          node audits/g5_v114_fraction_oracle.cjs
          node audits/g5_v113_math_oracle.cjs
          sed 's/ids=window.mkG5V112Topics/ids=window.mkG5V112Topics.filter(id=>!window.mkG5V113Tiered.includes(id))/' audits/g5_v112_browser.cjs > audits/g5_v115_v112_runtime.cjs
          node audits/g5_v115_v112_runtime.cjs
          sed 's/67/74/g' audits/g5_v111_browser.cjs > audits/g5_v115_v111_runtime.cjs
          sed 's/61/74/g' audits/g5_stage18t_full_regression.cjs > audits/g5_v115_full_runtime.cjs
          node audits/g5_v115_v111_runtime.cjs
          node audits/g5_v115_full_runtime.cjs
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
      - name: Publish release candidate HTML and service worker to staging branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "feat(g5): activate stage23 fraction arithmetic v115"
            git fetch origin feat/g5-v115-fraction-arithmetic-20261113
            git rebase origin/feat/g5-v115-fraction-arithmetic-20261113
            git push origin HEAD:feat/g5-v115-fraction-arithmetic-20261113
          fi
