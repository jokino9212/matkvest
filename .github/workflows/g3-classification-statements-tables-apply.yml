name: Apply verified Grade 3 classification statements and tables audit
on:
  push:
    branches: [audit/g1-g4-content-v195]
    paths: [.github/workflows/g3-classification-statements-tables-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply the verified audit patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "259ac04fa3b7d11cf085bd1bbe3cc93773b95ddf"
          patch_file="$RUNNER_TEMP/matkvest.patch"
          cat > "$patch_file" <<'MATKVEST_PATCH'
          diff --git a/audits/g1_g4_content_audit_2026-11-17.md b/audits/g1_g4_content_audit_2026-11-17.md
          index ff699fd..805df49 100644
          --- a/audits/g1_g4_content_audit_2026-11-17.md
          +++ b/audits/g1_g4_content_audit_2026-11-17.md
          @@ -1679 +1679,43 @@
           - Классификация проверяет один признак. Для целочисленных ответов этого тренажёра и остальных числовых заданий раздела «Математическая информация» используется подсказка про десятичную дробь.
          +
          +**После правок.** Разминка проверяет один признак и следующий член ряда. Тренировка ищет исключение и пропуск. Мастер требует применить два признака сразу или восстановить последовательность с чередующимися шагами. Следующее число остаётся в пределах 1 000.
          +
          +- В Chromium проверены 9 600 условий. Независимо найдены единственный правильный вариант и ответ для каждого ряда. Совпадений между уровнями нет.
          +- На 320, 390 и 1280 px пройдены 12 попыток и засчитан 81 ответ. После F5 сохранены результаты и награды. На 390 px все три уровня продолжаются с того же второго вопроса.
          +
          +Следующая тема 3-го класса — «Истинные и ложные утверждения» (`g3:true_false_logic`).
          +
          +### 2026-11-19. Истинные и ложные утверждения (`g3:true_false_logic`)
          +
          +**До правок.** В Chromium проверено по 1 200 задач на уровень (зерно 19502).
          +
          +- Все уровни повторяют проверку одного утверждения. Пересечения составили 31, 22 и 143 уникальных условия. Сравнения и факты о квадрате встречаются на всех трёх уровнях. Мастер не требует совместно оценить два утверждения.
          +- При проверке равенств с копейками сокращение и знак конца фразы образуют две точки подряд.
          +
          +**После правок.** Разминка оценивает числовые сравнения, равенства и простые свойства. Тренировка использует периметр, площадь и доли. Мастер отдельно проверяет два утверждения и решает, верны ли оба или хотя бы одно. Лишняя точка в сокращении убрана.
          +
          +- В Chromium независимо проверены 9 600 утверждений по видимому тексту. Для составных утверждений проверены логические операции и единственность ответа.
          +- На 320, 390 и 1280 px пройдены 12 попыток. 81 правильный ответ засчитан. После F5 на каждом уровне подтверждены прогресс, бонусы и возобновление второго вопроса на 390 px.
          +
          +Следующая тема 3-го класса — «Чтение и заполнение таблиц» (`g3:tables`).
          +
          +### 2026-11-19. Чтение и заполнение таблиц (`g3:tables`)
          +
          +**До правок.** В Chromium проверено по 1 200 задач на уровень (зерно 19502).
          +
          +- Тренировка повторяет чтение ячейки, максимум и минимум из разминки. Мастер повторяет сумму и разность из тренировки. Пересечения текстов — 6, 0 и 24.
          +- Пропуск возможен только в столбце стоимости. Шаблоны выбираются случайно.
          +
          +**После правок.** Разминка читает ячейки и крайние значения. Тренировка вычисляет сумму, разность или итог по строкам. Мастер восстанавливает цену, количество или стоимость и находит разность между наибольшим и наименьшим значениями. Формы чередуются.
          +
          +- В Chromium независимо проверены 9 600 задач по фактическому содержимому HTML-таблицы. В каждой обратной задаче ровно одна пустая ячейка. Пересечений между уровнями нет.
          +- На 320, 390 и 1280 px пройдены 12 попыток с 81 правильным ответом. Подтверждены сохранение прогресса и продолжение второго вопроса каждого уровня после F5 на 390 px.
          +
          +Следующая тема 3-го класса — «Столбчатые диаграммы» (`g3:bar_charts`).
          +
          +### 2026-11-19. Столбчатые диаграммы (`g3:bar_charts`)
          +
          +**До правок.** В Chromium проверено по 1 200 задач на уровень (зерно 19502).
          +
