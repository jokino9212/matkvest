name: Grade 5 §36 v172 release stamp
on:
  push:
    branches: [audit/g5-paragraph36-20261115]
permissions:
  contents: write
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp all 19 Grade 5 URLs and synchronize the service worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html')
          worker=Path('sw.js')
          pattern=rb'(<script src="g5-[\w-]+\.js)\?v=171("></script>)'
          updated,count=re.subn(pattern,rb'\g<1>?v=172\g<2>',html.read_bytes())
          assert count==19, count
          html.write_bytes(updated)
          old=b'const CACHE_NAME = "matkvest-iphone-v171";'
          before=worker.read_bytes()
          assert before.count(old)==1
          worker.write_bytes(before.replace(old,old.replace(b'171',b'172')))
          PY
          python3 audits/g7_stage12_sync_pwa.py
          python3 audits/g7_stage12_sync_pwa.py --check
      - name: Commit release stamp and delete this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git rm .github/workflows/g5-v172-release-once.yml
          git commit -m 'release(g5): stamp PWA v172 for paragraph 36'
          git push origin HEAD:refs/heads/audit/g5-paragraph36-20261115
