name: Grade 3 off-table division audit and patch
on:
  push:
    branches: [audit/g1-g4-content-v195]
    paths:
      - .github/workflows/g3-offtable-division-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Patch generator
        run: python3 audits/g3_offtable_divide_patch.py
      - name: Prepare browser
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify 9600 answers and no cross-level repeats
        run: node audits/g3_offtable_divide_browser.cjs
      - name: Verify interface completion and page-reload progress
        run: node audits/g3_offtable_divide_progress_browser.cjs
      - name: Commit verified source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'Expand Grade 3 off-table division stages (verified)'
          git push origin HEAD:audit/g1-g4-content-v195
