name: UX-96 sticker v96 24 vector decals staging Gate
on:
  push:
    branches: [ux-final/ux00-inventory-20261108]
    paths: ['.github/workflows/ux96-sticker-v96.yml','audits/ux96_sticker_v96_browser.cjs','audits/ux96_sticker_v96_patch.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  staging:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Integrate 8 new sticker SVGs and PWA v96
        run: python3 audits/ux96_sticker_v96_patch.py
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Responsive stickers, selection, collection and economy
        run: timeout 160s node audits/ux96_sticker_v96_browser.cjs
      - name: Regression - 55 legacy avatars
        run: timeout 150s node audits/ux93_all_avatar_leaderboard_browser.cjs
      - name: Regression - pets and avatar zoom
        run: timeout 120s node audits/ux92_pet_viewer_v92_browser.cjs
      - name: Regression - 50 badge images and six widths
        run: timeout 150s node audits/ux00_badge_final_visual_browser.cjs
      - name: Regression - mobile shop navigation
        run: timeout 120s node audits/ux_mobile_shop_v91_browser.cjs
      - name: Regression - inventory worth and leaderboard
        run: timeout 120s node audits/stage30_collection_media_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux96-sticker-v96-responsive
          path: audits/ux96_sticker_v96_output/
          retention-days: 60
      - name: Push staging files after full Gate success
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "feat(ux96): 24 vector decals in staging PWA v96 [skip ci]"
            git pull --rebase origin ux-final/ux00-inventory-20261108
            git push origin HEAD:ux-final/ux00-inventory-20261108
          fi
