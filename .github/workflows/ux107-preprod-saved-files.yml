name: UX107 final preproduction saved-file regression
on:
  push:
    branches: [release/ux105-v107-hydration-archive-20261110]
    paths:
      - '.github/workflows/ux107-preprod-saved-files.yml'
      - 'audits/ux107_badge_firstpaint_browser.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saved-v107-file-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Exact staged version checksum and 10 original WebP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          h=Path('index.html').read_bytes();w=Path('sw.js').read_text()
          assert 'matkvest-iphone-v107' in w
          assert re.search(r'const APP_BUILD_HASH = "([a-f0-9]{64})"',w).group(1)==hashlib.sha256(h).hexdigest()
          m=json.loads(Path('audits/ux105_new_pets_manifest.json').read_text())
          assert m['artwork']['accepted_count']==10 and m['artwork']['art_approval']=='approved'
          for item in m['items']:
              assert hashlib.sha256(Path(item['source_asset']).read_bytes()).hexdigest()==item['approved_sha256']
          print('UX107_PERSISTED_STAGING_FILES_PASS')
          PY
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Badge CSS applied before first paint with 30px real geometry
        run: timeout 150s node audits/ux107_badge_firstpaint_browser.cjs
      - name: Old purchases archived sellable, 3 reloads and 23 old/new artworks correct
        run: timeout 170s node audits/ux107_firstpaint_archive_browser.cjs
      - name: Every new pet image, economy and alpha
        run: timeout 180s node audits/ux105_v107_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux107-final-saved-staging-art-and-badge
          path: |
            audits/ux107_badge_firstpaint_output/
            audits/ux107_firstpaint_archive_output/
          retention-days: 60
