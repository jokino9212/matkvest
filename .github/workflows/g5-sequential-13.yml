name: Grade 5 sequential textbook audit §13 exact natural-number division
on:
  push:
    branches:
      - audit/g5-sequential-paragraph13-division-20261114
    paths:
      - 'g5-arithmetic-tiers-v123.js'
      - 'g5-textbook-core.js'
      - 'audits/g5_sequential_paragraph13_browser_oracle.cjs'
      - '.github/workflows/g5-sequential-13.yml'
      - 'sw.js'
  pull_request:
    branches:
      - main
    paths:
      - 'g5-arithmetic-tiers-v123.js'
      - 'g5-textbook-core.js'
      - 'audits/g5_sequential_paragraph13_browser_oracle.cjs'
jobs:
  sequential-paragraph13:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Check §13 generator and independent oracle source syntax
        run: |
          node --check g5-arithmetic-tiers-v123.js
          node --check g5-textbook-core.js
          node --check audits/g5_sequential_paragraph13_browser_oracle.cjs
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Independently verify 600 real division problems and nonzero divisors
        run: node audits/g5_sequential_paragraph13_browser_oracle.cjs
      - name: Preserve previous sequential §1–12 textbook paragraph audits
        run: |
          node audits/g5_sequential_paragraphs01_03_browser.cjs
          node audits/g5_sequential_paragraph04_browser_oracle.cjs
          node audits/g5_sequential_paragraph05_browser_oracle.cjs
          node audits/g5_sequential_paragraph06_browser_oracle.cjs
          node audits/g5_sequential_paragraph07_browser_oracle.cjs
          node audits/g5_sequential_paragraph08_browser_oracle.cjs
          node audits/g5_sequential_paragraph09_browser_oracle.cjs
          node audits/g5_sequential_paragraph10_browser_oracle.cjs
          node audits/g5_sequential_paragraph11_browser_oracle.cjs
          node audits/g5_sequential_paragraph12_browser_oracle.cjs
      - name: Protect 74 topic IDs, 1110 families and corrected task contexts
        run: |
          node audits/g5_v132_74_real_cognitive_inventory.cjs
          node audits/g5_stage38_percent_context_check.cjs
      - name: Protect prior exact fraction arithmetic and drawn geometry
        run: |
          node audits/g5_stage43_factorization_real_math_oracle.cjs
          node audits/g5_stage42_mixed_fraction_oracle.cjs
          node audits/g5_stage41_fractions_angles_browser_oracle.cjs
          node audits/g5_stage40_paragraph25_browser_oracle.cjs
          node audits/g5_stage39_fraction_independent_oracle.cjs
      - name: Protect mixed-fraction conversion input and diversity
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
