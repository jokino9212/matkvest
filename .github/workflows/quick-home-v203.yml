name: Verify quick trainers on the home page
on:
  push:
    branches: [verify/quick-home-v203]
    paths: [.github/workflows/quick-home-v203.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify desktop, mobile and trainer navigation
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout --detach 0aca822c7fa4a08d30adba04e0cc57053f6f4ffa
          base64 -d <<'PATCH' | gzip -d | git apply
          
          PATCH
          git diff --check
          python3 audits/g7_stage12_sync_pwa.py --check
          node --check sw.js
          npm install --no-save --no-package-lock playwright@1.56.1
          node <<'JS'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          const expected = ['Счёт столбиком', 'Таблица умножения', 'Таблица сложения', 'Квадраты чисел', 'Кубы чисел'];
          (async () => {
            const browser = await chromium.launch({args: ['--no-sandbox']});
            try {
              for (const width of [320, 390, 768, 1280]) {
                const page = await browser.newPage({viewport: {width, height: 900}});
                const errors = [];
                page.on('pageerror', error => errors.push(error.message));
                await page.goto('file://' + process.cwd() + '/index.html');
                await page.evaluate(() => renderHome());
                const panel = page.locator('.quick-home');
                const cards = panel.locator('.quick-card');
                assert.deepEqual(await cards.locator('h3,strong').allTextContents(), expected);
                const [column, multiply, addition, squares, cubes] = await Promise.all(
                  (await cards.all()).map(card => card.boundingBox())
                );
                assert(column.height > addition.height);
                assert(multiply.height > cubes.height);
                assert.equal(squares.y, cubes.y);
                assert(squares.x + squares.width <= cubes.x);
                if (width <= 680) {
                  assert.equal(column.x, multiply.x);
                  assert.equal(column.width, multiply.width);
                  assert(column.y + column.height <= multiply.y);
                  assert(multiply.y + multiply.height <= addition.y);
                  assert(addition.y + addition.height <= squares.y);
                  assert.equal(addition.width, column.width);
                } else {
                  assert.equal(column.y, multiply.y);
                  assert(column.x + column.width <= multiply.x);
                  assert.equal(addition.y, squares.y);
                  assert(addition.x + addition.width <= squares.x);
                }
                assert(await panel.evaluate(section => section.scrollWidth <= section.clientWidth));
                assert(await panel.locator('button').evaluateAll(buttons => buttons.every(button => button.scrollWidth <= button.clientWidth + 1)));
                const columnButton = panel.getByRole('button', {name: 'Тренироваться — Счёт столбиком'});
                await columnButton.focus();
                await page.keyboard.press('Enter');
                assert.match(await page.locator('#modal h2').innerText(), /Счёт столбиком/);
                assert.equal(await page.locator('#modal .operation-card').count(), 4);
                await page.locator('#modal .operation-card').first().click();
                assert.match(await page.locator('#modal h2').innerText(), /Сложение столбиком/);
                await page.locator('#modal .stage-card:not(.locked)').first().click();
                assert.match(await page.locator('#modal h2').innerText(), /Счёт столбиком/);
                assert.deepEqual(errors, []);
                await page.close();

                const reload = await browser.newPage({viewport: {width, height: 900}});
                await reload.goto('file://' + process.cwd() + '/index.html');
                await reload.reload();
                assert.deepEqual(await reload.locator('.quick-home .quick-card').locator('h3,strong').allTextContents(), expected);
                await reload.close();

                for (const [i, key] of ['multiplication','addition','squares','cubes'].entries()) {
                  const trainer = await browser.newPage({viewport: {width, height: 900}});
                  const trainerErrors = [];
                  trainer.on('pageerror', error => trainerErrors.push(error.message));
                  await trainer.goto('file://' + process.cwd() + '/index.html');
                  await trainer.locator('.quick-home .quick-card').nth(i+1).getByRole('button').click({timeout: 5000});
                  assert.equal(await trainer.evaluate(() => quickTrainerId), key);
                  assert.equal(await trainer.locator('.quick-hero h1').innerText(), expected[i+1]);
                  await trainer.evaluate(() => startQuickTraining());
                  assert(await trainer.locator('.quick-question').isVisible());
                  assert.deepEqual(trainerErrors, []);
                  await trainer.close();
                }
                console.log('PASS', width, expected.join(' | '));
              }
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Prioritize written arithmetic and multiplication on the home page'
          git push origin HEAD:refs/heads/audit/quick-home-v203
