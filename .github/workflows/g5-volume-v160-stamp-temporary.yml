name: Temporary Grade 5 v160 verified asset stamp
on:
  push:
    branches:
      - audit/g5-sequential-paragraph24-v160-20261114
permissions:
  contents: write
jobs:
  stamp-v160:
    if: "!contains(github.event.head_commit.message, '[v160-stamped]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g5-sequential-paragraph24-v160-20261114
          persist-credentials: true
      - name: Release all 19 grade 5 script URLs and PWA version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html')
          source=html.read_text('utf-8')
          old=source.count('?v=159')
          new=source.count('?v=160')
          if old==19 and new==0:
              html.write_text(source.replace('?v=159','?v=160'),encoding='utf-8')
              print('UPDATED 19 Grade 5 script URLs v159 -> v160')
          elif old==0 and new==19:
              print('Grade 5 script URLs already v160')
          else:
              raise SystemExit(f'ERROR: unexpected Grade 5 script versions old={old} new={new}')
          worker=Path('sw.js')
          sw=worker.read_text('utf-8')
          names=re.findall(r'const CACHE_NAME = "matkvest-iphone-v[0-9]+"',sw)
          if names == ['const CACHE_NAME = "matkvest-iphone-v159"']:
              worker.write_text(sw.replace('matkvest-iphone-v159','matkvest-iphone-v160',1),encoding='utf-8')
          elif names != ['const CACHE_NAME = "matkvest-iphone-v160"']:
              raise SystemExit('ERROR: unexpected PWA cache name')
          PY
          python3 audits/g7_stage12_sync_pwa.py
          python3 audits/g7_stage12_sync_pwa.py --check
          test "$(grep -o '?v=160' index.html | wc -l)" -eq 19
      - name: Commit verified release stamp to PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(v160): refresh 19 Grade 5 URLs and SHA256 PWA [v160-stamped]"
            git push origin HEAD:audit/g5-sequential-paragraph24-v160-20261114
          fi
