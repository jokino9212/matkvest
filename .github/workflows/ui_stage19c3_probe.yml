name: MatKvest UI19C3 - screen inventory and baseline screenshots
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19c3_probe.yml
      - audits/ui_stage19c3_probe.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Explore lessons, shop, account and reports without mutating data
        run: node audits/ui_stage19c3_probe.mjs
      - name: Select baseline captures for independent review
        if: success()
        run: |
          for name in topic1_1280 topic_action_1280 shop_1280 profile_1280 journal_1280 shop_390 topic_action_390 profile_390; do
            base64 -w0 "audits/ui19c3_probe_${name}.png" > "audits/ui19c3_review_${name}.b64.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matkvest-ui19c3-v59-original-all-screens
          path: |
            audits/ui_stage19c3_probe.json
            audits/ui19c3_probe_*.png
          if-no-files-found: warn
      - name: Preserve evidence on audit branch only
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/ui_stage19c3_probe.json audits/ui19c3_review_*.b64.txt
          git diff --cached --quiet || git commit -m "audit(ui19C3): capture baseline lesson and system screens on verified v59"
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
