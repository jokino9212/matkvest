name: Grade 5 sequential textbook audit §4 lines rays plane angles
on:
  push:
    branches:
      - audit/g5-sequential-paragraph04-20261113
    paths:
      - 'g5-textbook-tiers-v124.js'
      - 'g5-textbook-v112.js'
      - 'audits/g5_sequential_paragraph04_browser_oracle.cjs'
      - '.github/workflows/g5-sequential-04.yml'
      - 'sw.js'
  pull_request:
    branches:
      - main
    paths:
      - 'g5-textbook-tiers-v124.js'
      - 'g5-textbook-v112.js'
      - 'audits/g5_sequential_paragraph04_browser_oracle.cjs'
jobs:
  sequential-paragraph04:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Verify syntax of changed sources and independent auditor
        run: |
          node --check g5-textbook-tiers-v124.js
          node --check g5-textbook-v112.js
          node --check audits/g5_sequential_paragraph04_browser_oracle.cjs
      - name: Install pinned browser runtime
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Independent §4 semantics, real question content, and 600 SVG validations
        run: node audits/g5_sequential_paragraph04_browser_oracle.cjs
      - name: Preserve sequential §§1-3 900 questions
        run: node audits/g5_sequential_paragraphs01_03_browser.cjs
      - name: Preserve complete 74 topic and difficulty inventory
        run: node audits/g5_v132_74_real_cognitive_inventory.cjs
      - name: Preserve rational and fraction-input gates
        run: |
          node audits/g5_stage43_factorization_real_math_oracle.cjs
          node audits/g5_stage42_mixed_fraction_oracle.cjs
          node audits/g5_stage39_fraction_independent_oracle.cjs
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
      - name: Preserve previous picture and geometry checks
        run: |
          node audits/g5_stage40_paragraph25_browser_oracle.cjs
          node audits/g5_stage41_fractions_angles_browser_oracle.cjs
