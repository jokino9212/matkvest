name: Grade 5 sequential §18 authentic divisors and multiples
on:
  push:
    branches:
      - audit/g5-sequential-paragraph18-v153-20261114
  pull_request:
    branches:
      - main
    paths:
      - 'g5-textbook-v111.js'
      - 'audits/g5_sequential_paragraph18_browser_oracle.cjs'
      - '.github/workflows/g5-sequential-18.yml'
jobs:
  independent-divisor-math:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check g5-textbook-v111.js
          node --check audits/g5_sequential_paragraph18_browser_oracle.cjs
      - name: Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify 600 visible divisors and multiples questions
        run: node audits/g5_sequential_paragraph18_browser_oracle.cjs
      - name: Regress all sequential paragraphs 1–17
        run: |
          node audits/g5_sequential_paragraphs01_03_browser.cjs
          for f in audits/g5_sequential_paragraph??_browser_oracle.cjs; do node "$f"; done
      - name: Protect all 74 topics
        run: node audits/g5_v132_74_real_cognitive_inventory.cjs
