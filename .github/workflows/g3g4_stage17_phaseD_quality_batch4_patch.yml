name: MatKvest stage17D - quality batch4 gated patch
on:
  push:
    branches: [audit/g3g4-stage17-20261104]
    paths:
      - audits/g3g4_stage17_phaseD_quality_batch4_patch.py
      - audits/g3g4_stage17_phaseD_quality_batch4_test.mjs
      - .github/workflows/g3g4_stage17_phaseD_quality_batch4_patch.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-stage17D-quality-batch4-patch
  cancel-in-progress: false
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g3g4-stage17-20261104
          persist-credentials: true
      - name: Guard approved HTML and SW v46
        run: |
          echo '4a9a597d34dfe8f7f48abb323e99784f7f0b529ceb5275b2bc1b94d64fe0bd7c  index.html' | sha256sum --check
          python3 audits/g7_stage12_sync_pwa.py --check
      - name: Apply targeted numeric reasoning fixes and synchronize PWA v47
        run: |
          python3 audits/g3g4_stage17_phaseD_quality_batch4_patch.py
          python3 audits/g7_stage12_sync_pwa.py --check
          grep -F 'matkvest-iphone-v47' sw.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Independently verify 4500 compare/mass/money models and 9 UI states
        run: node audits/g3g4_stage17_phaseD_quality_batch4_test.mjs
      - name: Prepare past batches and full audits pinned to candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          h=hashlib.sha256(Path('index.html').read_bytes()).hexdigest()
          base='fa4db04c3a53351ed672b12daa577a2ea3bb1376932f13b821e50db95436cd9a'
          for stem in ('g3g4_stage17_phaseD_semantics','g3g4_stage17_phaseD_recovery_theory'):
              source=Path('audits/'+stem+'.mjs').read_text(encoding='utf8')
              if source.count(base)!=1:raise SystemExit('Unexpected candidate pin '+stem)
              source=source.replace(base,h)
              if stem.endswith('_semantics'):source=source.replace('timeout:120000','timeout:120000')
              Path('audits/_batch4_'+stem+'.mjs').write_text(source,encoding='utf8')
          for stage,cache in ((1,44),(2,45),(3,46)):
              source=Path('audits/g3g4_stage17_phaseD_quality_batch'+str(stage)+'_test.mjs').read_text(encoding='utf8')
              name='matkvest-iphone-v'+str(cache)
              if source.count(name)!=1:raise SystemExit('Unexpected previous cache '+name)
              source=source.replace(name,'matkvest-iphone-v47')
              old='g3g4_stage17_phaseD_quality_batch'+str(stage)+'_test_report.json'
              new='g3g4_stage17_phaseD_quality_batch4_previous_batch'+str(stage)+'_report.json'
              if source.count(old)!=1:raise SystemExit('Unexpected old report '+old)
              Path('audits/_batch4_previous_batch'+str(stage)+'.mjs').write_text(source.replace(old,new),encoding='utf8')
          source=Path('audits/g1g2_stage16_phaseD_regression.mjs').read_text(encoding='utf8')
          source=source.replace('g1g2_stage16_phaseD_regression_report.json','g3g4_stage17_phaseD_quality_batch4_crossgrade_report.json')
          Path('audits/_batch4_crossgrade.mjs').write_text(source,encoding='utf8')
          PY
      - name: Regress validated batch1 topics
        run: node audits/_batch4_previous_batch1.mjs
      - name: Regress validated batch2 topics
        run: node audits/_batch4_previous_batch2.mjs
      - name: Regress validated batch3 geometry topics
        run: node audits/_batch4_previous_batch3.mjs
      - name: Full grade 3/4 semantic audit
        run: |
          node audits/_batch4_g3g4_stage17_phaseD_semantics.mjs
          cp audits/g3g4_stage17_phaseD_semantics_report.json audits/g3g4_stage17_phaseD_quality_batch4_semantics_report.json
      - name: Full recovery and mobile theory UI regression
        run: |
          node audits/_batch4_g3g4_stage17_phaseD_recovery_theory.mjs
          cp audits/g3g4_stage17_phaseD_recovery_theory_report.json audits/g3g4_stage17_phaseD_quality_batch4_recovery_report.json
      - name: Crossgrade 1-2, 3, 5, 7, 8 regression
        run: node audits/_batch4_crossgrade.mjs
      - name: Preserve all reports regardless of Gate outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-stage17D-quality-batch4-evidence
          path: |
            audits/g3g4_stage17_phaseD_quality_batch4_patch_report.json
            audits/g3g4_stage17_phaseD_quality_batch4_test_report.json
            audits/g3g4_stage17_phaseD_quality_batch4_previous_batch1_report.json
            audits/g3g4_stage17_phaseD_quality_batch4_previous_batch2_report.json
            audits/g3g4_stage17_phaseD_quality_batch4_previous_batch3_report.json
            audits/g3g4_stage17_phaseD_quality_batch4_semantics_report.json
            audits/g3g4_stage17_phaseD_quality_batch4_recovery_report.json
            audits/g3g4_stage17_phaseD_quality_batch4_crossgrade_report.json
          if-no-files-found: warn
      - name: Commit only all-Gates-passed v47 to audit branch
        if: success()
        run: |
          set -eu
          python3 audits/g7_stage12_sync_pwa.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js audits/g7_stage12_sync_pwa.py
          git add audits/g3g4_stage17_phaseD_quality_batch4_patch_report.json
          git add audits/g3g4_stage17_phaseD_quality_batch4_test_report.json
          git add audits/g3g4_stage17_phaseD_quality_batch4_previous_batch1_report.json
          git add audits/g3g4_stage17_phaseD_quality_batch4_previous_batch2_report.json
          git add audits/g3g4_stage17_phaseD_quality_batch4_previous_batch3_report.json
          git add audits/g3g4_stage17_phaseD_quality_batch4_semantics_report.json
          git add audits/g3g4_stage17_phaseD_quality_batch4_recovery_report.json
          git add audits/g3g4_stage17_phaseD_quality_batch4_crossgrade_report.json
          git commit -m "fix(stage17D): compare, mass and money multi-step reasoning with v47"
          git restore -- audits/g3g4_stage17_phaseD_semantics_report.json audits/g3g4_stage17_phaseD_recovery_theory_report.json
          git pull --rebase origin audit/g3g4-stage17-20261104
          git push origin HEAD:audit/g3g4-stage17-20261104
