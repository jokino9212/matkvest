name: v306 historical runtime verification (read only)
# Full regression 46007637140: all 16 suites and materialize passed.
# Runtime published only to feature/v306-chest-item-types at 5d8f626bf88cce4be6721e7fbedae468acf6ba84.
# Retired one-shot publisher: no materialization, commits or pushes.
on:
  push:
    branches: [feature/v306-chest-item-types]
    paths:
      - .github/workflows/v306-full-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'jokino9212/matkvest' && github.ref == 'refs/heads/feature/v306-chest-item-types'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify published historical runtime without writes
        shell: bash
        run: |
          set -euo pipefail
          published=5d8f626bf88cce4be6721e7fbedae468acf6ba84
          git merge-base --is-ancestor "$published" HEAD
          git show "$published:index.html" | sha256sum | grep -Fx '7e6e2b8de44e1eb4888b34f012288c32e24643eafe9c350fe79e9881935cb318  -'
          git show "$published:sw.js" | grep -Fx 'const CACHE_NAME = "matkvest-iphone-v306";'
          git show "$published:sw.js" | grep -Fx 'const APP_BUILD_HASH = "7e6e2b8de44e1eb4888b34f012288c32e24643eafe9c350fe79e9881935cb318";'
          echo 'PASS: historical v306 runtime; no writes performed'
