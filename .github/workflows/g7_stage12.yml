name: G7 stage 12 diagnostics
on:
  push:
    branches: [audit/g7-stage12-20261104]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 audits/g7_stage12_probe.py
      - run: python3 audits/g7_stage12_source_extract.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g7-stage12-probe
          path: |
            audits/g7_stage12_probe.json
            audits/g7_stage12_source_snippets.txt
