name: Stage25 multi-profile isolation regression
on:
  push:
    branches: [audit/stage25-profile-isolation-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node audits/stage25_profile_isolation_browser.cjs
