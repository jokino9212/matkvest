name: Grade 3 length units audit
on:
  push:
    branches: [audit/g1-g4-content-v195]
    paths: [.github/workflows/g3-length-audit-once.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
