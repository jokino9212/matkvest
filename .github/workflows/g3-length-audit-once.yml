        with:
          fetch-depth: 0
      - name: Prepare Chromium
        run: |
          npm install --no-save --fetch-retries=1 --fetch-timeout=25000 playwright
          if chrome_path="$(command -v google-chrome)"; then
            echo "MATKVEST_CHECK_CHROMIUM=$chrome_path" >> "$GITHUB_ENV"
          else
            npx playwright install --only-shell chromium
          fi
