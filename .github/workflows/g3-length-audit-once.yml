          MATKVEST_PATCH
          git apply --check "$RUNNER_TEMP/g3-length.patch"
          git apply "$RUNNER_TEMP/g3-length.patch"
          cat > .g3-length-check.cjs <<'MATKVEST_CHECK'
          'use strict';

          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const http = require('node:http');
          const path = require('node:path');
          const {chromium} = require('playwright');

          const topic = 'g3:length_units';
          const repository = process.env.MATKVEST_CHECK_REPO || path.join(__dirname, 'matkvest-g3-length');
          const baseline = fs.readFileSync(process.env.MATKVEST_CHECK_BASELINE || path.join(__dirname, 'matkvest-g3-length-before.html'));
          let oldBuild = true;
          const types = {
            '.html': 'text/html; charset=utf-8', '.svg': 'image/svg+xml', '.js': 'text/javascript',
            '.png': 'image/png', '.webp': 'image/webp', '.webmanifest': 'application/manifest+json'
          };
          const server = http.createServer((request, response) => {
            const url = new URL(request.url, 'http://localhost');
            const asset = path.join(repository, url.pathname === '/' ? 'index.html' : decodeURIComponent(url.pathname));
            const html = url.pathname === '/';
            response.setHeader('Cache-Control', 'no-store');
            response.setHeader('Content-Type', types[path.extname(asset)] || 'application/octet-stream');
            try {
              response.end(html && oldBuild ? baseline : fs.readFileSync(asset));
            } catch {
              response.writeHead(404).end();
            }
          });

          function inspectBuild({topic, mode}) {
            function requireThat(condition,message) {
              if(!condition) throw new Error(message);
            }
            const plain=value=>value.replace(/\s+/g,' ').trim();
            const expectedFamilies=[['cm_mm','dm_cm','m_dm','m_cm','km_m'],['combine_length','split_length','compare_lengths'],['sum_lengths','remaining_length']];
            function solve(prompt,labels){
              const round=prompt.match(/^(\d+) (км|дм|см|мм|м) = \? (км|дм|см|мм|м)$/);
              const combine=prompt.match(/^(\d+) (км|дм|см|мм|м) (\d+) (км|дм|см|мм|м) = \? (км|дм|см|мм|м)$/);
              const split=prompt.match(/^Вырази (\d+) (км|дм|см|мм|м) в (\S+) и (\S+)\.$/);
              const compare=prompt.match(/^(\d+) (км|дм|см|мм|м) (\d+) (км|дм|см|мм|м) \? (\d+) (км|дм|см|мм|м)$/);
              const sum=prompt.match(/^Длина первого отрезка (.+)\. Длина второго отрезка (.+)\. Какова общая длина отрезков в (метрах|сантиметрах)\?$/);
              const trip=prompt.match(/^Длина маршрута (.+)\. Путешественник прошёл (.+)\. Сколько метров осталось пройти\?$/);
              const cord=prompt.match(/^Длина шнура (.+)\. Отрезали (.+)\. Сколько сантиметров шнура осталось\?$/);
              const factors={мм:1,см:10,дм:100,м:1000,км:1000000};
              const names={мм:'mm',см:'cm',дм:'dm',м:'m',км:'km'};
              const units={миллиметрах:'мм',сантиметрах:'см',дециметрах:'дм',метрах:'м',километрах:'км'};
              const pair=(major,minor)=>names[major]+'_'+names[minor];
              function mixed(whole,major,rest,minor){
                const scale=factors[major]/factors[minor];
                requireThat(scale>1&&Number(rest)>=1&&Number(rest)<scale,'Invalid mixed units: '+prompt);
                return Number(whole)*scale+Number(rest);
              }
              function result(family,answer,values,unit){
                requireThat(unit?!labels.length:labels.includes(String(answer)),'Missing numeric field or option: '+prompt);
                return {family,answer:String(answer),key:prompt,values,unit};
              }
              if(round){
                const value=Number(round[1]),from=round[2],to=round[3],answer=value*factors[from]/factors[to];
                const reverse=factors[from]<factors[to],whole=Math.min(value,answer);
                requireThat(from!==to&&Number.isInteger(whole)&&whole>=1&&whole<=15,'Invalid round conversion');
                return result(reverse?pair(to,from):pair(from,to),answer,[reverse?'reverse':'forward','whole:'+whole],to);
              }
              if(combine){
                requireThat(combine[4]===combine[5],'Mismatched target: '+prompt);
                return result('combine_length',mixed(...combine.slice(1,5)),[pair(combine[2],combine[4]),'rest:'+combine[3]],combine[4]);
              }
              if(split){
                const total=Number(split[1]),minor=split[2],major=units[split[3]],scale=factors[major]/factors[minor];
                const whole=Math.floor(total/scale),rest=total%scale;
                requireThat(minor===units[split[4]]&&whole>=1&&rest>=1,'Invalid decomposition');
                const decoded=labels.map(label=>{
                  const parts=label.match(/^(?:(\d+) (км|дм|см|мм|м) )?(\d+) (км|дм|см|мм|м)$/);
                  requireThat(parts&&parts[4]===minor&&(!parts[2]||parts[2]===major),'Invalid decomposition choice: '+label);
                  return mixed(parts[1]||0,parts[2]||major,parts[3],parts[4]);
                });
                requireThat(decoded.length===4&&new Set(decoded).size===4&&decoded.includes(total),'Ambiguous decomposition');
                return result('split_length',whole+' '+major+' '+rest+' '+minor,[pair(major,minor),'rest:'+rest]);
              }
              if(compare){
                const a=mixed(...compare.slice(1,5)),b=Number(compare[5]),sign=a<b?'<':a===b?'=':'>';
                requireThat(compare[4]===compare[6]&&b>0&&labels.length===3&&['<','=','>'].every(s=>labels.includes(s)),'Malformed comparison');
                return result('compare_lengths',sign,[pair(compare[2],compare[4]),'sign:'+sign]);
              }
              const statement=sum||trip||cord;
              requireThat(statement,'Unknown question: '+prompt);
              const unit=sum?units[sum[3]]:trip?'м':'см',major=unit==='м'?'км':'м',scale=factors[major]/factors[unit];
              function parseLength(text){
                const parts=text.match(/^(\d+) (м|км) (\d+) (м|см)$/);
                requireThat(parts&&parts[2]===major&&parts[4]===unit,'Invalid length: '+text);
                return mixed(...parts.slice(1));
              }
              const a=parseLength(statement[1]),b=parseLength(statement[2]),answer=sum?a+b:a-b;
              const boundary=sum?(a%scale+b%scale>=scale?'carry':'no_carry'):(a%scale<b%scale?'borrow':'no_borrow');
              requireThat(answer>0,'Non-positive length');
              return result(sum?'sum_lengths':'remaining_length',answer,[unit,boundary],unit);
            }

            function submit(panel, answer) {
              const field=panel.querySelector('#quizInput');
              if(field){
                field.value=answer;
                field.dispatchEvent(new Event('input',{bubbles:true}));
                panel.querySelector('#quizCheck').click();
                return;
              }
              const button=[...panel.querySelectorAll('button.answer')].find(option=>plain(option.textContent)===answer);
              requireThat(button,'Independently solved option missing from the screen');
              button.click();
            }

            function seedRandom(value) {
              Math.random = () => ((value = (Math.imul(value, 1664525) + 1013904223) >>> 0) / 4294967296);
            }
            function siblingQuestions() {
              seedRandom(19503);
              return g3AllTopics().filter(t=>t.id!==topic&&t.implemented!==false).flatMap(t => [0,1,2].flatMap(level =>
                Array.from({length:12}, () => makeG3Question(t.id, level))));
            }

            if (mode === 'baseline') {
              const siblings = siblingQuestions();
              seedRandom(195);
              for (const level of [0,1]) {
                openG3Topic(topic);
                document.querySelectorAll('#modal .stage-card')[level].click();
                for (let i=0; i<STAGES[level].count; i++) {
                  submit(document.querySelector('#qstage'),q.ans);
                  document.querySelector('#quizNext').click();
                }
              }
              const stored = deepCopy(progressFor(topic));
              requireThat(JSON.stringify(stored.best) === '[5,7,0]' && JSON.stringify(stored.bonus) === '[true,true,false]', 'Baseline did not produce saved progress');
              return {siblings, stored, historyIds:state.attemptHistory.map(attempt=>attempt.id)};
            }

            const otherTopics = siblingQuestions();
            seedRandom(19601);
            const holder = document.createElement('div');
            const seen = expectedFamilies.map(() => new Set());
            const coverage=expectedFamilies.map(()=>new Map());
            const stories = expectedFamilies.map(()=>new Set());
            let generated=0, accepted=0, completed=0, rejected=0, entered=0, selected=0;
            for (const level of [0,1,2]) {
              for (let i=0; i<3200; i++) {
                const question = makeG3Question(topic, level);
                holder.innerHTML = '<div>' + question.text + '</div>' + quizVisualHtml(question);
                const prompt = plain(holder.firstElementChild.textContent);
                const labels = question.choices.map(option=>option.label);
                const task = solve(prompt, labels);
                requireThat(task.answer === String(question.ans) && (question.answerMode==='number' ? labels.length===0 : labels.filter(label=>label===task.answer).length===1), 'Generated answer disagrees with an independent solution');
                requireThat(expectedFamilies[level].includes(task.family) && question.audit.variant===task.family && (question.answerMode==='number')===Boolean(task.unit) && (question.unitSuffix||'')===(task.unit||''), 'Unexpected task on level ' + level);
                seen[level].add(task.family);
                stories[level].add(task.key);
                const values=coverage[level].get(task.family)||new Set();
                task.values.forEach(value=>values.add(value));
                coverage[level].set(task.family,values);
                generated++;
              }
              requireThat(seen[level].size===expectedFamilies[level].length, 'Insufficient coverage of the level');
              for (let run=0; run<6; run++) {
                openG3Topic(topic);
                const stages = [...document.querySelectorAll('#modal .stage-card')];
                for (const stage of stages) {
                  const rect=stage.getBoundingClientRect();
                  requireThat(rect.width>0 && rect.left>=-1 && rect.right<=innerWidth+1,'Stage card overflow');
                }
                const stage=stages[level];
                requireThat(!stage.disabled, 'Level not unlocked');
                stage.click();
                const keys=new Set(), methods=new Set(), unitsByMethod=new Map();
                for (let i=0; i<STAGES[level].count; i++) {
                  const panel=document.querySelector('#qstage');
                  const choices=[...panel.querySelectorAll('button.answer')];
                  const labels=choices.map(button=>plain(button.textContent));
                  const task=solve(plain(panel.querySelector('.quizq').textContent),labels);
                  if (task.unit) {
                    requireThat(plain(panel.querySelector('.quiz-input-suffix').textContent)===task.unit,'Wrong unit near the answer field');
                    const hint=plain(panel.querySelector('.quiz-input-hint').textContent);
                    requireThat(/Введи целое число|Введите только число/.test(hint)&&!/дробь/.test(hint),'Wrong integer input hint');
                  }
                  requireThat(expectedFamilies[level].includes(task.family) && !keys.has(task.key), 'Bad level or repetition inside an attempt');
                  keys.add(task.key);
                  methods.add(task.family);
                  const units=unitsByMethod.get(task.family)||new Set();
                  task.values.filter(value=>value==='м'||value==='см').forEach(value=>units.add(value));
                  unitsByMethod.set(task.family,units);
                  for (const element of panel.querySelectorAll('button.answer, #quizInput')) {
                    const rect=element.getBoundingClientRect();
                    requireThat(rect.width>0 && rect.left>=-1 && rect.right<=innerWidth+1, 'Question overflowing viewport');
                  }
                  if (run===0 && i===0) {
                    const wrong=labels.length ? labels.find(label=>label!==task.answer) : String((Number(task.answer)+1)%1001);
                    submit(panel,wrong);
                    requireThat(blockSession.correct===i && blockSession.done===i && /Пока неверно/.test(document.querySelector('#qfb').textContent), 'Wrong answer was not rejected');
                    rejected++;
                  }
                  submit(panel,task.answer);
                  if(labels.length)selected++;else entered++;
                  const item=blockSession.items.at(-1);
                  const expectedScore=i+1-(run===0?1:0);
                  requireThat(blockSession.correct===expectedScore && blockSession.done===i+1 &&
                    item.finalCorrect && item.firstTry===!(run===0 && i===0), 'Answer handling differed from the level scoring rules: '+task.key);
                  accepted++;
                  const next=document.querySelector('#quizNext');
                  if (i+1===STAGES[level].count) requireThat(/Посмотреть результат/.test(next.textContent), 'Result button is missing');
                  next.click();
                }
                requireThat(methods.size===expectedFamilies[level].length, 'An attempt missed an action');
                if (level===2) requireThat([...unitsByMethod.values()].every(units=>units.size===2),'An attempt missed one pair of length units');
                const expectedBest=STAGES[level].count-(level===2 && run===0?1:0);
                requireThat(progressFor(topic).best[level]===expectedBest && progressFor(topic).bonus[level], 'Progress not saved');
                completed++;
              }
            }
            const mixedPairs=['cm_mm','dm_cm','m_dm','m_cm','km_m'];
            const requiredExamples=[
              Object.fromEntries(mixedPairs.map(pair=>[pair,['forward','reverse','whole:1','whole:15']])),
              {combine_length:[...mixedPairs,'rest:1','rest:999'],split_length:[...mixedPairs,'rest:1','rest:999'],compare_lengths:[...mixedPairs,'sign:<','sign:=','sign:>']},
              {sum_lengths:['carry','no_carry','м','см'],remaining_length:['borrow','no_borrow','м','см']}
            ];
            for(const [level,families] of Object.entries(requiredExamples)){
              for(const [family,examples] of Object.entries(families)){
                requireThat(examples.every(value=>coverage[level].get(family)?.has(value)),'Missing edge cases for '+family+': '+examples.filter(value=>!coverage[level].get(family)?.has(value)));
              }
            }
            const cases=Object.fromEntries(coverage.flatMap(level=>[...level].map(([family,values])=>[family,values.size])));
            const overlaps=[[0,1],[0,2],[1,2]].map(([a,b])=>[...stories[a]].filter(key=>stories[b].has(key)).length);
            requireThat(overlaps.every(count=>count===0), 'Same prompt exists on more than one level');
            return {otherTopics, generated, accepted, entered, selected, completed, rejected, cases, overlaps, familyByLevel:seen.map(level=>[...level].sort()), progress:deepCopy(progressFor(topic))};
          }

          (async () => {
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
            const address = 'http://127.0.0.1:' + server.address().port;
            let browser;
            try {
              browser=await chromium.launch({headless:true,executablePath:process.env.MATKVEST_CHECK_CHROMIUM});
              for (const width of [320,390,1280]) {
                const context=await browser.newContext({viewport:{width,height:850},isMobile:width<500,hasTouch:width<500,serviceWorkers:'block'});
                try {
                  const page=await context.newPage();
                  const errors=[];
                  page.on('pageerror',error=>errors.push(error.message));
                  oldBuild=true;
                  await page.goto(address);
                  await page.locator('button[onclick="openGrade(3)"]').click();
                  const card=page.locator('button.topic').filter({has:page.locator('strong').filter({hasText:'Длина: мм, см, дм, м, км'})});
                  await card.click();
                  assert.equal(await page.locator('#modal .stage-card:disabled').count(),2);
                  const old=await page.evaluate(inspectBuild,{topic,mode:'baseline'});
                  oldBuild=false;
                  await page.reload();
                  assert.deepEqual(await page.evaluate(key=>({stored:progressFor(key),historyIds:state.attemptHistory.map(attempt=>attempt.id)}),topic),{stored:old.stored,historyIds:old.historyIds});
                  const stagePicker = page.locator('#modal .stage-card').first();
                  if (!(await stagePicker.isVisible())) {
                    if (!(await card.isVisible())) await page.locator('button[onclick="openGrade(3)"]').click({timeout:8000});
                    await card.click({timeout:8000});
                  }
                  assert.match(await page.locator('#modal h2').textContent(), /Длина: мм, см, дм, м, км/);
                  assert.equal(await page.locator('#modal .stage-card:disabled').count(),0);
                  assert.match(await page.locator('#modal .g3-theory').textContent(), /1 км 499 м/);

                  assert.match(await page.locator('#modal .stage-card').nth(2).textContent(), /Вырази длины в одинаковых единицах/);
                  const {otherTopics,...result}=await page.evaluate(inspectBuild,{topic,mode:'candidate'});
                  assert.deepEqual(otherTopics,old.siblings);
                  const savedHistory = await page.evaluate(key=>state.attemptHistory.filter(row=>row.key===key).map(row=>row.id),topic);
                  assert.equal(savedHistory.length,20);
                  await page.reload();
                  assert.deepEqual(await page.evaluate(key=>progressFor(key),topic),{best:[5,7,10],bonus:[true,true,true]});
                  assert.deepEqual(await page.evaluate(key=>state.attemptHistory.filter(row=>row.key===key).map(row=>row.id),topic),savedHistory);
                  assert(old.historyIds.every(id=>savedHistory.includes(id)));
                  assert.match(await page.locator('#modal .subtle').filter({hasText:'Пройдено этапов'}).last().textContent(),/3\/3/);
                  assert.deepEqual(errors,[]);
                  console.log(JSON.stringify({width,siblingSamples:otherTopics.length,oldProgress:old.stored,oldHistory:old.historyIds.length,savedAttempts:savedHistory.length,...result}));
                } finally {
                  await context.close();
                }
              }
            } finally {
              await browser?.close();
              server.close();
            }
          })().catch(error=>{console.error(error);process.exitCode=1;});
          MATKVEST_CHECK
          MATKVEST_CHECK_REPO="$PWD" MATKVEST_CHECK_BASELINE="$RUNNER_TEMP/g3-length-before.html" node .g3-length-check.cjs
