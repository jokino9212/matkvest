name: Test-only v286 pre-change stale sale modal close reproduction
on:
  push:
    branches: [refactor/route-vue-actions-from-7c14ce9]
    paths: ['.github/workflows/v286-sale-preflight.yml','audits/legacy_sale_v286_preflight.cjs']
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'jokino9212/matkvest' && github.ref == 'refs/heads/refactor/route-vue-actions-from-7c14ce9'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node audits/legacy_sale_v286_preflight.cjs
