name: Test-only analytics grade and knowledge Vue actions PWA v277 gate
on:
  push:
    branches: [refactor/route-vue-actions-from-7c14ce9]
    paths:
      - '.github/workflows/legacy-analytics-v277-gate.yml'
      - 'assets/ui/legacy-vue-actions.js'
      - 'audits/legacy_analytics_view_v277_patch.py'
      - 'audits/legacy_analytics_view_v277_publish.py'
      - 'audits/legacy_analytics_view_v277.test.cjs'
      - 'audits/legacy_analytics_view_v277_browser.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: analytics-v277-test-branch
  cancel-in-progress: false
jobs:
  integrate-test-publish:
    if: github.repository == 'jokino9212/matkvest' && github.ref == 'refs/heads/refactor/route-vue-actions-from-7c14ce9'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/route-vue-actions-from-7c14ce9
          persist-credentials: true
      - name: Apply SHA-locked v276 to v277 analytics action patch
        run: python3 audits/legacy_analytics_view_v277_patch.py
      - name: Synchronize PWA and check Python syntax
        run: |
          python3 audits/g7_stage12_sync_pwa.py
          python3 audits/g7_stage12_sync_pwa.py --check
          python3 -m py_compile audits/legacy_analytics_view_v277_patch.py audits/legacy_analytics_view_v277_publish.py
      - name: Install deterministic browser and dependencies
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Route and Vue action contracts v271 to v277
        run: |
          node audits/legacy_navigation_core.test.cjs
          node audits/legacy_vue_actions_v271.test.cjs
          node audits/legacy_training_plan_v272.test.cjs
          node audits/legacy_school_actions_v273.test.cjs
          node audits/legacy_school_column_v274.test.cjs
          node audits/legacy_school_frame_journal_v275.test.cjs
          node audits/legacy_reports_teacher_v276.test.cjs
          node audits/legacy_analytics_view_v277.test.cjs
      - name: Deterministic unchanged Vue build
        run: |
          before=$(sha256sum assets/ui/knowledge-map.js | cut -d ' ' -f1)
          npm run build:knowledge-map
          after=$(sha256sum assets/ui/knowledge-map.js | cut -d ' ' -f1)
          test "$before" = "$after"
      - name: Grade/knowledge/detail route guards, keyboard and fallback plus offline F5
        run: node audits/legacy_analytics_view_v277_browser.cjs
      - name: Existing routes, school exercises, plans, journal and teacher report regression
        run: |
          sed -e 's/v271/v277/g' -e 's/V271/V277/g' audits/legacy_vue_actions_v271_browser.cjs > audits/legacy_vue_actions_v277_route_browser.cjs
          sed -e 's/v272/v277/g' -e 's/V272/V277/g' audits/legacy_training_plan_v272_browser.cjs > audits/legacy_training_plan_v277_browser.cjs
          sed -e 's/v273/v277/g' -e 's/V273/V277/g' audits/legacy_school_actions_v273_browser.cjs > audits/legacy_school_actions_v277_browser.cjs
          sed -e 's/v274/v277/g' -e 's/V274/V277/g' audits/legacy_school_column_v274_browser.cjs > audits/legacy_school_column_v277_browser.cjs
          sed -e 's/v275/v277/g' -e 's/V275/V277/g' audits/legacy_school_frame_journal_v275_browser.cjs > audits/legacy_school_frame_journal_v277_browser.cjs
          sed -e 's/v276/v277/g' -e 's/V276/V277/g' audits/legacy_reports_teacher_v276_browser.cjs > audits/legacy_reports_teacher_v277_browser.cjs
          node audits/legacy_vue_actions_v277_route_browser.cjs
          node audits/legacy_training_plan_v277_browser.cjs
          node audits/legacy_school_actions_v277_browser.cjs
          node audits/legacy_school_column_v277_browser.cjs
          node audits/legacy_school_frame_journal_v277_browser.cjs
          node audits/legacy_reports_teacher_v277_browser.cjs
      - name: Full PWA v276 to v277 refresh and offline mobile responsive
        run: |
          node audits/pwa_verified_refresh_browser.cjs
          node audits/stage28_offline_pwa_browser.cjs
      - name: Verify final PWA hash and worker cache
        run: python3 audits/g7_stage12_sync_pwa.py --check
      - name: Publish only verified v277 HTML and SW to test branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 audits/legacy_analytics_view_v277_publish.py
