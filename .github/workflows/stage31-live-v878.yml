name: Stage31 verify live Pages v8.78 and collection media
on:
  push:
    branches: [audit/stage31-live-v878-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node audits/stage31_live_v878_browser.cjs
