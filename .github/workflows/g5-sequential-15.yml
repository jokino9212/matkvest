name: Grade 5 sequential textbook audit §15 symbolic simplification
on:
  push:
    branches:
      - audit/g5-sequential-paragraph15-v150-20261114
  pull_request:
    branches:
      - main
    paths:
      - 'g5-textbook-tiers-v124.js'
      - 'audits/g5_sequential_paragraph15_browser_oracle.cjs'
      - '.github/workflows/g5-sequential-15.yml'
jobs:
  paragraph15-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check g5-textbook-tiers-v124.js
          node --check audits/g5_sequential_paragraph15_browser_oracle.cjs
      - name: Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Independent symbolic mathematics and difficulty for 1200 live tasks
        run: node audits/g5_sequential_paragraph15_browser_oracle.cjs
      - name: Regression sequential paragraphs 1-14
        run: |
          node audits/g5_sequential_paragraphs01_03_browser.cjs
          for n in 04 05 06 07 08 09 10 11 12 13 14; do node "audits/g5_sequential_paragraph${n}_browser_oracle.cjs"; done
