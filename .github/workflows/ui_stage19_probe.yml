name: MatKvest UI Stage19 - inspect cards and navigation
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19_probe.yml
      - audits/ui_stage19_probe.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Inspect grade/topic cards and CSS interaction model in Chromium
        run: node audits/ui_stage19_probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matkvest-stage19-ui-card-navigation-inventory
          path: audits/ui_stage19_probe.json
          if-no-files-found: warn
      - name: Save diagnostic in audit branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/ui_stage19_probe.json
          git diff --cached --quiet || (git commit -m "audit(ui19): inspect grade cards and controls on desktop/mobile" && git pull --rebase origin audit/ui-stage19-20261106 && git push origin HEAD:audit/ui-stage19-20261106)
