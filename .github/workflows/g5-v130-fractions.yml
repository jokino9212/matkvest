name: Grade 5 real fraction word, part and division tasks v130
on:
  push:
    branches: [fix/g5-remaining-fraction-applications-v130-20261113]
    paths:
      - g5-fraction-applications-v130.js
      - audits/g5_v130_activate.py
      - audits/g5_v130_live_fraction_oracle_browser.cjs
      - .github/workflows/g5-v130-fractions.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  real-frac-application-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Activate v130 and versioned PWA
        run: python3 audits/g5_v130_activate.py
      - name: Validate syntax
        run: |
          node --check g5-fraction-applications-v130.js
          node --check audits/g5_v130_live_fraction_oracle_browser.cjs
          python3 -m py_compile audits/g5_v130_activate.py
      - name: Install pinned browser
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Real learner questions and independent mathematical oracle
        run: node audits/g5_v130_live_fraction_oracle_browser.cjs
      - name: Preserve mixed fraction entry and existing conversion UX
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
      - name: Commit tested HTML and worker
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(g5): enable five fraction application topics v130"
            git fetch origin fix/g5-remaining-fraction-applications-v130-20261113
            git rebase origin/fix/g5-remaining-fraction-applications-v130-20261113
            git push origin HEAD:fix/g5-remaining-fraction-applications-v130-20261113
          fi
