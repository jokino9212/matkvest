name: Grade 5 single search and quick menu collapse v119
on:
  push:
    branches: [fix/g5-single-search-collapse-v119-20261113]
    paths:
      - g5-textbook-navigation-v119.js
      - audits/g5_v119_patch.py
      - audits/g5_v119_single_search_browser.cjs
      - .github/workflows/g5-v119-search-collapse.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  grade5-search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Activate unified search and PWA v119
        run: python3 audits/g5_v119_patch.py
      - name: Check JavaScript and Python syntax
        run: |
          node --check g5-textbook-navigation-v119.js
          node --check audits/g5_v119_single_search_browser.cjs
          python3 -m py_compile audits/g5_v119_patch.py
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Check one search, collapse/restore, cards and textbook on four widths
        run: node audits/g5_v119_single_search_browser.cjs
      - name: Recheck textbook UX compatibility and all 51 paragraphs
        run: |
          sed -e 's/v118/v119/g' -e 's/118/119/g' audits/g5_v118_menu_browser.cjs > audits/g5_v119_v118_runtime.cjs
          node audits/g5_v119_v118_runtime.cjs
          sed 's/g5-textbook-navigation-v117.js/g5-textbook-navigation-v119.js/g' audits/g5_v117_navigation_browser.cjs > audits/g5_v119_v117_runtime.cjs
          node audits/g5_v119_v117_runtime.cjs
      - name: Run fraction input regression
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
      - name: Commit release HTML and PWA only after successful checks
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(g5): publish single-search menu v119 on branch"
            git fetch origin fix/g5-single-search-collapse-v119-20261113
            git rebase origin/fix/g5-single-search-collapse-v119-20261113
            git push origin HEAD:fix/g5-single-search-collapse-v119-20261113
          fi
