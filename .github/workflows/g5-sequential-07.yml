name: Grade 5 sequential textbook audit §7 real graduated bar charts
on:
  push:
    branches:
      - audit/g5-sequential-paragraph07-charts-20261113
    paths:
      - 'g5-arithmetic-tiers-v123.js'
      - 'g5-textbook-v111.js'
      - 'audits/g5_sequential_paragraph07_browser_oracle.cjs'
      - '.github/workflows/g5-sequential-07.yml'
      - 'sw.js'
  pull_request:
    branches:
      - main
    paths:
      - 'g5-arithmetic-tiers-v123.js'
      - 'g5-textbook-v111.js'
      - 'audits/g5_sequential_paragraph07_browser_oracle.cjs'
jobs:
  grade5-sequential-07:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Check edited Javascript and browser auditor syntax
        run: |
          node --check g5-arithmetic-tiers-v123.js
          node --check g5-textbook-v111.js
          node --check audits/g5_sequential_paragraph07_browser_oracle.cjs
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Independently test 600 actual math questions and proportional bar heights
        run: node audits/g5_sequential_paragraph07_browser_oracle.cjs
      - name: Keep first six textbook paragraphs verified
        run: |
          node audits/g5_sequential_paragraphs01_03_browser.cjs
          node audits/g5_sequential_paragraph04_browser_oracle.cjs
          node audits/g5_sequential_paragraph05_browser_oracle.cjs
          node audits/g5_sequential_paragraph06_browser_oracle.cjs
      - name: Keep 74 Grade 5 topics and 1110 learning families
        run: node audits/g5_v132_74_real_cognitive_inventory.cjs
      - name: Keep independent rational arithmetic and graphic geometry
        run: |
          node audits/g5_stage43_factorization_real_math_oracle.cjs
          node audits/g5_stage42_mixed_fraction_oracle.cjs
          node audits/g5_stage41_fractions_angles_browser_oracle.cjs
          node audits/g5_stage40_paragraph25_browser_oracle.cjs
          node audits/g5_stage39_fraction_independent_oracle.cjs
      - name: Keep fraction conversion inputs and scoring
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
