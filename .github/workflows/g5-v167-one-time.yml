name: One-time Grade 5 paragraph 31 v167 PWA activation
on:
  push:
    branches:
      - audit/g5-paragraph31-20261115
    paths:
      - '.github/workflows/g5-v167-one-time.yml'
permissions:
  contents: write
jobs:
  apply-v167:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Activate all 19 Grade 5 script versions and worker
        run: |
          python3 audits/g5_v167_activate.py
          python3 audits/g5_v167_activate.py --check
          grep -q 'const CACHE_NAME = "matkvest-iphone-v167";' sw.js
          if grep -q -E 'src="g5-[^"]+\?v=166"' index.html; then
            echo "Stale v166 Grade 5 script URLs" >&2
            exit 1
          fi
      - name: Commit versioned HTML and safe Service Worker fingerprint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo 'v167 already activated'
          else
            git commit -m 'Release v167: all 19 Grade 5 scripts and updated PWA cache'
            git push origin HEAD:audit/g5-paragraph31-20261115
          fi
