name: Grade 3 off-table multiplication audit and patch
on:
  push:
    branches: [audit/g1-g4-content-v195]
    paths:
      - .github/workflows/g3-offtable-multiplication-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped source patch
        run: python3 audits/g3_offtable_multiply_patch.py
      - name: Prepare browser
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Independently validate 9450 generated problems across three screen widths
        run: node audits/g3_offtable_multiply_browser.cjs
      - name: Commit only after verification succeeds
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'Improve Grade 3 off-table multiplication exercises (verified)'
          git push origin HEAD:audit/g1-g4-content-v195
