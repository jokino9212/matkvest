name: Grade 5 sequential textbook audit §5 coordinate ray and graduated scales
on:
  push:
    branches:
      - audit/g5-sequential-paragraph05-scaled-axis-20261113
    paths:
      - 'g5-natural-units-v125.js'
      - 'g5-textbook-v112.js'
      - 'audits/g5_sequential_paragraph05_browser_oracle.cjs'
      - '.github/workflows/g5-sequential-05.yml'
      - 'sw.js'
  pull_request:
    branches:
      - main
    paths:
      - 'g5-natural-units-v125.js'
      - 'g5-textbook-v112.js'
      - 'audits/g5_sequential_paragraph05_browser_oracle.cjs'
jobs:
  sequential-paragraph05:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Check changed JS and independent oracle syntax
        run: |
          node --check g5-natural-units-v125.js
          node --check g5-textbook-v112.js
          node --check audits/g5_sequential_paragraph05_browser_oracle.cjs
      - name: Install pinned browser
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Validate 560 coordinate rays and 40 instrument scales in 600 real questions
        run: node audits/g5_sequential_paragraph05_browser_oracle.cjs
      - name: Preserve sequential paragraphs 1 through 4
        run: |
          node audits/g5_sequential_paragraphs01_03_browser.cjs
          node audits/g5_sequential_paragraph04_browser_oracle.cjs
      - name: Preserve all 74 Grade 5 topics and progression
        run: node audits/g5_v132_74_real_cognitive_inventory.cjs
      - name: Preserve exact fractions and visual semantics
        run: |
          node audits/g5_stage43_factorization_real_math_oracle.cjs
          node audits/g5_stage42_mixed_fraction_oracle.cjs
          node audits/g5_stage41_fractions_angles_browser_oracle.cjs
          node audits/g5_stage40_paragraph25_browser_oracle.cjs
          node audits/g5_stage39_fraction_independent_oracle.cjs
      - name: Preserve fraction answer UI
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
