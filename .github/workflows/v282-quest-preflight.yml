name: Test-only v282 pre-fix detached quest back reproduction
on:
  push:
    branches: [refactor/route-vue-actions-from-7c14ce9]
    paths: ['.github/workflows/v282-quest-preflight.yml']
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'jokino9212/matkvest' && github.ref == 'refs/heads/refactor/route-vue-actions-from-7c14ce9'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node audits/legacy_quest_v282_preflight.cjs
