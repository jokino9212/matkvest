name: Grade 5 sequential textbook audit §10 numeric and literal expressions
on:
  push:
    branches:
      - audit/g5-sequential-paragraph10-expressions-20261113
    paths:
      - 'g5-arithmetic-tiers-v123.js'
      - 'g5-textbook-core.js'
      - 'audits/g5_sequential_paragraph10_browser_oracle.cjs'
      - '.github/workflows/g5-sequential-10.yml'
      - 'sw.js'
  pull_request:
    branches:
      - main
    paths:
      - 'g5-arithmetic-tiers-v123.js'
      - 'g5-textbook-core.js'
      - 'audits/g5_sequential_paragraph10_browser_oracle.cjs'
jobs:
  sequential-paragraph10:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Verify JS syntax and exact symbolic auditor
        run: |
          node --check g5-arithmetic-tiers-v123.js
          node --check g5-textbook-core.js
          node --check audits/g5_sequential_paragraph10_browser_oracle.cjs
      - name: Install pinned browser runtime
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Independently verify 600 actual expression questions and 160 symbolic choices
        run: node audits/g5_sequential_paragraph10_browser_oracle.cjs
      - name: Regression previously completed Grade 5 paragraphs §1 through §9
        run: |
          node audits/g5_sequential_paragraphs01_03_browser.cjs
          node audits/g5_sequential_paragraph04_browser_oracle.cjs
          node audits/g5_sequential_paragraph05_browser_oracle.cjs
          node audits/g5_sequential_paragraph06_browser_oracle.cjs
          node audits/g5_sequential_paragraph07_browser_oracle.cjs
          node audits/g5_sequential_paragraph08_browser_oracle.cjs
          node audits/g5_sequential_paragraph09_browser_oracle.cjs
      - name: Preserve 74 Grade 5 topics and 1110 cognitive families
        run: node audits/g5_v132_74_real_cognitive_inventory.cjs
      - name: Preserve exact mathematics and visual fraction geometry
        run: |
          node audits/g5_stage43_factorization_real_math_oracle.cjs
          node audits/g5_stage42_mixed_fraction_oracle.cjs
          node audits/g5_stage41_fractions_angles_browser_oracle.cjs
          node audits/g5_stage40_paragraph25_browser_oracle.cjs
          node audits/g5_stage39_fraction_independent_oracle.cjs
      - name: Preserve real mixed-fraction answer entry
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
