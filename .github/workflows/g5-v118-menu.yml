name: Grade 5 clean textbook navigation v118
on:
  push:
    branches: [fix/g5-textbook-menu-v118-20261113]
    paths:
      - g5-textbook-navigation-v118.js
      - audits/g5_v118_patch.py
      - audits/g5_v118_menu_browser.cjs
      - .github/workflows/g5-v118-menu.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  menu-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Activate redesigned textbook menu, upgrade PWA version
        run: python3 audits/g5_v118_patch.py
      - name: Check JavaScript and Python syntax
        run: |
          node --check g5-textbook-navigation-v118.js
          node --check audits/g5_v118_menu_browser.cjs
          python3 -m py_compile audits/g5_v118_patch.py
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Check menu, text, clickable rows and search on four screens
        run: node audits/g5_v118_menu_browser.cjs
      - name: Regression of existing 51-paragraph textbook navigation
        run: |
          sed 's/g5-textbook-navigation-v117.js/g5-textbook-navigation-v118.js/g' audits/g5_v117_navigation_browser.cjs > audits/g5_v118_v117_runtime.cjs
          node audits/g5_v118_v117_runtime.cjs
      - name: Regression of fractions and keyboard navigation
        run: |
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
      - name: Commit only tested HTML and PWA
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(g5): activate compact textbook menu v118"
            git fetch origin fix/g5-textbook-menu-v118-20261113
            git rebase origin/fix/g5-textbook-menu-v118-20261113
            git push origin HEAD:fix/g5-textbook-menu-v118-20261113
          fi
