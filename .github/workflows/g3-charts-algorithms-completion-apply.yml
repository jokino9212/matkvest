name: Apply verified Grade 3 chart and algorithms audit
on:
  push:
    branches: [audit/g1-g4-content-v195]
    paths: [.github/workflows/g3-charts-algorithms-completion-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply the verified audit patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f718ab41b17af56bf0f33d9b7c66b35157cac882"
          patch_file="$RUNNER_TEMP/matkvest.patch"
          cat > "$patch_file" <<'MATKVEST_PATCH'
          diff --git a/audits/g1_g4_content_audit_2026-11-17.md b/audits/g1_g4_content_audit_2026-11-17.md
          index 805df49..6b81930 100644
          --- a/audits/g1_g4_content_audit_2026-11-17.md
          +++ b/audits/g1_g4_content_audit_2026-11-17.md
          @@ -1721 +1721,26 @@
           - На всех уровнях правильные значения написаны над столбцами. По вертикальной шкале считывать ничего не требуется. На узком экране мелкие подписи шкалы дополнительно затрудняют её использование.
          +
          +**После правок.** На разминке значения подписаны. На тренировке ученик работает с суммой и разностью, считывая шкалу с шагом 2. Мастер использует шкалу с шагом 5 и задачи на итог, совпадение и крайние значения. Подписи шкалы в диаграммах 3-го класса увеличены.
          +
          +- В Chromium проверены 9 600 задач. Независимо сопоставлены высоты столбцов, деления и названия. На тренировке и мастере значения определяются по шкале. На 320 px проверен фактический размер подписей.
          +- На 320, 390 и 1280 px пройдены 12 попыток с 81 правильным ответом. После F5 остались очки и награды. На 390 px на каждом уровне восстановился второй вопрос.
          +
          +Следующая тема 3-го класса — «Алгоритмы, последовательности и простые логические задачи» (`g3:algorithms_logic`).
          +
          +### 2026-11-19. Алгоритмы, последовательности и простые логические задачи (`g3:algorithms_logic`)
          +
          +**До правок.** В Chromium проверено по 1 200 задач на уровень (зерно 19502).
          +
          +- Между уровнями совпало 58, 41 и 118 уникальных условий. Диапазоны числа команд пересекаются, наборы последовательностей тренировки и мастера одинаковы.
          +- В логических задачах сравнения уже расположены в порядке ответа и имена после сравнительной конструкции стоят в неверном падеже. На мастере мало задач, где нужно найти промежуточное место или восстановить исходное число.
          +
          +**После правок.** Длина прямых алгоритмов увеличивается от одного-двух действий до трёх. Мастер восстанавливает исходное число за четыре обратных действия. У последовательностей разные правила по уровням. В логических задачах сравнения перемешаны, имена согласованы, на мастере требуется найти промежуточное место. Все три типа входят в одну попытку.
          +
          +- В Chromium независимо проверены 9 600 задач. Из видимых команд и условий пересчитаны результаты алгоритмов и последовательностей. Для каждой логической задачи перебором подтверждён единственный порядок. Между уровнями нет совпадений.
          +- На 320, 390 и 1280 px пройдены 12 попыток и введён 81 правильный ответ. F5 сохраняет результаты, награды и историю. На 390 px подтверждено возобновление второго вопроса на каждом уровне.
          +
          +### 2026-11-19. Итог последовательного аудита 3-го класса
          +
          +- Работа продолжена с темы №29 и доведена до темы №48 включительно. Проверены 20 тем и 60 уровней. В журнале есть записи по всем 48 темам каталога 3-го класса.
          +- Независимо сверены 192 000 сгенерированных заданий, по 3 200 на уровень каждой из 20 тем. В Chromium завершены 240 попыток на ширинах 320, 390 и 1280 px. На 390 px по кнопке «Продолжить» после F5 восстановлены 60 незаконченных попыток. Итоговые результаты [5,7,10] и три бонуса сохраняются.
          +- Отдельно проверена совместимость с ранее начатой разминкой «Задачи на кратное сравнение». После замены исходной сборки исправленной и F5 восстановились ID попытки, результат первого ответа и исходный второй вопрос. Попытка дошла до 5/5.
