name: MatKvest stage18 - real production G5-G6 v55 fractions smoke
on:
  push:
    branches: [audit/g5g6-stage18-20261105]
    paths:
      - .github/workflows/g5g6_stage18_prod_g5g6_v55_smoke.yml
      - audits/g5g6_stage18_prod_g5g6_v55_smoke.mjs
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  verify-production-grade56:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g5g6-stage18-20261105
      - name: Get only officially configured Pages URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url')"
          test -n "$URL"
          echo "MATKVEST_PAGES_URL=$URL" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Puppeteer
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Test actual public G5/G6 fraction forms and restoration on mobile/desktop
        run: node audits/g5g6_stage18_prod_g5g6_v55_smoke.mjs
      - name: Preserve real-site smoke report and four screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matkvest-v55-public-grade56-fraction-smoke
          path: |
            audits/g5g6_stage18_prod_g5g6_v55_smoke_report.json
            audits/g5g6_stage18_prod_grade5_390.png
            audits/g5g6_stage18_prod_grade6_390.png
            audits/g5g6_stage18_prod_grade5_1280.png
            audits/g5g6_stage18_prod_grade6_1280.png
          if-no-files-found: warn
