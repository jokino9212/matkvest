name: MatKvest UI19F - XP and eight-grade progress comprehensive gate
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19f_gate.yml
      - audits/ui_stage19f_patch.py
      - audits/ui_stage19f_test.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-ui19f-v66
  cancel-in-progress: false
jobs:
  progress-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          fetch-depth: 0
          persist-credentials: true
      - name: Apply precise v66 patch to SHA-verified v65
        run: python3 audits/ui_stage19f_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Test XP thresholds, all grades, per-profile stage counters and responsive UX
        run: node audits/ui_stage19f_test.mjs
      - name: Regression - v65 archived accessories cash-out safety
        run: |
          sed 's/matkvest-iphone-v65/matkvest-iphone-v66/g' audits/ui_stage19e_legacy_test.mjs > audits/_ui19f_regress_e5.mjs
          node audits/_ui19f_regress_e5.mjs
          rm audits/_ui19f_regress_e5.mjs
      - name: Regression - v64 wallet and transaction-free computations
        run: |
          sed 's/matkvest-iphone-v64/matkvest-iphone-v66/g' audits/ui_stage19e_test.mjs > audits/_ui19f_regress_e4.mjs
          node audits/_ui19f_regress_e4.mjs
          rm audits/_ui19f_regress_e4.mjs
      - name: Regression - v63 rarity, purchase, sale and archive refund
        run: |
          sed 's/matkvest-iphone-v63/matkvest-iphone-v66/g' audits/ui_stage19d_test.mjs > audits/_ui19f_regress_d.mjs
          node audits/_ui19f_regress_d.mjs
          rm audits/_ui19f_regress_d.mjs
      - name: Regression - v62 class topic search and grade navigation
        run: |
          sed 's/matkvest-iphone-v62/matkvest-iphone-v66/g' audits/ui_stage19c4_test.mjs > audits/_ui19f_regress_c4.mjs
          node audits/_ui19f_regress_c4.mjs
          rm audits/_ui19f_regress_c4.mjs
      - name: Regression - v61 completed quiz, resume and collection dialogs
        run: |
          sed 's/matkvest-iphone-v61/matkvest-iphone-v66/g' audits/ui_stage19c3b_test.mjs > audits/_ui19f_regress_c3b.mjs
          node audits/_ui19f_regress_c3b.mjs
          rm audits/_ui19f_regress_c3b.mjs
      - name: Regression - v60 lessons, training and shop
        run: |
          sed 's/matkvest-iphone-v60/matkvest-iphone-v66/g' audits/ui_stage19c3_test.mjs > audits/_ui19f_regress_c3.mjs
          node audits/_ui19f_regress_c3.mjs
          rm audits/_ui19f_regress_c3.mjs
      - name: Regression - v59 header and class cards
        run: |
          sed 's/matkvest-iphone-v59/matkvest-iphone-v66/g' audits/ui_stage19c2_test.mjs > audits/_ui19f_regress_c2.mjs
          node audits/_ui19f_regress_c2.mjs
          rm audits/_ui19f_regress_c2.mjs
      - name: Regression - v58 topic keyboard and design system
        run: |
          sed -e 's/matkvest-iphone-v58/matkvest-iphone-v66/g' -e 's/state.mobileMenu===(w<=600)/state.mobileMenu===(w<=1120)/g' audits/ui_stage19c_test.mjs > audits/_ui19f_regress_c.mjs
          node audits/_ui19f_regress_c.mjs
          rm audits/_ui19f_regress_c.mjs
      - name: Regression - v56 whole clickable class cards
        run: |
          sed 's/matkvest-iphone-v56/matkvest-iphone-v66/g' audits/ui_stage19a_test.mjs > audits/_ui19f_regress_a.mjs
          node audits/_ui19f_regress_a.mjs
          rm audits/_ui19f_regress_a.mjs
      - name: Regression - v57 navigation
        run: |
          sed -e 's/matkvest-iphone-v57/matkvest-iphone-v66/g' -e 's/if(width<=600){/if(width<=768){/g' audits/ui_stage19b_test.mjs > audits/_ui19f_regress_b.mjs
          node audits/_ui19f_regress_b.mjs
          rm audits/_ui19f_regress_b.mjs
      - name: Cross-grade mathematics and training generator regression
        run: |
          SHA="$(sha256sum index.html | cut -d' ' -f1)"
          sed "s/f188d39a3a16fc54dfb32238fc34d3dfe6cc3c4416cd475579bf3ed65a7e1e36/$SHA/g" audits/g7_stage14_crossgrade_test.mjs > audits/_ui19f_crossgrade.mjs
          node audits/_ui19f_crossgrade.mjs
          rm audits/_ui19f_crossgrade.mjs
      - name: Grade 4 arithmetic and input control
        run: |
          SHA="$(sha256sum index.html | cut -d' ' -f1)"
          sed "s/f188d39a3a16fc54dfb32238fc34d3dfe6cc3c4416cd475579bf3ed65a7e1e36/$SHA/g" audits/g7_stage14_grade4_test.mjs > audits/_ui19f_grade4.mjs
          node audits/_ui19f_grade4.mjs
          rm audits/_ui19f_grade4.mjs
      - name: Validate service worker source fingerprint
        run: python3 audits/g7_stage12_sync_pwa.py --check
      - name: Save representative visual review screenshots
        if: success()
        run: |
          for name in overview_320 overview_390 overview_1280 grade1_390 grade7_390 grade8_390 grade7_1280 grade8_1280; do
            base64 -w0 "audits/ui19f_after_${name}.png" > "audits/ui19f_after_review_${name}.b64.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matkvest-ui19f-v66-accurate-grade-progress-gate
          path: |
            audits/ui_stage19f_patch_report.json
            audits/ui_stage19f_test_report.json
            audits/ui19f_after_*.png
          if-no-files-found: warn
      - name: Commit verified v66 to audit branch, never main
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js audits/ui_stage19f_patch_report.json audits/ui_stage19f_test_report.json audits/ui19f_after_review_*.b64.txt
          git diff --cached --quiet || git commit -m "feat(ui19F): accurate XP, learning stages and per-grade visual progress v66"
          for file in audits/ui_stage19e_legacy_test_report.json audits/ui_stage19e_test_report.json audits/ui_stage19d_test_report.json audits/ui_stage19c4_test_report.json audits/ui_stage19c3b_test_report.json audits/ui_stage19c3_test_report.json audits/ui_stage19c2_test_report.json audits/ui_stage19c_test_report.json audits/ui_stage19a_test_report.json audits/ui_stage19b_test_report.json audits/g7_stage14_crossgrade_report.json audits/g7_stage14_grade4_report.json; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then git restore -- "$file"; else rm -f "$file"; fi
          done
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
