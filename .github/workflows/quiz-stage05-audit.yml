name: Quiz stage05 grade-five audit
on:
  push:
    branches: [fix/quiz-fractions-stage01-20261110]
    paths:
      - audits/quiz_stage05_probe.py
      - audits/quiz_stage05_diversity_browser.cjs
      - audits/quiz_stage05_fingerprint_browser.cjs
      - audits/quiz_stage05_sessions_browser.cjs
      - audits/quiz_stage05_fresh_browser.cjs
      - .github/workflows/quiz-stage05-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Locate grade-five catalog and generator pathways
        run: python3 audits/quiz_stage05_probe.py
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Quantify diversity for all grade-five topics and stages
        run: node audits/quiz_stage05_diversity_browser.cjs
      - name: Full question HTML, answer, and semantic-template fingerprint audit
        run: node audits/quiz_stage05_fingerprint_browser.cjs
      - name: Simulate 20 five-question sessions per topic and difficulty
        run: node audits/quiz_stage05_sessions_browser.cjs
      - name: Verify no exact repeats using real freshQuiz anti-repeat logic
        run: node audits/quiz_stage05_fresh_browser.cjs
