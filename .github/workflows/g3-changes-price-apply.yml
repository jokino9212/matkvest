name: Apply verified Grade 3 changes and price audit
on:
  push:
    branches: [audit/g1-g4-content-v195]
    paths: [.github/workflows/g3-changes-price-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply the verified audit patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5da95ed1e1407458304102e87357e4040b5bfee7"
          patch_file="$RUNNER_TEMP/matkvest.patch"
          cat > "$patch_file" <<'MATKVEST_PATCH'
          diff --git a/audits/g1_g4_content_audit_2026-11-17.md b/audits/g1_g4_content_audit_2026-11-17.md
          index f791e34..0753054 100644
          --- a/audits/g1_g4_content_audit_2026-11-17.md
          +++ b/audits/g1_g4_content_audit_2026-11-17.md
          @@ -1484 +1484,31 @@
           - Формы выбираются случайно. Нет обратных задач и задач, в которых нужно последовательно применить разностное и кратное отношения. Целочисленный ответ сопровождается подсказкой о десятичной дроби.
          +
          +**После правок.** На разминке величина находится по прямому отношению. На тренировке нужно восстановить исходное количество по обратному отношению. Мастер содержит цепочки из двух отношений с разным порядком действий. В одной попытке встречаются все четыре формы. Числа и целочисленные ответы остаются в пределах 1–1000.
          +
          +- Независимо решены 9 600 задач, проверены числовые равенства в разборах и отсутствие одинаковых условий между уровнями.
          +- На 320, 390 и 1280 px завершены 12 попыток, 81 правильный ответ засчитан. Во всех профилях неверный ответ отклонён, исправление принято. F5 сохранил очки уровней, три бонуса и 27 ответов в истории.
          +- На 390 px после F5 продолжены все три незаконченные попытки с того же второго вопроса. Сохранены ID попытки, счётчик и условие.
          +
          +Следующая тема 3-го класса — «Цена, количество, стоимость» (`g3:price_quantity_cost`).
          +
          +### 2026-11-19. Цена, количество, стоимость (`g3:price_quantity_cost`)
          +
          +**До правок.** В Chromium проверено по 1 200 задач на уровень (зерно 19502).
          +
          +- У тренировки и мастера совпадают все три одношаговых шаблона и диапазоны. Между разминкой и тренировкой совпало 115 уникальных условий, между разминкой и мастером — 114, между тренировкой и мастером — 422.
          +- В разминке нет задачи на количество, два остальных шаблона выбираются случайно. Нет задач с несколькими товарами, сдачей или бюджетом. Целочисленные ответы сопровождаются подсказкой о десятичной дроби.
          +
          +**После правок.** Разминка закрепляет все три связи между ценой, количеством и стоимостью. Тренировка добавляет стоимость нескольких товаров, сравнение расходов и выделение стоимости одного товара из общей суммы. На мастере нужно найти сдачу, восстановить количество или определить максимальную покупку по оставшемуся бюджету. В одной попытке встречаются все формы уровня.
          +
          +- По видимым условиям независимо решены 9 600 задач. Проверены единицы, ответы, равенства в разборах и отсутствие совпадающих условий между уровнями.
          +- На 320, 390 и 1280 px пройдены 12 попыток. Засчитан 81 правильный ответ. Проверены отклонение неверного ввода, принятие исправления и сохранение очков, трёх бонусов и 27 записей истории после F5.
          +- На 390 px прерванные попытки на каждом уровне восстановились со второго вопроса по кнопке «Продолжить» и завершились с полным баллом.
          +
          +Следующая тема 3-го класса — «Начало, окончание и продолжительность события» (`g3:time_tasks`).
          +
          +### 2026-11-19. Начало, окончание и продолжительность события (`g3:time_tasks`)
          +
          +**До правок.** В Chromium проверено по 1 200 задач на уровень (зерно 19502).
          +
          +- Все уровни решают одношаговые задачи со случайным временем. Тренировка и мастер имеют одинаковые три шаблона и диапазоны. Между разминкой и тренировкой совпало 78 уникальных условий, между разминкой и мастером — 70, между тренировкой и мастером — 79.
          +- В разминке встречается переход через час, отсутствует поиск начала. В мастере отсутствуют перерывы и составные интервалы. Для целого количества минут отображается подсказка о десятичной дроби.
