          });
          
          function inspectBuild({topic, mode}) {
            function requireThat(condition, message) {
              if (!condition) throw new Error(message);
            }
            const plain = value => value.replace(/\s+/g, ' ').trim();
            const expectedFamilies=[['read_digits','neighbor'],['fill_sequence','read_ray'],['count_between','next_round']];
            const bounded=value=>Number.isInteger(value)&&value>=1&&value<=1000;
            const spoken={
              один:1,два:2,три:3,четыре:4,пять:5,шесть:6,семь:7,восемь:8,девять:9,десять:10,
              одиннадцать:11,двенадцать:12,тринадцать:13,четырнадцать:14,пятнадцать:15,шестнадцать:16,семнадцать:17,восемнадцать:18,девятнадцать:19,
              двадцать:20,тридцать:30,сорок:40,пятьдесят:50,шестьдесят:60,семьдесят:70,восемьдесят:80,девяносто:90,
              сто:100,двести:200,триста:300,четыреста:400,пятьсот:500,шестьсот:600,семьсот:700,восемьсот:800,девятьсот:900
            };
            function solve(prompt,visual,labels){
              requireThat(!labels.length||labels.length===4&&new Set(labels).size===4&&labels.every(label=>bounded(Number(label))),'Invalid answers');
              const word=prompt.match(/^Как записать цифрами число «(.+)»\?$/);
              if(word){
                const words=word[1].split(' ');
                requireThat(word[1]==='одна тысяча'||words.every(part=>part in spoken),'Invalid spoken number');
                const answer=word[1]==='одна тысяча'?1000:words.reduce((sum,part)=>sum+spoken[part],0);
                requireThat(labels.length>0&&bounded(answer),'Invalid spoken-number exercise');
                return {family:'read_digits',answer:String(answer),key:prompt,values:[String(answer)]};
              }
              const neighbor=prompt.match(/^Какое число (идёт сразу после|стоит прямо перед) (\d+)\?$/);
              if(neighbor){
                const dir=neighbor[1].includes('после')?1:-1,n=Number(neighbor[2]),answer=n+dir;
                requireThat(labels.length>0&&bounded(n)&&bounded(answer),'Neighbor outside 1–1000');
                return {family:'neighbor',answer:String(answer),key:prompt,values:[n+'→'+answer]};
              }
              requireThat(!labels.length,'Expected numeric input');
              const row=visual.querySelector('.g2-info-sequence');
              if(row){
                const content=[...row.querySelectorAll('.g2-info-seq-item')].map(item=>item.textContent);
                const missing=content.indexOf('?'),anchor=content.findIndex(value=>value!=='?'),base=Number(content[anchor])-anchor,answer=base+missing;
                requireThat(prompt==='Какое число пропущено в ряду соседних чисел?'&&content.length===5&&
                  content.filter(value=>value==='?').length===1&&content.every((value,i)=>value==='?'||bounded(Number(value))&&Number(value)===base+i)&&bounded(answer)&&
                  row.getAttribute('aria-label').includes('пропуск'),'Invalid sequence');
                return {family:'fill_sequence',answer:String(answer),key:prompt+'|'+content.join(','),values:['position:'+missing,'answer:'+answer,'start:'+base]};
              }
              const svg=visual.querySelector('.elementary-number-line svg');
              if(svg){
                const axis=[...svg.querySelectorAll('line')].filter(line=>line.getAttribute('x1')===line.getAttribute('x2')).map(line=>Number(line.getAttribute('x1')));
                const marked=Number(svg.querySelector('circle').getAttribute('cx')),index=axis.indexOf(marked);
                const shown=[...svg.querySelectorAll('text')].map(node=>[axis.indexOf(Number(node.getAttribute('x'))),Number(node.textContent)]);
                const [[i,a],[j,b]]=shown,step=(b-a)/(j-i),base=a-step*i,answer=base+index*step;
                requireThat(prompt==='Какое число отмечено точкой на числовом луче?'&&axis.length===5&&shown.length===4&&
                  index>0&&shown.every(([i,n])=>i>=0&&i!==index&&bounded(n)&&n===base+i*step)&&
                  [10,100].includes(step)&&bounded(answer)&&!shown.some(([,n])=>n===answer)&&
                  svg.getAttribute('aria-label').includes('Шаг шкалы — '+step),'Invalid or exposed number-line answer');
                return {family:'read_ray',answer:String(answer),key:prompt+'|'+base+':'+step+':'+index,values:[step+':'+index,'answer:'+answer]};
              }
              const between=prompt.match(/^Сколько целых чисел находится строго между (\d+) и (\d+)\?$/);
              if(between){
                const [start,end]=between.slice(1).map(Number);
                const count=Array.from({length:1000},(_,i)=>i+1).filter(value=>value>start&&value<end).length;
                requireThat(bounded(start)&&bounded(end)&&count>=1,'Invalid bounds');
                return {family:'count_between',answer:String(count),key:prompt,values:['left:'+start,'right:'+end,'count:'+count]};
              }
              const round=prompt.match(/^Какое первое число после (\d+) оканчивается на (00|0)\?$/);
              requireThat(round,'Unknown question: '+prompt);
              const start=Number(round[1]),end=round[2],answer=Array.from({length:1000-start},(_,i)=>start+i+1).find(value=>String(value).endsWith(end));
              requireThat(bounded(start)&&bounded(answer),'No later round number');
              return {family:'next_round',answer:String(answer),key:prompt,values:[end+':'+answer]};
            }
            function submit(panel, answer) {
              const field=panel.querySelector('#quizInput');
              if(field){
                field.value=answer;
                field.dispatchEvent(new Event('input',{bubbles:true}));
                panel.querySelector('#quizCheck').click();
                return;
              }
              const button=[...panel.querySelectorAll('button.answer')].find(option=>plain(option.textContent)===answer);
              requireThat(button,'Independently solved option missing from the screen');
              button.click();
            }
          
            function seedRandom(value) {
              Math.random = () => ((value = (Math.imul(value, 1664525) + 1013904223) >>> 0) / 4294967296);
            }
            function siblingQuestions() {
              seedRandom(19503);
              return g3AllTopics().filter(t=>t.id!==topic&&t.implemented!==false).flatMap(t => [0,1,2].flatMap(level =>
                Array.from({length:12}, () => makeG3Question(t.id, level))));
            }
          
            if (mode === 'baseline') {
              const siblings = siblingQuestions();
              seedRandom(195);
              for (const level of [0,1]) {
                openG3Topic(topic);
                document.querySelectorAll('#modal .stage-card')[level].click();
                for (let i=0; i<STAGES[level].count; i++) {
                  submit(document.querySelector('#qstage'),q.ans);
                  document.querySelector('#quizNext').click();
                }
              }
              const stored = deepCopy(progressFor(topic));
              requireThat(JSON.stringify(stored.best) === '[5,7,0]' && JSON.stringify(stored.bonus) === '[true,true,false]', 'Baseline did not produce saved progress');
              return {siblings, stored, historyIds:state.attemptHistory.map(attempt=>attempt.id)};
            }
          
            const otherTopics = siblingQuestions();
            seedRandom(19601);
            const holder = document.createElement('div');
            const seen = expectedFamilies.map(() => new Set());
            const coverage=expectedFamilies.map(()=>new Map());
            const stories = expectedFamilies.map(()=>new Set());
            let generated=0, accepted=0, completed=0, rejected=0, entered=0, selected=0;
            for (const level of [0,1,2]) {
              for (let i=0; i<3200; i++) {
                const question = makeG3Question(topic, level);
                holder.innerHTML = '<div>' + question.text + '</div>' + quizVisualHtml(question);
                const prompt = plain(holder.firstElementChild.textContent);
                const labels = question.choices.map(option=>option.label);
                const task = solve(prompt, holder, labels);
                requireThat(task.answer === String(question.ans) && (question.answerMode==='number' ? labels.length===0 : labels.filter(label=>label===task.answer).length===1), 'Generated answer disagrees with an independent solution');
                requireThat(expectedFamilies[level].includes(task.family), 'Unexpected family on level ' + level);
                seen[level].add(task.family);
                stories[level].add(task.key);
                const values=coverage[level].get(task.family)||new Set();
                task.values.forEach(value=>values.add(value));
                coverage[level].set(task.family,values);
                generated++;
              }
              requireThat(seen[level].size===expectedFamilies[level].length, 'Insufficient coverage of the level');
              for (let run=0; run<6; run++) {
                openG3Topic(topic);
                const stages = [...document.querySelectorAll('#modal .stage-card')];
                for (const stage of stages) {
                  const rect=stage.getBoundingClientRect();
                  requireThat(rect.width>0 && rect.left>=-1 && rect.right<=innerWidth+1,'Stage card overflow');
                }
                const stage=stages[level];
                requireThat(!stage.disabled, 'Level not unlocked');
                stage.click();
                const keys=new Set(), methods=new Set();
                for (let i=0; i<STAGES[level].count; i++) {
                  const panel=document.querySelector('#qstage');
                  const choices=[...panel.querySelectorAll('button.answer')];
                  const labels=choices.map(button=>plain(button.textContent));
                  const task=solve(plain(panel.querySelector('.quizq').textContent),panel,labels);
                  const seqTops=[...panel.querySelectorAll('.g2-info-seq-item')].map(item=>item.getBoundingClientRect().top);
                  if(seqTops.length)requireThat(Math.max(...seqTops)-Math.min(...seqTops)<1,'Sequence wraps on mobile');
                  requireThat(expectedFamilies[level].includes(task.family) && !keys.has(task.key), 'Bad level or repetition inside an attempt');
                  keys.add(task.key);
                  methods.add(task.family);
                  for (const element of panel.querySelectorAll('.elementary-number-line svg, .elementary-number-line text, .g2-info-seq-item, button.answer, #quizInput')) {
                    const rect=element.getBoundingClientRect();
                    requireThat(rect.width>0 && rect.left>=-1 && rect.right<=innerWidth+1, 'Question overflowing viewport');
                  }
                  if (run===0 && i===0) {
                    const wrong=labels.length ? labels.find(label=>label!==task.answer) : String((Number(task.answer)+1)%1001);
                    submit(panel,wrong);
                    requireThat(blockSession.correct===i && blockSession.done===i && /Пока неверно/.test(document.querySelector('#qfb').textContent), 'Wrong answer was not rejected');
                    rejected++;
                  }
                  submit(panel,task.answer);
                  if(labels.length)selected++;else entered++;
                  const item=blockSession.items.at(-1);
                  const expectedScore=i+1-(run===0?1:0);
                  requireThat(blockSession.correct===expectedScore && blockSession.done===i+1 &&
                    item.finalCorrect && item.firstTry===!(run===0 && i===0), 'Answer handling differed from the level scoring rules: '+task.key);
                  accepted++;
                  const next=document.querySelector('#quizNext');
                  if (i+1===STAGES[level].count) requireThat(/Посмотреть результат/.test(next.textContent), 'Result button is missing');
                  next.click();
                }
                requireThat(methods.size===expectedFamilies[level].length, 'An attempt missed an action');
                const expectedBest=STAGES[level].count-(level===2 && run===0?1:0);
                requireThat(progressFor(topic).best[level]===expectedBest && progressFor(topic).bonus[level], 'Progress not saved');
                completed++;
              }
            }
            const requiredExamples=[
              {read_digits:['1','99','100','105','506','999','1000'],neighbor:['2→1','99→100','100→99','999→1000','1000→999']},
              {fill_sequence:[...[0,1,2,3,4].map(i=>'position:'+i),'answer:1','answer:1000','start:97','start:996'],
                read_ray:[...[10,100].flatMap(step=>[1,2,3,4].map(i=>step+':'+i)),'answer:1000']},
              {count_between:['left:1','right:1000','count:1','count:23'],next_round:['0:100','00:100','0:1000','00:1000']}
            ];
            for(const [level,families] of Object.entries(requiredExamples)){
              for(const [family,examples] of Object.entries(families)){
                requireThat(examples.every(value=>coverage[level].get(family)?.has(value)),'Missing edge cases for '+family+': '+examples.filter(value=>!coverage[level].get(family)?.has(value)));
              }
