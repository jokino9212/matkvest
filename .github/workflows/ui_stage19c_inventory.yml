name: MatKvest UI stage19C - responsive visual inventory
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19c_inventory.yml
      - audits/ui_stage19c_inventory.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: matkvest-ui19c-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Inspect live DOM and take responsive screenshots
        run: node audits/ui_stage19c_inventory.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matkvest-ui19c-v57-before-inventory
          path: |
            audits/ui_stage19c_inventory.json
            audits/ui19c_before_*.png
          if-no-files-found: warn
      - name: Retain pre-redesign evidence on audit branch
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/ui_stage19c_inventory.json audits/ui19c_before_*.png
          if ! git diff --cached --quiet; then
            git commit -m "audit(ui19C): capture v57 layout, computed styles and baseline screenshots"
            git pull --rebase origin audit/ui-stage19-20261106
            git push origin HEAD:audit/ui-stage19-20261106
          fi
