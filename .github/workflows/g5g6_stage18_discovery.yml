name: MatKvest stage18 - grade5-6 discovery
on:
  push:
    branches: [audit/g5g6-stage18-20261105]
    paths:
      - .github/workflows/g5g6_stage18_discovery.yml
      - audits/g5g6_stage18_discovery.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  read-only-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/g5g6-stage18-20261105
          persist-credentials: true
      - name: Inventory all fraction input sites and grade5-6 generators
        run: python3 audits/g5g6_stage18_discovery.py
      - name: Persist discovery report on audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/g5g6_stage18_discovery_report.md audits/g5g6_stage18_focus_report.md audits/g5g6_stage18_g5_pipeline_report.md audits/g5g6_stage18_g5_adapter_report.md
          git diff --cached --quiet || (git commit -m "audit(stage18): record grade5-6 input architecture" && git pull --rebase origin audit/g5g6-stage18-20261105 && git push origin HEAD:audit/g5g6-stage18-20261105)
