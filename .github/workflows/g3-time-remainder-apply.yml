          +++ b/audits/g1_g4_content_audit_2026-11-17.md
          @@ -1514 +1514,29 @@
           - В разминке встречается переход через час, отсутствует поиск начала. В мастере отсутствуют перерывы и составные интервалы. Для целого количества минут отображается подсказка о десятичной дроби.
          +
          +**После правок.** На разминке время остаётся в пределах часа. На тренировке все интервалы проходят границу часа. Мастер использует составные интервалы и перерывы. Каждый уровень охватывает поиск начала, конца и продолжительности. Для времени осталось поле ЧЧ:ММ, при вводе продолжительности поле показывает минуты.
          +
          +- Независимо решены 9 600 задач. Проверены расчёты времени и длительности, разборы и отсутствие одинаковых условий между уровнями.
          +- На 320, 390 и 1280 px завершены 12 попыток и засчитан 81 ответ. Проверены исправление ошибки, сохранённые очки, бонусы и история. На 390 px F5 восстановил ID, счётчик и второй вопрос на каждом уровне.
          +
          +Следующая тема 3-го класса — «Задачи на деление с остатком» (`g3:remainder_tasks`).
          +
          +### 2026-11-19. Задачи на деление с остатком (`g3:remainder_tasks`)
          +
          +**До правок.** В Chromium проверено по 1 200 задач на уровень (зерно 19502).
          +
          +- Разминка и тренировка используют один шаблон про яблоки в пакетах. Мастер использует его в 864 случаях из 1 200, в остальных случаях нужно найти минимальное число машин. Между уровнями совпало 157, 142 и 277 уникальных условий.
          +- Мастер не требует пересчёта данных перед делением. Нет задач с нулевым остатком и выбором между количеством полных групп и минимальным числом ёмкостей в одной попытке.
          +
          +**После правок.** Разминка проверяет частное и остаток при раскладывании и при раздаче поровну. Тренировка различает число полных групп, минимальное число машин и случай без остатка. На мастере ученик сначала изменяет или объединяет исходные количества либо находит, сколько не хватает до полной группы. Все формы каждого уровня входят в одну попытку.
          +
          +- В Chromium независимо решены 9 600 задач. Проверены целочисленное частное, границы остатка, точное деление, округление вверх, числовые равенства и отсутствие повторов между уровнями.
          +- На 320, 390 и 1280 px завершены 12 попыток. Проверены оба поля ввода, отклонение неправильного частного и принятие исправления. После F5 сохранены очки, три бонуса и 27 записей истории. На 390 px на каждом уровне восстановлен тот же второй вопрос и продолжена попытка.
          +
          +Следующая тема 3-го класса — «Задачи в два действия» (`g3:two_step_tasks`).
          +
          +### 2026-11-19. Задачи в два действия (`g3:two_step_tasks`)
          +
          +**До правок.** В Chromium проверено по 1 200 задач на уровень (зерно 19502).
          +
          +- Тренировка и мастер используют одни и те же пять шаблонов. Разминка повторяет два из них. Между уровнями совпало 147, 151 и 298 уникальных условий.
          +- Шаблоны выбираются случайно, обратного хода от известного результата к исходному количеству нет. Поле предлагает ввод десятичной дроби.
