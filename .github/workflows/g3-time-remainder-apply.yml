name: Apply verified Grade 3 time and remainder audit
on:
  push:
    branches: [audit/g1-g4-content-v195]
    paths: [.github/workflows/g3-time-remainder-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply the verified audit patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "958ea3f3a206da5701739d0ee0483213e7dda104"
          patch_file="$RUNNER_TEMP/matkvest.patch"
          cat > "$patch_file" <<'MATKVEST_PATCH'
