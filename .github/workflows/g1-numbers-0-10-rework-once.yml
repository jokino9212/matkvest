                stage.click();
                const keys=new Set(), methods=new Set();
                for (let i=0; i<STAGES[level].count; i++) {
                  const panel=document.querySelector('#qstage');
                  const choices=[...panel.querySelectorAll('button.answer')];
                  const labels=choices.map(button=>plain(button.textContent));
                  const task=solve(plain(panel.querySelector('.quizq').textContent),panel,labels);
                  requireThat(expectedFamilies[level].includes(task.family) && !keys.has(task.key), 'Bad level or repetition inside an attempt');
