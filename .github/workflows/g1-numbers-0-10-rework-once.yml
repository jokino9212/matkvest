                const counts = [...holder.querySelectorAll('.g1-counter-wrap')].map(group=>group.querySelectorAll('.g1-counter').length);
                if (task.family==='count' && task.answer==='0') cases.zeroCount++;
                if (task.family==='line' && task.answer==='0') cases.zeroOnRay++;
                if (task.family==='line' && task.answer==='10') cases.tenOnRay++;
                if (task.family==='compare' && counts.includes(0)) cases.emptyGroup++;
                if (task.answer==='Поровну') cases.equalGroups++;
                if (task.family==='steps') {
                  cases[task.offset>0?'right':'left']++;
                  if (task.answer==='0') cases.landedOnZero++;
                  if (task.answer==='10') cases.landedOnTen++;
                }
                if (task.family==='backwards') cases[task.adjacent?'adjacent':'separate']++;
