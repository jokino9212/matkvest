name: UX-08 final 50-badge art contact sheet
on:
  push:
    branches: [ux-final/ux00-inventory-20261108]
    paths: ['.github/workflows/ux08-50-gallery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Render every actual catalog SVG at 48px and 160px
        run: timeout 120s node audits/ux08_final_50_gallery_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux08-all-50-badges-review-sheet
          path: audits/ux08_50_gallery_output/
          retention-days: 60
