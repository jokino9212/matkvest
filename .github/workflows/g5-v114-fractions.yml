name: Stage22 grade-five fraction diversity and curriculum v114
on:
  push:
    branches: [feat/g5-v114-fractions-20261113]
    paths:
      - g5-fractions-v114.js
      - audits/g5_v114_patch.py
      - audits/g5_v114_fraction_oracle.cjs
      - .github/workflows/g5-v114-fractions.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage22:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Activate v114 fraction practice and PWA integrity
        run: python3 audits/g5_v114_patch.py
      - name: Syntax validation
        run: node --check g5-fractions-v114.js
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Independently verify all 60 fraction task families on four responsive widths
        run: node audits/g5_v114_fraction_oracle.cjs
      - name: Verify previously fixed fraction conversion and 74 existing topics
        run: |
          node audits/g5_v113_math_oracle.cjs
          node audits/g5_v112_browser.cjs
          sed 's/67/74/g' audits/g5_v111_browser.cjs > audits/g5_v114_v111_runtime.cjs
          sed 's/61/74/g' audits/g5_stage18t_full_regression.cjs > audits/g5_v114_full_runtime.cjs
          node audits/g5_v114_v111_runtime.cjs
          node audits/g5_v114_full_runtime.cjs
          node audits/g5_conversion_diversity_smoke.cjs
          node audits/g5_conversion_ux_smoke.cjs
      - name: Commit verified v114 HTML and service-worker to candidate branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "feat(g5): activate textbook fractions and rich number-line practice v114"
            git fetch origin feat/g5-v114-fractions-20261113
            git rebase origin/feat/g5-v114-fractions-20261113
            git push origin HEAD:feat/g5-v114-fractions-20261113
          fi
