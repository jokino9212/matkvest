          ref: 8195decaa2eb8bd57c192a5dab9413dcb19e8082
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium for the browser regression
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
