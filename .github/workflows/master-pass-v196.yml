                 mergedBA:progressStagePassed(mergeCourseProgress(plain,profile.courseProgress)[key],2),
                 recordCount:state.attemptHistory.filter(x=>x.id===id).length};
              }""", {"key": KEY, "id": attempt})
              assert actual["score"] == first and actual["record"]["correct"] == first, actual
              assert actual["mark"] == (passed and first == 7), actual
              assert all(actual[k] == passed for k in ("bonus","progress","knowledge","achievements","mergedAB","mergedBA")), actual
              assert actual["report"] == int(passed) and actual["done"] == 2+int(passed), actual
              assert actual["record"]["passed"] == passed and actual["recordCount"] == 1, actual
              assert actual["legacy"] and not actual["plain"], actual
              expected_fixes = (1 if resume else 0) + remaining.count("corrected")
              assert actual["record"]["fixes"] == expected_fixes and actual["record"]["skips"] == remaining.count("skip")+remaining.count("wrong_then_skip"), actual
              assert actual["record"]["stars"] == (3 if first == 10 else 2 if first >= 8 else 1), actual
              if offline:
