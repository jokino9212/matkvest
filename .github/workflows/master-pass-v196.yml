          cat > "$RUNNER_TEMP/check-matkvest-v196.py" <<'BROWSER_TEST'
          import os
          from playwright.sync_api import sync_playwright, expect
          
          URL = os.environ.get("MATKVEST_URL", "http://127.0.0.1:8196/")
          KEY = "g6:percent_of_number"
          
          def enter_topic(page):
              page.evaluate("(key) => {renderGrade6(); openG6Topic(key)}", KEY)
              expect(page.locator(".stage-card").nth(2)).to_contain_text("самостоятельное исправление")
          
          def load(page, width, expected_worker):
              errors = []
              page.on("pageerror", lambda e: errors.append(str(e)))
              page.set_viewport_size({"width": width, "height": 850})
              page.goto(URL, wait_until="load")
              page.wait_for_function("typeof stagePassed === 'function'")
              if expected_worker:
                  page.wait_for_function("""async (version) => {
                    if (!navigator.serviceWorker.controller) return false;
                    const names = await caches.keys();
                    return names.includes('matkvest-iphone-v'+version);
                  }""", arg=expected_worker, timeout=30000)
              return errors
          
          def solve(page, outcome):
              if outcome == "wrong_then_skip" or outcome == "corrected":
                  answer(page, False)
                  expect(page.locator("#qfb")).to_contain_text("Пока неверно")
              if outcome in ("skip", "wrong_then_skip"):
                  page.locator("#quizSkip").click()
                  page.get_by_role("button", name="Да, пропустить задание").click()
                  expect(page.locator("#qfb")).to_contain_text("Правильный ответ")
              else:
                  answer(page, True)
                  expect(page.locator("#qfb")).to_contain_text("Исправлено" if outcome=="corrected" else "Верно")
              page.locator("#quizNext").click()
          
          def answer(page, correct):
              q = page.evaluate("""() => ({answerMode:q.answerMode, answer:correctChoicePlain(q),
                 choice:q.choices?.findIndex(c=>String(c.key)===String(q.ans))??-1})""")
              if not q["answerMode"] or q["answerMode"] == "choice":
                  right = q["choice"]
                  page.locator("#qstage .answer").nth(right if correct else (right+1)%page.locator("#qstage .answer").count()).click()
              else:
                  page.locator("#quizInput").fill(q["answer"] if correct else "999999")
                  page.locator("#quizCheck").click()
          
          def verify(page, width, first, remaining, passed, resume=False, repeat=False, offline=False, version=196):
              errors = load(page, width, version)
              page.evaluate("(key) => { progressFor(key).best=[5,7,0]; save(); }", KEY)
              enter_topic(page)
              master = page.locator(".stage-card").nth(2)
              expect(master).to_be_enabled()
              master.click()
              attempt = page.evaluate("blockSession.attemptId")
              for _ in range(first):
                  solve(page, "first")
              if resume:
                  answer(page, False)
                  page.reload(wait_until="load")
                  page.get_by_role("button", name="Продолжить", exact=True).click()
                  expect(page.locator("#qfb")).to_contain_text("Пока неверно")
                  assert page.evaluate("blockSession.attemptId") == attempt
                  answer(page, True)
                  expect(page.locator("#qfb")).to_contain_text("Исправлено")
                  page.locator("#quizNext").click()
                  remaining = remaining[1:]
              for outcome in remaining:
                  solve(page, outcome)
              expect(page.locator(".block-result")).to_contain_text(f"Верно с первой: {first} из 10")
              expect(page.locator(".block-result")).to_contain_text("Этап пройден" if passed else "Для прохождения нужно")
              if passed and first == 7:
                  expect(page.locator(".block-result")).to_contain_text("благодаря самостоятельному исправлению")
              page.get_by_role("button", name="Разбор попытки").click()
              expect(page.locator(".modal")).to_contain_text("Пройдено" if passed else "Не пройдено")
              if offline:
                  page.context.set_offline(True)
              page.reload(wait_until="load")
              actual = page.evaluate("""({key,id})=>{
                const record=state.attemptHistory.find(x=>x.id===id);
                const mark=progressFor(key).masterPassedWithCorrection===true;
                const profile={courseProgress:{[key]:progressFor(key)}};
                const legacy={[key]:{best:[4,5,8],bonus:[true,true,true]}};
                const plain={[key]:{best:[4,5,7],bonus:[true,true,false],masterPassedWithCorrection:false}};
                return {score:progressFor(key).best[2],mark,bonus:progressFor(key).bonus[2],
                 progress:stagePassed(key,2),done:completedStages(key),
                 record:record&&{correct:record.correct,passed:record.passed,stars:record.stars,
                  fixes:record.items.filter(x=>x.finalCorrect&&!x.firstTry&&!x.skipped).length,
                  skips:record.items.filter(x=>x.skipped).length},
