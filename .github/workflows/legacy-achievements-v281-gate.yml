name: Test-only guarded achievement filter Vue and HTML fallback PWA v281 gate
on:
  push:
    branches: [refactor/route-vue-actions-from-7c14ce9]
    paths:
      - '.github/workflows/legacy-achievements-v281-gate.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: achievements-v281-test-branch
  cancel-in-progress: false
jobs:
  integrate-test-publish:
    if: github.repository == 'jokino9212/matkvest' && github.ref == 'refs/heads/refactor/route-vue-actions-from-7c14ce9'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/route-vue-actions-from-7c14ce9
          persist-credentials: true
      - name: Apply SHA-fenced v280 to v281 achievement filters patch
        run: python3 audits/legacy_achievements_v281_patch.py
      - name: Synchronize PWA and check Python syntax
        run: |
          python3 audits/g7_stage12_sync_pwa.py
          python3 audits/g7_stage12_sync_pwa.py --check
          python3 -m py_compile audits/legacy_achievements_v281_patch.py audits/legacy_achievements_v281_publish.py
      - name: Install deterministic browser and dependencies
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Route and Vue action contracts v271 to v281
        run: |
          node audits/legacy_navigation_core.test.cjs
          node audits/legacy_vue_actions_v271.test.cjs
          node audits/legacy_training_plan_v272.test.cjs
          node audits/legacy_school_actions_v273.test.cjs
          node audits/legacy_school_column_v274.test.cjs
          node audits/legacy_school_frame_journal_v275.test.cjs
          node audits/legacy_reports_teacher_v276.test.cjs
          node audits/legacy_analytics_view_v277.test.cjs
          node audits/legacy_profile_dialog_v278.test.cjs
          node audits/legacy_teacher_dashboard_v279.test.cjs
          node audits/legacy_teacher_escape_store_v280.test.cjs
          node audits/legacy_achievements_v281.test.cjs
      - name: Deterministic unchanged Vue bundle
        run: |
          before=$(sha256sum assets/ui/knowledge-map.js | cut -d ' ' -f1)
          npm run build:knowledge-map
          after=$(sha256sum assets/ui/knowledge-map.js | cut -d ' ' -f1)
          test "$before" = "$after"
      - name: Achievement filters, keyboard, stale controls and HTML fallback at 390 and 1280
        run: node audits/legacy_achievements_v281_browser.cjs
      - name: 12 independent HTML column skip and confirmation repetitions
        run: node audits/v280_preflight_escape_skip_browser.cjs
      - name: Existing routes, grade/maps, school, plans, journal, teacher, profiles
        run: |
          sed -e 's/v271/v281/g' -e 's/V271/V281/g' audits/legacy_vue_actions_v271_browser.cjs > audits/legacy_vue_actions_v281_route_browser.cjs
          sed -e 's/v272/v281/g' -e 's/V272/V281/g' audits/legacy_training_plan_v272_browser.cjs > audits/legacy_training_plan_v281_browser.cjs
          sed -e 's/v273/v281/g' -e 's/V273/V281/g' audits/legacy_school_actions_v273_browser.cjs > audits/legacy_school_actions_v281_browser.cjs
          sed -e 's/v274/v281/g' -e 's/V274/V281/g' audits/legacy_school_column_v274_browser.cjs > audits/legacy_school_column_v281_browser.cjs
          sed -e 's/v275/v281/g' -e 's/V275/V281/g' audits/legacy_school_frame_journal_v275_browser.cjs > audits/legacy_school_frame_journal_v281_browser.cjs
          sed -e 's/v276/v281/g' -e 's/V276/V281/g' audits/legacy_reports_teacher_v276_browser.cjs > audits/legacy_reports_teacher_v281_browser.cjs
          sed -e 's/v277/v281/g' -e 's/V277/V281/g' audits/legacy_analytics_view_v277_browser.cjs > audits/legacy_analytics_view_v281_browser.cjs
          sed -e 's/v278/v281/g' -e 's/V278/V281/g' audits/legacy_profile_dialog_v278_browser.cjs > audits/legacy_profile_dialog_v281_browser.cjs
          sed -e 's/v279/v281/g' -e 's/V279/V281/g' audits/legacy_teacher_dashboard_v279_browser.cjs > audits/legacy_teacher_dashboard_v281_browser.cjs
          node audits/legacy_vue_actions_v281_route_browser.cjs
          node audits/legacy_training_plan_v281_browser.cjs
          node audits/legacy_school_actions_v281_browser.cjs
          node audits/legacy_school_column_v281_browser.cjs
          node audits/legacy_school_frame_journal_v281_browser.cjs
          node audits/legacy_reports_teacher_v281_browser.cjs
          node audits/legacy_analytics_view_v281_browser.cjs
          node audits/legacy_profile_dialog_v281_browser.cjs
          node audits/legacy_teacher_dashboard_v281_browser.cjs
          sed -e 's/v280/v281/g' -e 's/V280/V281/g' audits/legacy_teacher_escape_store_v280_browser.cjs > audits/legacy_teacher_escape_store_v281_browser.cjs
          node audits/legacy_teacher_escape_store_v281_browser.cjs
      - name: Full PWA verified refresh v280 to v281 and responsive offline
        run: |
          node audits/pwa_verified_refresh_browser.cjs
          node audits/stage28_offline_pwa_browser.cjs
      - name: Confirm final fingerprints and PWA cache
        run: python3 audits/g7_stage12_sync_pwa.py --check
      - name: Publish verified v281 achievements HTML and SW only to isolated test branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 audits/legacy_achievements_v281_publish.py
