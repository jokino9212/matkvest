name: Apply verified Grade 3 shape and line audit
on:
  push:
    branches: [audit/g1-g4-content-v195]
    paths: [.github/workflows/g3-figures-construction-lines-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply the verified audit patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ce6b889c64c6aee6f636e7ceb1d03629b4767b20"
          patch_file="$RUNNER_TEMP/matkvest.patch"
          cat > "$patch_file" <<'MATKVEST_PATCH'
          diff --git a/audits/g1_g4_content_audit_2026-11-17.md b/audits/g1_g4_content_audit_2026-11-17.md
          index 1afa0a5..ae01777 100644
          --- a/audits/g1_g4_content_audit_2026-11-17.md
          +++ b/audits/g1_g4_content_audit_2026-11-17.md
          @@ -1598 +1598,42 @@
           - Формулировка о многоугольнике игнорирует самопересечения замкнутой ломаной. У целочисленных ответов этот и остальные пять геометрических тренажёров используют общую подсказку вводить десятичную дробь.
          +
          +**После правок.** На разминке последовательно встречаются все пять фигур. Тренировка определяет, образует ли ломаная границу многоугольника, и распознаёт прямой угол. На мастере ученик считает прямые углы многоугольника по сетке. Числовые поля геометрии просят целые числа.
          +
          +- В Chromium по SVG независимо проверены 9 600 условий, типы фигур, замыкание, перпендикулярность, вершины, звенья и единственность правильного выбора.
          +- На 320, 390 и 1280 px пройдены 12 попыток. Проверены 81 правильный ответ, отклонение ошибки, сохранение очков и бонусов и продолжение второго вопроса на каждом уровне после F5.
          +
          +Следующая тема 3-го класса — «Отрезок, прямоугольник и квадрат на клетчатой бумаге» (`g3:geometry_construction`).
          +
          +### 2026-11-19. Отрезок, прямоугольник и квадрат на клетчатой бумаге (`g3:geometry_construction`)
          +
          +**До правок.** В Chromium проверено по 1 200 задач на уровень (зерно 19502).
          +
          +- Уровни различаются. На тренировке квадрат и прямоугольник одновременно предложены как взаимоисключающие ответы, хотя квадрат является прямоугольником.
          +- На мастере в вопросе о размерах не задан порядок записи. Фигуры и достраивание выбираются случайно.
          +
          +**После правок.** Вариант для прямоугольника явно указывает разные соседние стороны. В задании явно указан порядок размеров: по горизонтали, затем по вертикали. Типы тренировки и мастера чередуются.
          +
          +- В Chromium проверены 9 600 задач по точкам и шагу сетки SVG. Проверены длины, размеры, буквы A–D и единственный подходящий вариант. Между уровнями нет совпадающих условий с одинаковыми рисунками.
          +- На 320, 390 и 1280 px пройдены 12 попыток с 81 правильным ответом. После F5 проверены сохранённые результаты и продолжение второго вопроса всех трёх уровней на 390 px.
          +
          +Следующая тема 3-го класса — «Длина ломаной» (`g3:broken_line_length`).
          +
          +### 2026-11-19. Длина ломаной (`g3:broken_line_length`)
          +
          +**До правок.** В Chromium проверено по 1 200 задач на уровень (зерно 19502).
          +
          +- Уровни различаются по действию, одинаковых условий между уровнями нет. Мастер случайно выбирает удлинение и сравнение, поэтому обе формы не гарантированы в одной попытке. Подсказка числового поля про десятичную дробь исправлена в общем геометрическом вводе.
          +
          +**После правок.** На мастере удлинение и сравнение чередуются. Разминка сохраняет поиск суммы звеньев, тренировка — поиск длины неизвестного звена.
          +
          +- В Chromium проверены 9 600 задач. Длины подписанных звеньев сверены по координатам SVG и шагу сетки. Правильные ответы независимо рассчитаны по видимым подписям и условию.
          +- На 320, 390 и 1280 px пройдены 12 попыток и засчитан 81 правильный ответ. После F5 сохранены лучшие результаты, а на 390 px на каждом уровне восстановился второй вопрос незаконченной попытки.
          +
          +Следующая тема 3-го класса — «Периметр многоугольника, прямоугольника и квадрата» (`g3:perimeter`).
          +
          +### 2026-11-19. Периметр многоугольника, прямоугольника и квадрата (`g3:perimeter`)
          +
          +**До правок.** В Chromium проверено по 1 200 задач на уровень (зерно 19502).
          +
          +- Тексты повторяются на всех уровнях. Пересечения между уровнями — 73, 72 и 84 уникальных условия. Мастер в основном повторяет периметр квадрата и прямоугольника; для многоугольника используется одна постоянная форма.
          +- Все вопросы сводятся к прямому вычислению периметра. Нет задач на восстановление стороны и пересчёт периметра после изменения размеров.
