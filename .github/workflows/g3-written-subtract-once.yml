name: Grade 3 written subtraction audit and patch
on:
  push:
    branches: [audit/g1-g4-content-v195]
    paths:
      - .github/workflows/g3-written-subtract-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Fix training-stage borrowing threshold
        run: python3 audits/g3_written_subtract_patch.py
      - name: Install browser runtime
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Independently verify 10800 borrowing problems
        run: node audits/g3_written_subtract_generator_browser.cjs
      - name: Verify workbook completion and saved progress on 3 screen widths
        run: node audits/g3_written_subtract_progress_browser.cjs
      - name: Commit fix if both checks pass
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'Separate Grade 3 written subtraction borrowing stages (verified)'
          git push origin HEAD:audit/g1-g4-content-v195
