name: One-time Grade 5 paragraph 34 v170 PWA activation
on:
  push:
    branches:
      - audit/g5-paragraph34-20261115
    paths:
      - '.github/workflows/g5-v170-one-time.yml'
permissions:
  contents: write
jobs:
  apply-v170:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Activate all 19 Grade 5 script URLs and synchronized worker
        run: |
          python3 audits/g5_v170_activate.py
          python3 audits/g5_v170_activate.py --check
          grep -q 'const CACHE_NAME = "matkvest-iphone-v170";' sw.js
          if grep -q -E 'src="g5-[^"]+\?v=169"' index.html; then
            echo "Old v169 grade-5 script references remain" >&2
            exit 1
          fi
      - name: Commit verified versioned HTML and Service Worker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo 'v170 already activated'
          else
            git commit -m 'Release v170: fraction reduction and fresh PWA assets'
            git push origin HEAD:audit/g5-paragraph34-20261115
          fi
