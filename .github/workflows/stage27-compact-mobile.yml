name: Stage27 compact mobile UI audit
on:
  push:
    branches: [audit/stage27-mobile-final-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node audits/stage27_compact_mobile_browser.cjs
