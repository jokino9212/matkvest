name: MatKvest UI19C2 - diagnose class CTA cascade
on:
  push:
    branches: [audit/ui-stage19-20261106]
    paths:
      - .github/workflows/ui_stage19c2_css_probe.yml
      - audits/ui_stage19c2_css_probe.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  css:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ui-stage19-20261106
          persist-credentials: true
      - run: python3 audits/ui_stage19c2_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock puppeteer-core@24
      - run: node audits/ui_stage19c2_css_probe.mjs
      - name: Persist CSS diagnostic on audit branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/ui_stage19c2_css_probe.json
          git diff --cached --quiet || git commit -m "audit(ui19C2): investigate CTA style precedence"
          git pull --rebase origin audit/ui-stage19-20261106
          git push origin HEAD:audit/ui-stage19-20261106
